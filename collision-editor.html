<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#090c20" />
  <title>TAROT BREAKER — Map Editor v8</title>
  <link rel="stylesheet" href="./map-editor.css?v=8.0.0" />
</head>
<body data-collision-url="./assets/maps/star-country-gate-garden-collision.json?v=17areas-v1" data-depth-url="./assets/maps/star-country-gate-garden-depth.json?v=depth-editor-v8">
  <main id="editor">
    <iframe id="game-frame" src="./index.html?mapEditor=1&collisionEditor=1&build=map-editor-v8" title="TAROT BREAKER 星門庭園"></iframe>
    <canvas id="overlay" aria-label="マップ判定編集レイヤー"></canvas>

    <header>
      <strong>MAP EDITOR v8</strong>
      <span id="status">読み込み中…</span>
      <span id="counts"></span>
    </header>

    <nav id="tools" aria-label="編集モード">
      <button type="button" data-mode="play">PLAY</button>
      <button type="button" data-mode="walk">歩行範囲</button>
      <button type="button" data-mode="blocked">障害物</button>
      <button type="button" data-mode="behind">景色の裏</button>
      <button type="button" data-mode="edit">頂点編集</button>
      <button type="button" data-mode="erase">削除</button>
    </nav>

    <footer aria-label="編集操作">
      <button type="button" id="undo">戻す</button>
      <button type="button" id="clear-draft">未確定取消</button>
      <button type="button" id="finish">範囲確定</button>
      <button type="button" id="delete-selected">選択削除</button>
      <button type="button" id="restore-local" disabled>端末下書き復元</button>
      <button type="button" id="reset-server">初期JSON</button>
      <button type="button" id="copy">JSONコピー</button>
    </footer>

    <dialog id="output">
      <h2>Map JSON</h2>
      <p>緑＝歩ける場所、赤＝通れない場所、紫＝歩けるまま草・柱・花などの景色の裏に隠れる場所です。紫は通行判定を変えず、前後関係だけを指定します。</p>
      <textarea readonly spellcheck="false"></textarea>
      <div class="dialog-actions">
        <button type="button" id="copy-dialog">コピー</button>
        <button type="button" id="close-dialog">閉じる</button>
      </div>
    </dialog>
  </main>
  <script src="./map-editor.js?v=8.0.0"></script>
</body>
</html>

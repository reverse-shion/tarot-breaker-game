    <style id="garden-arrival-guard">
      /* Gate-only handoff: guard the composite, including inline/!important
         visible descendants, from the first HTML paint. Keep layout measurable. */
      body[data-entering-from-landing="true"] #start-screen { display:none !important; }
      body[data-entering-from-landing="true"].scene-booting:not(.scene-rendered) #game-shell { opacity:0; }
      body[data-entering-from-landing="true"].scene-booting #game-shell { pointer-events:none; }
      body[data-entering-from-landing="true"]::after {
        content:""; position:fixed; inset:0; z-index:2000; opacity:1;
        background:radial-gradient(circle at 50% 42%, #ecfcff 0 5%, #72d2ff 14%, #74afff 30%, #afccf2 48%, #d5efff 70%);
        transition:opacity .3s ease-out;
      }
      body[data-entering-from-landing="true"].scene-ready::after { opacity:0; pointer-events:none; }
      body[data-entering-from-landing="true"].scene-load-error::after { display:none; }
      body[data-entering-from-landing="true"].scene-load-error #game-shell > :not(#load-error) { display:none !important; }
      body[data-entering-from-landing="true"] #load-error:not([hidden]) {
        position:fixed; inset:0; z-index:2001; display:grid; place-items:center;
        padding:24px; background:#090c20; color:#f7f3eb; text-align:center;
      }
    </style>
    <style id="official-title-boot-fix">
      /* The title is the official root entry and must be visible before any
         Star Gate Garden assets/scripts finish loading. */
      body:not([data-entering-from-landing="true"]) #start-screen.title-screen {
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
    </style>

    <script>
      (function () {
        var fromLanding = new URLSearchParams(location.search).get("from") === "landing";
        document.body.dataset.enteringFromLanding = fromLanding ? "true" : "false";
        if (fromLanding) {
          // A stalled asset or failed deferred script must reach the existing
          // error state too. A late completion must not reveal that failed boot.
          window.failGardenArrival = function () {
            clearTimeout(window.gardenArrivalTimeout);
            document.body.classList.remove("scene-booting", "scene-ready", "scene-rendered");
            document.body.classList.add("scene-load-error");
            var error = document.getElementById("load-error");
            if (error) error.hidden = false;
          };
          window.gardenArrivalTimeout = setTimeout(window.failGardenArrival, 45000);
        }
      })();
    </script>

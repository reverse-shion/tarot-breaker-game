<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b1029">
  <title>TAROT BREAKER — 1000年前の星の国</title>
  <link rel="stylesheet" href="./game.css?v=0.3.0">
</head>
<body>
  <main id="game-shell" aria-label="TAROT BREAKER 1000年前の星の国">
    <img id="map-layer" class="map-layer" src="./assets/maps/star-country-gate-garden.webp" alt="" aria-hidden="true" draggable="false">
    <canvas id="game" aria-label="星の国を探索するゲーム画面"></canvas>

    <section id="start-screen" class="start-screen" aria-live="polite">
      <div class="start-card">
        <div class="eyebrow">TAROT BREAKER</div>
        <h1>1000年前の星の国</h1>
        <p>星門庭園</p>
        <button id="start" type="button" disabled>起動準備中…</button>
        <small id="load-note">正式シオンスプライトを読み込んでいます</small>
      </div>
    </section>

    <div id="guide" class="guide" hidden>画面左側を押して、そのまま指を動かす</div>
    <div id="joystick" class="joystick" hidden aria-hidden="true">
      <div class="joystick__ring"></div>
      <div id="joystick-knob" class="joystick__knob"></div>
    </div>
    <button id="reset" class="reset" type="button" aria-label="開始地点へ戻る" hidden>↺</button>
  </main>

  <script src="./game.js?v=0.3.0" defer></script>
</body>
</html>

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared dialogue regression check</title>
<link rel="stylesheet" href="../shared-dialogue.css?v=20260920-dialogue-ui-v3">
<style>body{background:#10172c;color:white;font-family:Arial,sans-serif}iframe{display:block;border:1px solid #aaa;margin:12px 0}pre{white-space:pre-wrap}#samples{height:190px;position:relative;transform:translateZ(0)}button{cursor:pointer}</style>
<h1>Dialogue UI regression check</h1><p>Isolated test page; does not change production event definitions.</p>
<button id="run">Run dialogue checks</button> <button id="next">Next character</button><div id="samples"></div><pre id="results">Ready</pre>
<script src="../shared-dialogue.js?v=20260920-dialogue-ui-v3"></script><script>
const names=['シオン','しおぽん','シオリエル','リュミエール','セレフィアス'];
const colors=['rgb(74, 107, 255)','rgb(255, 202, 122)','rgb(110, 90, 255)','rgb(245, 224, 140)','rgb(234, 243, 255)'];
const results=document.getElementById('results');let current=0,advances=0;
const ui=TarotDialogueUI.create({mount:document.getElementById('samples'),onAdvance:()=>advances++});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function record(label,value){results.textContent+='\n'+label+': '+JSON.stringify(value)}
function check(condition,label){if(!condition)throw Error(label);record('PASS',label)}
function sample(){ui.show({speaker:names[current],text:'名前は共鳴色、本文は白。タップで全文表示。',actor:'test'});}
document.getElementById('next').onclick=()=>{current=(current+1)%names.length;sample()};sample();
async function until(fn){for(let i=0;i<600;i++){const value=fn();if(value)return value;await wait(100)}throw Error('Timed out waiting for map dialogue')}
function inspect(doc){const layer=doc.querySelector('.tb-dialogue-layer'),e=doc.querySelector('.tb-dialogue-speaker'),s=doc.defaultView.getComputedStyle(e),w=doc.querySelector('.tb-dialogue-window'),r=w.getBoundingClientRect();return {speaker:layer.dataset.speaker,color:s.color,shadow:s.textShadow,weight:s.fontWeight,body:doc.defaultView.getComputedStyle(doc.querySelector('.tb-dialogue-text')).color,width:r.width,height:r.height,x:r.x,y:r.y}}
async function frameMap(width,height,path){const frame=document.createElement('iframe');frame.width=width;frame.height=height;frame.src='../'+path;document.body.append(frame);await until(()=>frame.contentDocument?.querySelector('.tb-dialogue-layer'));return frame}
document.getElementById('run').onclick=async()=>{results.textContent='Running';try{
 for(let i=0;i<names.length;i++){ui.show({speaker:names[i],text:'テスト本文',actor:'actor-'+i});await wait(40);const value=inspect(document);check(value.color===colors[i]&&value.weight==='700'&&value.shadow!=='none',names[i]);check(ui.elements.layer.dataset.actor==='actor-'+i,'actor');record('computed',value)}
 ui.show({speaker:'シオン',text:'全文表示と次への進行を分けて確認する文章です。',actor:'shion'});await wait(45);check(ui.isTyping(),'typewriter starts');ui.elements.button.click();check(ui.isComplete()&&advances===0,'first tap reveals only');ui.elements.button.click();check(advances===1,'second tap advances once');ui.show({text:'cancel'});ui.hide();await wait(45);check(ui.elements.layer.hidden&&!ui.elements.layer.classList.contains('visible'),'hide cancels pending frame');
 for(const size of [[390,844],[820,1180]]){
 sessionStorage.setItem('tarot-breaker:map-journey-v1',JSON.stringify({companion:{mode:'waiting'},landingMemoryDone:true}));
 const frame=await frameMap(...size,'star-country-landing.html?from=alenon');const doc=frame.contentDocument;
 await until(()=>doc.querySelector('.tb-dialogue-layer:not([hidden])')?.dataset.speaker==='しおぽん');
 let value=inspect(doc);check(value.color===colors[1],'PAD Shiopon '+size);check(value.x>=0&&value.x+value.width<=size[0]&&value.y+value.height<=size[1],'viewport fit '+size);record('PAD computed',value);
 await wait(100);doc.querySelector('.tb-dialogue-window').click();check(doc.querySelectorAll('.tb-dialogue-char:not(.revealed)').length===0,'PAD reveal');doc.querySelector('.tb-dialogue-window').click();
 await until(()=>doc.querySelector('.tb-dialogue-layer:not([hidden])')?.dataset.speaker==='シオン');value=inspect(doc);check(value.color===colors[0],'PAD Shion '+size);record('PAD computed',value);
 }
 current=0;sample();record('DONE','All checks passed');
}catch(e){record('FAIL',e.message)}};
</script></html>

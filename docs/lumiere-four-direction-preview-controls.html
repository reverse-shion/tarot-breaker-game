<!-- Verification-only controls. Never loaded by the normal index.html. -->
<aside id="lumiere-fixed-check" hidden aria-label="リュミエール4方向の実装確認">
  <button type="button" id="lumiere-check-panel-toggle" aria-expanded="false" aria-controls="lumiere-check-panel-content">確認パネルを開く</button>
  <div id="lumiere-check-panel-content" hidden>
  <div>DEV：4方向の浮遊・毛先・裾先確認</div>
  <small id="lumiere-check-spec">設定読み込み中（更新候補の値を表示します）</small>
  <small id="lumiere-check-diagnostics">毛先・裾先の画素変化を測定中</small>
  <div class="lumiere-fixed-check-buttons">
    <button type="button" id="lumiere-check-position" disabled>確認位置へ</button>
    <button type="button" data-lumiere-face="down" disabled>正面</button>
    <button type="button" data-lumiere-face="up" disabled>背面</button>
    <button type="button" data-lumiere-face="left" disabled>左</button>
    <button type="button" data-lumiere-face="right" disabled>右</button>
    <button type="button" id="lumiere-check-sway" disabled aria-pressed="true">揺れ：ON</button>
  </div>
  <output id="lumiere-fixed-check-status" aria-live="polite">読み込み中</output>
  </div>
</aside>
<style>
#lumiere-fixed-check {position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;right:8px;z-index:1500;padding:6px 9px;background:rgba(15,17,37,.94);color:#f7f3ed;border:1px solid #807292;border-radius:10px;font:13px/1.4 system-ui,sans-serif;max-width:500px;max-height:35vh;overflow:auto;box-sizing:border-box}
#lumiere-fixed-check[hidden] {display:none}
#lumiere-check-panel-content[hidden] {display:none}
#lumiere-check-panel-content {padding-top:5px}
#lumiere-fixed-check small {display:block;color:#e1dbe9}
#lumiere-fixed-check .lumiere-fixed-check-buttons {display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
#lumiere-fixed-check button {min-height:40px;padding:6px 10px;background:#302843;color:#f7f3ed;border:1px solid #8b7ba4;border-radius:6px;font:inherit}
#lumiere-fixed-check button:disabled {opacity:.5}
#lumiere-fixed-check output {display:block;font-size:12px}
</style>
<script>
(function () {
  "use strict";
  const params = new URLSearchParams(location.search);
  if (params.getAll("dev").length !== 1 || params.get("dev") !== "garden-resume-after-lumiere" || params.has("from")) return;
  const panel = document.getElementById("lumiere-fixed-check");
  const status = document.getElementById("lumiere-fixed-check-status");
  const buttons = [...panel.querySelectorAll(".lumiere-fixed-check-buttons button")];
  const panelContent = document.getElementById("lumiere-check-panel-content");
  const panelToggle = document.getElementById("lumiere-check-panel-toggle");
  function setPanelOpen(open) {
    panelContent.hidden = !open;
    panelToggle.setAttribute("aria-expanded", String(open));
    panelToggle.textContent = open ? "確認パネルを閉じる" : "確認パネルを開く";
  }
  panelToggle.addEventListener("click", () => setPanelOpen(panelContent.hidden));
  panel.hidden = false;
  const ready = () => {
    if (!document.body.classList.contains("scene-ready") || !window.TarotStage) return;
    buttons.forEach(button => { button.disabled = false; });
    const sway = window.TarotLumiereSway;
    if (!sway?.config || !sway?.getDiagnostics) {
      status.textContent = "揺れモジュールを読み込めません。動作確認は不可";
      return;
    }
    const c = sway.config;
    document.getElementById("lumiere-check-spec").textContent =
      "候補" + c.candidate + "／毛先" + c.amplitude.hair + "px・裾先" +
      c.amplitude.hem + "px（全身浮遊は" + c.bobPeriod + "秒周期）";
    const report = ["down", "up", "left", "right"].map(dir => sway.getDiagnostics(dir));
    if (report.some(value => !value)) {
      status.textContent = "4方向の画素診断が揃っていません。動作確認は不可";
      return;
    }
    function display(dir) {
      const d = sway.getDiagnostics(dir);
      const label = {down:"正面",up:"背面",left:"左",right:"右"}[dir];
      const lines = d?.regions?.map(r => r.kind + ":" + r.changed).join(" / ");
      document.getElementById("lumiere-check-diagnostics").textContent =
        label + "：変化画素" + (d?.changed ?? "?") +
        "（輪郭" + (d?.silhouette ?? "?") + "） " + lines;
      if (!d?.changed || !d.silhouette) status.textContent =
        "注意：動く輪郭が測定できません。領域と素材を再確認";
    }
    window.lumiereDevicePreviewReport = display;
    display("down");
    status.textContent = "確認位置へ → 実機で髪束と裾の揺れを確認";
    observer.disconnect();
  };
  const observer = new MutationObserver(ready);
  observer.observe(document.body, { attributes: true, attributeFilter: ["class"] });
  ready();
  document.getElementById("lumiere-check-position").addEventListener("click", async () => {
    buttons.forEach(button => { button.disabled = true; });
    const action = window.TarotStage.perform({ type: "move", actor: "shion", target: { x: 810, y: 290 }, duration: 1400 });
    const result = await action.promise;
    buttons.forEach(button => { button.disabled = false; });
    status.textContent = result.completed ? "各方向を約10秒。揺れON/OFFで比較できます" : "確認位置へ移動できませんでした";
    if (result.completed) setPanelOpen(false);
  });
  document.getElementById("lumiere-check-sway").addEventListener("click", event => {
    const sway = window.TarotLumiereSway;
    if (!sway) return;
    sway.setEnabled(!sway.isEnabled());
    event.currentTarget.textContent = "揺れ：" + (sway.isEnabled() ? "ON" : "OFF");
    event.currentTarget.setAttribute("aria-pressed", String(sway.isEnabled()));
    status.textContent = "上下浮遊の位相は維持。毛先と裾先だけを比較";
  });
  for (const button of panel.querySelectorAll("[data-lumiere-face]")) {
    button.addEventListener("click", async () => {
      const actor = window.TarotStage.getState().actors.lumiere;
      const delta = { down: [0, 10], up: [0, -10], left: [-10, 0], right: [10, 0] }[button.dataset.lumiereFace];
      await window.TarotStage.perform({ type: "face", actor: "lumiere", target: { x: actor.x + delta[0], y: actor.y + delta[1] } }).promise;
      window.lumiereDevicePreviewReport?.(button.dataset.lumiereFace);
      status.textContent = button.textContent + "：上下運動の位相を維持して表示";
    });
  }
})();
</script>

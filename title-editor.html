<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>TAROT BREAKER Title Editor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:#fff;font-family:system-ui,sans-serif;touch-action:none}
#stage{position:absolute;inset:0;overflow:hidden;background:#050817}
#bg{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;transform:translate(-50%,-50%) scale(1);transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,4,15,.12),transparent 48%,rgba(1,3,12,.3));pointer-events:none}
#logo{position:absolute;left:50%;top:38%;width:88vw;max-width:940px;transform:translate(-50%,-50%) scale(1);transform-origin:center;filter:drop-shadow(0 8px 24px rgba(0,0,0,.72));user-select:none;-webkit-user-drag:none;touch-action:none}
#panel{position:absolute;z-index:5;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));padding:10px;border:1px solid rgba(240,215,157,.5);border-radius:14px;background:rgba(7,10,25,.86);backdrop-filter:blur(10px)}
.row{display:flex;gap:7px;align-items:center;margin:6px 0}.row b{width:54px;font-size:11px}.row button{flex:1;min-height:38px;border:1px solid rgba(240,215,157,.55);border-radius:9px;background:rgba(255,255,255,.08);color:#fff;font-size:13px}.row button.on{background:#d9b767;color:#111}
#values{font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;color:#e9dbb7}
#copy{width:100%;min-height:42px;margin-top:6px;border:0;border-radius:9px;background:#ead39a;color:#15182b;font-weight:700}
#hint{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.5);font-size:11px;white-space:nowrap;pointer-events:none}
</style></head><body>
<div id="stage"><img id="bg" src="./assets/ui/title/title-background.webp?v=20260919" alt=""><div id="shade"></div><img id="logo" src="./assets/ui/title/tarot-breaker-logo.webp?v=20260919" alt="TAROT BREAKER"></div>
<div id="hint">対象を選択 → 画面をドラッグして位置調整</div>
<div id="panel">
<div class="row"><b>対象</b><button id="selLogo" class="on">ロゴ</button><button id="selBg">背景</button><button id="reset">リセット</button></div>
<div class="row"><b>サイズ</b><button id="minus">−</button><button id="plus">＋</button><button id="fit">標準</button></div>
<div id="values"></div><button id="copy">設定をコピー</button>
</div>
<script>
const bg=document.querySelector('#bg'),logo=document.querySelector('#logo'),stage=document.querySelector('#stage'),values=document.querySelector('#values');
const state={logo:{x:50,y:38,s:1},bg:{x:50,y:50,s:1}};let target='logo',drag=null;
function apply(){const l=state.logo,b=state.bg;logo.style.left=l.x+'%';logo.style.top=l.y+'%';logo.style.transform='translate(-50%,-50%) scale('+l.s+')';bg.style.left=b.x+'%';bg.style.top=b.y+'%';bg.style.transform='translate(-50%,-50%) scale('+b.s+')';values.textContent='LOGO  X '+l.x.toFixed(1)+'%  Y '+l.y.toFixed(1)+'%  SCALE '+l.s.toFixed(2)+'\nBG    X '+b.x.toFixed(1)+'%  Y '+b.y.toFixed(1)+'%  SCALE '+b.s.toFixed(2)}
function select(t){target=t;selLogo.classList.toggle('on',t==='logo');selBg.classList.toggle('on',t==='bg')}
selLogo.onclick=()=>select('logo');selBg.onclick=()=>select('bg');
stage.addEventListener('pointerdown',e=>{e.preventDefault();drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:state[target].x,sy:state[target].y};stage.setPointerCapture?.(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;e.preventDefault();state[target].x=drag.sx+(e.clientX-drag.x)/innerWidth*100;state[target].y=drag.sy+(e.clientY-drag.y)/innerHeight*100;apply()});
function end(e){if(drag?.id===e.pointerId)drag=null}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
minus.onclick=()=>{state[target].s=Math.max(.5,state[target].s-.05);apply()};plus.onclick=()=>{state[target].s=Math.min(2.5,state[target].s+.05);apply()};
fit.onclick=()=>{state[target].s=1;apply()};reset.onclick=()=>{Object.assign(state.logo,{x:50,y:38,s:1});Object.assign(state.bg,{x:50,y:50,s:1});apply()};
copy.onclick=async()=>{const l=state.logo,b=state.bg;const t='TITLE EDITOR\nlogo: x='+l.x.toFixed(1)+'%, y='+l.y.toFixed(1)+'%, scale='+l.s.toFixed(2)+'\nbackground: x='+b.x.toFixed(1)+'%, y='+b.y.toFixed(1)+'%, scale='+b.s.toFixed(2);try{await navigator.clipboard.writeText(t);copy.textContent='コピーしました';setTimeout(()=>copy.textContent='設定をコピー',1200)}catch{prompt('この設定をコピーしてください',t)}};
apply();
</script></body></html>

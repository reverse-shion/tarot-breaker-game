<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#06142d" />
  <script data-map-zone-editor-redirect="v1">
    (() => {
      const p = new URLSearchParams(location.search);
      if (p.get("collision") === "1" && p.get("legacyCollision") !== "1") {
        location.replace("./tools/map-zone-editor.html?map=alenon");
      }
    })();
  </script>
  <title>TAROT BREAKER — アレノンの遺跡</title>
  <style>
    :root {
      --world-w: 1448;
      --world-h: 1086;

      /* Ground layout: 1448x1086 reference space */
      --ground-s-x: 0px;
      --ground-s-y: -12px;
      --ground-s-scale: .86;

      --ground-side-x: 0px;
      --ground-side-y: 0px;
      --ground-side-scale: 1;

      /* Front pad */
      --pad-x: 730.9px;
      --pad-y: 857.3px;
      --pad-size: 140px;

      /* Rear orb */
      --orb-x: 716px;
      --orb-y: 254.1px;
      --orb-size: 449px;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #06142d;
    }
    body {
      touch-action: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #viewport {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(63,139,255,.14), transparent 55%),
        #06142d;
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 1448px;
      height: 1086px;
      transform-origin: 0 0;
      will-change: transform;
      overflow: hidden;
      background: #0a2e62;
      isolation: isolate;
    }

    .layer,
    .ground {
      position: absolute;
      inset: 0;
      width: 1448px;
      height: 1086px;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .bg {
      z-index: 0;
      object-fit: cover;
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 24%, rgba(173,222,255,.10) 0 16%, transparent 44%),
        linear-gradient(to bottom, rgba(0,15,55,.05), rgba(0,28,70,.03) 66%, rgba(3,18,46,.16));
    }

    .ground {
      z-index: 10;
      object-fit: contain;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .ground-drift,
    .ground-anchor {
      position: absolute;
      inset: 0;
      width: 1448px;
      height: 1086px;
      z-index: 10;
      pointer-events: none;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .ground-center {
      z-index: 12;
      transform: translate3d(var(--ground-s-x), var(--ground-s-y), 0)
                 scale(var(--ground-s-scale));
    }

    .ruin-drift {
      transform-origin: 50% 50%;
    }

    .ruin-drift-left {
      filter:
        saturate(.72)
        brightness(.82)
        contrast(1.04);
    }

    /* Left ruin PAD: depleted / offline.
       This is a filtered duplicate of ground_l, radially masked around the baked-in PAD.
       It darkens only opaque ruin pixels, not the sky behind it. */
    .left-ruin-energy-off {
      z-index: 11;
      opacity: 1;
      filter:
        grayscale(.96)
        saturate(.10)
        brightness(.28)
        contrast(1.14)
        sepia(.08);
      -webkit-mask-image:
        radial-gradient(
          ellipse 405px 217px at
          var(--left-pad-dead-x, 782px)
          var(--left-pad-dead-y, 967px),
          #000 0%,
          #000 48%,
          rgba(0,0,0,.96) 66%,
          rgba(0,0,0,.58) 84%,
          transparent 100%
        );
      mask-image:
        radial-gradient(
          ellipse 405px 217px at
          var(--left-pad-dead-x, 782px)
          var(--left-pad-dead-y, 967px),
          #000 0%,
          #000 48%,
          rgba(0,0,0,.96) 66%,
          rgba(0,0,0,.58) 84%,
          transparent 100%
        );
      pointer-events: none;
    }

    .left-pad-dead-vignette {
      position: absolute;
      left: var(--left-pad-dead-x, 782px);
      top: var(--left-pad-dead-y, 967px);
      z-index: 12;
      width: 430px;
      height: 250px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      opacity: .90;
      background:
        radial-gradient(
          ellipse at center,
          rgba(2,7,18,.76) 0 25%,
          rgba(4,10,24,.52) 46%,
          rgba(5,12,28,.22) 68%,
          transparent 86%
        );
      mix-blend-mode: multiply;
      filter: blur(11px);
    }


    .pad {
      position: absolute;
      z-index: 20;
      left: var(--pad-x);
      top: var(--pad-y);
      width: var(--pad-size);
      height: var(--pad-size);
      object-fit: contain;
      transform: translate(-50%, -50%);
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      filter: drop-shadow(0 0 12px rgba(107,206,255,.20));
    }

    .pad-flight-trail {
      position: absolute;
      z-index: 18;
      width: 92px;
      height: 150px;
      border-radius: 50%;
      transform: translate(-50%, -10%);
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(ellipse at 50% 5%, rgba(180,235,255,.34), transparent 42%),
        linear-gradient(to bottom, rgba(118,211,255,.24), rgba(94,145,255,.08) 45%, transparent 100%);
      filter: blur(11px);
      transition: opacity .28s ease;
    }

    body.pad-boarding .pad,
    body.pad-riding .pad,
    body.pad-landing .pad,
    body.pad-exiting .pad {
      z-index: 42;
      filter:
        brightness(1.22)
        drop-shadow(0 0 15px rgba(126,224,255,.78))
        drop-shadow(0 0 30px rgba(95,157,255,.38));
    }

    body.pad-boarding .pad-glow,
    body.pad-riding .pad-glow,
    body.pad-landing .pad-glow,
    body.pad-exiting .pad-glow {
      z-index: 41;
      opacity: 1;
      filter: blur(7px);
    }

    body.pad-riding .pad-flight-trail,
    body.pad-landing .pad-flight-trail,
    body.pad-exiting .pad-flight-trail {
      opacity: .82;
    }

    body.pad-riding .shion-shadow,
    body.pad-boarding .shion-shadow,
    body.pad-landing .shion-shadow,
    body.pad-exiting .shion-shadow {
      opacity: 0;
    }

    body.pad-riding #object-toggle,
    body.pad-boarding #object-toggle,
    body.pad-landing #object-toggle,
    body.pad-exiting #object-toggle,
    body.pad-exiting #move-reset {
      display: none !important;
    }

    #flight-status {
      position: fixed;
      left: 50%;
      top: max(16px, calc(env(safe-area-inset-top) + 12px));
      z-index: 400;
      transform: translateX(-50%);
      padding: 8px 13px;
      border: 1px solid rgba(194,229,255,.28);
      border-radius: 999px;
      color: rgba(255,255,255,.96);
      background: rgba(5,13,35,.64);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .02em;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    body.pad-boarding #flight-status,
    body.pad-riding #flight-status,
    body.pad-landing #flight-status,
    body.pad-exiting #flight-status {
      opacity: 1;
    }

    #map-transition {
      position: fixed;
      inset: 0;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 50% 68%, rgba(195,239,255,.45), transparent 24%),
        linear-gradient(to bottom, rgba(9,35,75,0), rgba(135,208,255,.28) 58%, rgba(239,250,255,.96));
      transition: opacity .78s ease;
    }

    body.pad-exiting #map-transition {
      opacity: 1;
    }

    .pad-glow {
      position: absolute;
      z-index: 19;
      left: var(--pad-x);
      top: var(--pad-y);
      width: calc(var(--pad-size) * .50);
      height: calc(var(--pad-size) * .25);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(ellipse, rgba(112,220,255,.24), rgba(84,161,255,.08) 46%, transparent 74%);
      filter: blur(11px);
      animation: pad-breathe 4.8s ease-in-out infinite;
    }

    .orb {
      position: absolute;
      left: var(--orb-x);
      top: var(--orb-y);
      width: var(--orb-size);
      height: var(--orb-size);
      object-fit: contain;
      transform-origin: 50% 50%;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .orb-outer {
      z-index: 46;
      transform: translate(-50%, -50%);
      animation: orb-outer-spin 28s linear infinite;
    }

    .orb-inner {
      z-index: 47;
      transform: translate(-50%, -50%);
      animation: orb-inner-spin 17s linear infinite reverse;
    }

    .orb-core {
      z-index: 48;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 18px rgba(118,220,255,.58));
      animation: orb-core-breathe 3.7s ease-in-out infinite;
    }

    .orb-particle {
      z-index: 49;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      animation:
        orb-particle-spin 36s linear infinite,
        orb-particle-fade 5.2s ease-in-out infinite;
    }

    .orb-aura {
      position: absolute;
      z-index: 45;
      left: var(--orb-x);
      top: var(--orb-y);
      width: calc(var(--orb-size) * .60);
      height: calc(var(--orb-size) * .60);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(101,216,255,.22), rgba(93,150,255,.08) 46%, transparent 72%);
      filter: blur(16px);
      animation: orb-aura 4.2s ease-in-out infinite;
    }


    /* --- Prologue ORB anomaly / wind --- */
    #alenon-wind {
      position: absolute;
      z-index: 50;
      left: var(--orb-x);
      top: var(--orb-y);
      width: 360px;
      height: 190px;
      transform: translate(-50%, -50%) scale(.15);
      transform-origin: 50% 50%;
      opacity: 0;
      pointer-events: none;
      filter:
        drop-shadow(0 0 12px rgba(171, 225, 255, .35))
        blur(.15px);
      transition:
        transform .86s cubic-bezier(.22,.61,.36,1),
        opacity .56s ease,
        top 1.25s cubic-bezier(.22,.61,.36,1);
    }

    .alenon-wind-streak {
      position: absolute;
      left: 50%;
      height: 42px;
      border-top: 3px solid rgba(219, 242, 255, .78);
      border-radius: 50%;
      transform-origin: 50% 50%;
      opacity: .82;
    }

    .alenon-wind-streak:nth-child(1) {
      top: 38px;
      width: 250px;
      margin-left: -128px;
      transform: rotate(4deg);
    }

    .alenon-wind-streak:nth-child(2) {
      top: 78px;
      width: 305px;
      margin-left: -152px;
      border-top-width: 2px;
      opacity: .60;
      transform: rotate(-5deg);
    }

    .alenon-wind-streak:nth-child(3) {
      top: 111px;
      width: 215px;
      margin-left: -92px;
      border-top-width: 2px;
      opacity: .72;
      transform: rotate(7deg);
    }

    .alenon-wind-streak:nth-child(4) {
      top: 142px;
      width: 155px;
      margin-left: -116px;
      border-top-width: 1px;
      opacity: .48;
      transform: rotate(-3deg);
    }

    body.orb-anomaly .orb-outer {
      animation: orb-anomaly-outer .92s cubic-bezier(.18,.72,.18,1) forwards !important;
    }

    body.orb-anomaly .orb-inner {
      animation: orb-anomaly-inner .92s cubic-bezier(.18,.72,.18,1) forwards !important;
    }

    body.orb-anomaly .orb-particle {
      animation: orb-anomaly-particle .92s cubic-bezier(.18,.72,.18,1) forwards !important;
    }

    body.orb-anomaly .orb-aura {
      animation: orb-anomaly-aura .92s cubic-bezier(.18,.72,.18,1) forwards !important;
    }

    body.orb-anomaly .orb-core {
      z-index: 51;
      animation: orb-core-event-idle 2.8s ease-in-out infinite !important;
    }

    body.orb-core-pulse .orb-core {
      animation: orb-core-event-pulse .72s ease-in-out 1 !important;
    }

    body.orb-wind-born #alenon-wind {
      opacity: .94;
      transform: translate(-50%, -50%) scale(1);
    }

    /* First wind: leave the ORB core and travel all the way off the lower edge.
       The wind stays visible for most of the travel, then fades only at the end. */
    body.orb-wind-escape #alenon-wind {
      animation: alenon-wind-escape 1.58s cubic-bezier(.18,.66,.22,1) forwards;
    }

    body.orb-wind-escape .alenon-wind-streak {
      animation: alenon-wind-breathe .78s ease-in-out infinite alternate;
    }

    /* Second wind: expands from the remaining core and reconstructs the ORB. */
    body.orb-restore-wind #alenon-wind {
      animation: alenon-restore-wind .98s cubic-bezier(.22,.61,.36,1) forwards;
    }

    body.orb-restoring .orb-aura {
      animation: orb-restore-aura .78s cubic-bezier(.22,.61,.36,1) forwards !important;
    }

    body.orb-restoring .orb-inner {
      animation: orb-restore-inner .88s cubic-bezier(.22,.61,.36,1) forwards !important;
    }

    body.orb-restoring .orb-outer {
      animation: orb-restore-outer .96s cubic-bezier(.22,.61,.36,1) forwards !important;
    }

    body.orb-restoring .orb-particle {
      animation: orb-restore-particle 1.02s cubic-bezier(.22,.61,.36,1) forwards !important;
    }

    @keyframes orb-anomaly-outer {
      0% { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
      45% { opacity: .82; transform: translate(-50%, -50%) rotate(10deg) scale(1.42); }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(24deg) scale(2.18); }
    }

    @keyframes orb-anomaly-inner {
      0% { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
      48% { opacity: .78; transform: translate(-50%, -50%) rotate(-14deg) scale(1.38); }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(-30deg) scale(2.04); }
    }

    @keyframes orb-anomaly-particle {
      0% { opacity: .88; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
      58% { opacity: .54; transform: translate(-50%, -50%) rotate(16deg) scale(1.55); }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(38deg) scale(2.24); }
    }

    @keyframes orb-anomaly-aura {
      0% { opacity: .75; transform: translate(-50%, -50%) scale(1); }
      60% { opacity: .48; transform: translate(-50%, -50%) scale(1.62); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.30); }
    }

    @keyframes orb-core-event-idle {
      0%, 100% {
        opacity: .90;
        transform: translate(-50%, -50%) scale(.98);
        filter: drop-shadow(0 0 18px rgba(118,220,255,.58));
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.035);
        filter: drop-shadow(0 0 30px rgba(145,229,255,.84));
      }
    }

    @keyframes orb-core-event-pulse {
      0%, 100% {
        opacity: .94;
        transform: translate(-50%, -50%) scale(1);
        filter: drop-shadow(0 0 20px rgba(118,220,255,.64));
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.085);
        filter:
          brightness(1.22)
          drop-shadow(0 0 42px rgba(176,239,255,.96));
      }
    }

    @keyframes alenon-wind-breathe {
      from { filter: brightness(.94); }
      to { filter: brightness(1.18); }
    }

    @keyframes alenon-wind-escape {
      0% {
        opacity: .94;
        transform: translate(-50%, -50%) scale(1);
      }
      72% {
        opacity: .82;
        transform: translate(-50%, calc(-50% + 520px)) scale(1.08);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, calc(-50% + 720px)) scale(1.12);
      }
    }

    @keyframes alenon-restore-wind {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.16);
        filter: brightness(1);
      }
      28% {
        opacity: .88;
        transform: translate(-50%, -50%) scale(.52);
        filter: brightness(1.18);
      }
      72% {
        opacity: .74;
        transform: translate(-50%, -50%) scale(1.10);
        filter: brightness(1.08);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.34);
        filter: brightness(.96);
      }
    }

    @keyframes orb-restore-aura {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.92);
      }
      100% {
        opacity: .72;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes orb-restore-inner {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-24deg) scale(1.88);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0deg) scale(1);
      }
    }

    @keyframes orb-restore-outer {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(22deg) scale(2.08);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0deg) scale(1);
      }
    }

    @keyframes orb-restore-particle {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(34deg) scale(1.78);
      }
      100% {
        opacity: .88;
        transform: translate(-50%, -50%) rotate(0deg) scale(1);
      }
    }

    /* Shion keeps the Star Gate Garden on-screen draw height: 78px.
       The map/camera zooms independently; inverse scale prevents Shion from growing. */
    .shion-shadow {
      position: absolute;
      z-index: 43;
      left: 730px;
      top: 949px;
      width: 34px;
      height: 11px;
      transform: translate(-50%, -50%) scale(var(--actor-inverse-scale, 1));
      transform-origin: 50% 50%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(ellipse, rgba(3, 7, 22, .50), rgba(3, 7, 22, .18) 56%, transparent 76%);
      filter: blur(1px);
    }

    .shion-actor {
      position: absolute;
      z-index: 44;
      left: 730px;
      top: 949px;
      width: 58.5px;
      height: 78px;
      transform: translate(-50%, -100%) scale(var(--actor-inverse-scale, 1));
      transform-origin: 50% 100%;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      background-image: url("./assets/sprites/shion/shion_idle.png");
      background-repeat: no-repeat;
      /* 4 x 384x512 cells rendered with DRAW_HEIGHT=78, matching game.js. */
      background-size: 234px 78px;
      /* idle frame order is down, up, left, right: show UP toward the ruins. */
      background-position: -58.5px 0;
      image-rendering: pixelated;
      filter:
        drop-shadow(0 1px 0 rgba(255,255,255,.14))
        drop-shadow(0 2px 2px rgba(3,7,22,.46));
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(4,10,32,.10), transparent 20%, transparent 76%, rgba(4,10,32,.13)),
        radial-gradient(ellipse at center, transparent 62%, rgba(1,10,30,.13) 100%);
    }

    @keyframes pad-breathe {
      0%, 100% { opacity: .56; transform: translate(-50%, -50%) scale(.96); }
      50% { opacity: .90; transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes orb-outer-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes orb-inner-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes orb-particle-spin {
      from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
      to { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
    }

    @keyframes orb-particle-fade {
      0%, 100% { opacity: .56; }
      50% { opacity: .94; }
    }

    @keyframes orb-core-breathe {
      0%, 100% {
        opacity: .90;
        transform: translate(-50%, -50%) scale(.97);
        filter: drop-shadow(0 0 16px rgba(118,220,255,.50));
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.035);
        filter: drop-shadow(0 0 28px rgba(118,220,255,.78));
      }
    }

    @keyframes orb-aura {
      0%, 100% { opacity: .58; transform: translate(-50%, -50%) scale(.94); }
      50% { opacity: .92; transform: translate(-50%, -50%) scale(1.08); }
    }

    /* Add ?debug=1 to the URL when fine-tuning placement. */
    body.debug #world::before,
    body.debug #world::after {
      content: "";
      position: absolute;
      z-index: 99;
      pointer-events: none;
      background: rgba(255, 92, 92, .55);
    }

    body.debug #world::before {
      left: 723px;
      top: 0;
      width: 2px;
      height: 1086px;
    }

    body.debug #world::after {
      left: 0;
      top: 542px;
      width: 1448px;
      height: 2px;
    }

    body.debug .pad,
    body.debug .orb {
      outline: 2px solid rgba(255,225,80,.72);
    }



    /* Alenon movement UI */
    #move-guide {
      position: fixed;
      left: 50%;
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 18px));
      z-index: 200;
      transform: translateX(-50%);
      max-width: min(86vw, 420px);
      padding: 8px 13px;
      border: 1px solid rgba(195, 225, 255, .22);
      border-radius: 999px;
      color: rgba(255,255,255,.94);
      background: rgba(4, 12, 34, .64);
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      backdrop-filter: blur(8px);

    #tarot-stage {
      position: relative;
      width: min(52vw, 410px);
      height: min(69vh, 615px);
      opacity: 0;
      transform: translateY(8px) scale(.985);
      transition:
        opacity .5s ease,
        transform .7s cubic-bezier(.22,.61,.36,1);
      perspective: 1100px;
      pointer-events: none;
    }

    #tarot-stage.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #tarot-stack,
    #tarot-drawn {
      position: absolute;
      inset: 0;
      margin: auto;
      width: min(43.3vh, 286px);
      height: min(65vh, 429px);
    }

    #tarot-stack {
      z-index: 1;
      transition: opacity .35s ease, transform .55s ease;
    }

    #tarot-stack img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter:
        drop-shadow(0 14px 24px rgba(0, 0, 0, .54))
        drop-shadow(0 0 18px rgba(151, 137, 255, .10));
    }

    #tarot-stack img:nth-child(1) { transform: translate(-5px, 3px) rotate(-.8deg); opacity: .52; }
    #tarot-stack img:nth-child(2) { transform: translate(-2px, 1px) rotate(-.3deg); opacity: .72; }
    #tarot-stack img:nth-child(3) { transform: translate(2px, 1px) rotate(.35deg); opacity: .86; }
    #tarot-stack img:nth-child(4) { transform: translate(0, 0); opacity: 1; }

    #tarot-stack.is-shuffling img:nth-child(1) { animation: tarot-shuffle-left .42s ease-in-out; }
    #tarot-stack.is-shuffling img:nth-child(2) { animation: tarot-shuffle-right .42s .04s ease-in-out; }
    #tarot-stack.is-shuffling img:nth-child(3) { animation: tarot-shuffle-left .42s .08s ease-in-out reverse; }

    #tarot-drawn {
      z-index: 3;
      opacity: 0;
      transform: translateY(42px) scale(.985);
      transition:
        opacity .34s ease,
        transform .58s cubic-bezier(.22,.61,.36,1);

      opacity: 1;
      transform: translateY(-18px) scale(1);
    }

    .tarot-card-inner {
      position: absolute;
      inset: 0;
      transform: scaleX(1);
      transform-origin: 50% 50%;
      transition: transform .28s cubic-bezier(.22,.61,.36,1);
      filter:
        drop-shadow(0 16px 28px rgba(0, 0, 0, .58))
        drop-shadow(0 0 20px rgba(161, 146, 255, .12));

    #tarot-drawn.is-flipping .tarot-card-inner {
      transform: scaleX(.035);
    }

    #tarot-drawn.is-flipped .tarot-card-inner {
      transform: scaleX(1.035);
    }

    .tarot-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity .01s linear;
    }

    .tarot-face-back { opacity: 1; }
    .tarot-face-front { opacity: 0; }

    #tarot-drawn.show-front .tarot-face-back { opacity: 0; }
    #tarot-drawn.show-front .tarot-face-front { opacity: 1; }

    /* Dialogue UI: classic JRPG readability with TAROT BREAKER styling.
       The window itself identifies speech, so dialogue text does not use Japanese quote marks. */
    #prologue-dialogue {
      position: fixed;
      left: 50%;
      bottom: max(26px, calc(env(safe-area-inset-bottom) + 20px));
      z-index: 2300;
      width: min(92vw, 720px);
      min-height: 132px;

      transform: translate(-50%, 10px);

        linear-gradient(180deg, rgba(11, 18, 46, .94), rgba(5, 10, 29, .91));

      box-shadow:
        0 14px 38px rgba(0, 0, 0, .38),
        inset 0 1px 0 rgba(255, 243, 207, .06);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .25s ease;

    #prologue-speaker {

      letter-spacing: .015em;
      text-wrap: pretty;
      overflow-wrap: anywhere;
    }

    /* Keep the full sentence in layout while revealing characters.

    #prologue-line .dialogue-char {

          alenonWindAmbience.volume = startVolume + (target - startVolume) * t;
          if (t < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);

      async function ensureStoryAudio() {

        const Context = window.AudioContext || window.webkitAudioContext;

          }
          return storyAudioContext;
        } catch (_) {

      }

      function playPaperShuffle(strength = 1) {
        const ctx = storyAudioContext;
        if (!ctx || ctx.state !== "running") return;
        const duration = .075 + Math.random() * .045;
        const frameCount = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const buffer = ctx.createBuffer(1, frameCount, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < frameCount; i++) {
          const envelope = Math.sin(Math.PI * i / frameCount);
          data[i] = (Math.random() * 2 - 1) * envelope;
        }
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1450 + Math.random() * 500;
        filter.Q.value = .7;
        const gain = ctx.createGain();
        gain.gain.value = .07 * strength;
        source.connect(filter).connect(gain).connect(ctx.destination);
        source.start();
      }

      function playTarotResonance() {
        const ctx = storyAudioContext;
        if (!ctx || ctx.state !== "running") return;
        const now = ctx.currentTime;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.045, now + .06);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .75);
        gain.connect(ctx.destination);
        for (const frequency of [110, 165]) {
          const oscillator = ctx.createOscillator();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          oscillator.start(now);
          oscillator.stop(now + .8);
        }
      }


      function playWindGust(duration = 1.7, strength = 1) {
        const ctx = storyAudioContext;
        if (!ctx || ctx.state !== "running") return;
        const frameCount = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const buffer = ctx.createBuffer(1, frameCount, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < frameCount; i++) {
          const t = i / frameCount;
          const envelope = Math.sin(Math.PI * Math.min(1, t * 1.35)) * (1 - t * .34);
          data[i] = (Math.random() * 2 - 1) * envelope;
        }
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        const highpass = ctx.createBiquadFilter();
        highpass.type = "highpass";
        highpass.frequency.value = 260;
        const lowpass = ctx.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.value = 1650;
        const gain = ctx.createGain();
        const now = ctx.currentTime;
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.065 * strength, now + .24);
        gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
        source.connect(highpass).connect(lowpass).connect(gain).connect(ctx.destination);
        source.start(now);
      }

      function turnShion(dir) {

      function animateStoryCamera(targetX, targetY, duration = 320) {
        const fromX = storyCameraOffsetX;
        const fromY = storyCameraOffsetY;
        const startedAt = performance.now();
        return new Promise((resolve) => {
          function frame(now) {
            const t = Math.min(1, (now - startedAt) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            storyCameraOffsetX = fromX + (targetX - fromX) * eased;
            storyCameraOffsetY = fromY + (targetY - fromY) * eased;
            syncCamera();
            if (t < 1) requestAnimationFrame(frame);
            else resolve();
          }
          requestAnimationFrame(frame);
        });
      }

      function scriptedWalkTo(targetX, targetY, _minimumDuration = 0) {
        const nearest = alenonCollisionReady
          ? nearestGroundPoint({ x: targetX, y: targetY })
          : { x: targetX, y: targetY };
        if (!nearest) return Promise.resolve();

        const fromX = player.x;
        const fromY = player.y;
        const dx = nearest.x - fromX;
        const dy = nearest.y - fromY;
        const distance = Math.hypot(dx, dy);
        if (distance < .5) return Promise.resolve();

        // Use the exact same on-screen speed as free walking.
        // Advance by capped frame delta instead of absolute elapsed time so a slow
        // first frame on mobile can never skip a large section of the walk.
        const speedWorld = SHION_SPEED_SCREEN / Math.max(worldScale, .001);
        let travelled = 0;
        let previousNow = 0;

        story.scripted = true;
        player.target = null;
        player.dir = directionFromVector(dx, dy);
        player.moving = true;
        player.anim = 0;
        player.frame = 0;
        setActorPosition();
        setActorVisual();
        syncCamera();

        return new Promise((resolve) => {
          function finish() {
            player.x = nearest.x;
            player.y = nearest.y;
            player.moving = false;
            player.frame = 0;
            player.anim = 0;
            story.scripted = false;
            setActorPosition();
            setActorVisual();
            syncCamera();
            resolve();
          }

          function frame(now) {
            if (!previousNow) {
              previousNow = now;
              requestAnimationFrame(frame);
              return;
            }

            const dt = Math.min((now - previousNow) / 1000, .05);
            previousNow = now;
            travelled = Math.min(distance, travelled + speedWorld * dt);
            const t = distance > 0 ? travelled / distance : 1;

            player.x = fromX + dx * t;
            player.y = fromY + dy * t;
            player.anim += dt * 8.5;
            player.frame = Math.floor(player.anim) % 4;
            player.moving = t < 1;
            setActorPosition();
            setActorVisual();
            syncCamera();

            if (t < 1) {
              requestAnimationFrame(frame);
              return;
            }

            finish();
          }

          // Give the newly selected walk sheet one painted frame before movement.
          requestAnimationFrame(frame);
        });
      }

        // Let the player read the Devil card first, then let Shion interpret it.

        await sayStory("……悪魔か。", 1550, 700);
        await sayStory("自分は何に縛られ、何を失うことに怯えている？", 3100, 900);
        await sayStory("その鎖を外した先に、本当に別の選択はないのだろうか？", 3450, 1000);
        await sayStory("本当に、選べる道はひとつしかないのだろうか……。", 3250, 1050);
        await sayStory("選択……か……。", 1850, 950);

        // 2) Ensure Shion's movement sheets are ready before the map becomes visible.

        // Reveal Alenon only after the tarot question has had time to settle.

        await sleep(1150);
        prologueOverlay.hidden = true;
        document.body.classList.remove("prologue-revealing");
        tarotStage.classList.remove("visible");

        // Only now, after the prologue overlay is gone and Alenon is visible,
        // may the ruins ambience begin.

        startAlenonWind({ fade: 1100 });
        await sleep(1750);

        // 3) Shion walks naturally before anything happens.
        turnShion("down");
        setActorPosition();
        setActorVisual();
        syncCamera();
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        await scriptedWalkTo(player.x, player.y + 72);
        await sleep(520);

        // 4) ORB anomaly. Shion notices first; the player then sees the change.
        turnShion("up");
        await animateStoryCamera(0, -34, 420);
        await sayStory("……？", 900, 360);

        // The normal Alenon wind vanishes with the ORB outer layer here.
        document.body.classList.add("orb-anomaly");
        // Match the actual disappearance animation: outer wind fades out over .92s.
        await sleep(920);
        stopAlenonWind();
        playTarotResonance();
        await sleep(60);

        // Outer ORB is gone; core remains.
        await sayStory("こんな挙動、見たことない。", 1800, 650);

        // 5) First wind: born from the core, then runs toward the Star Gate Garden.
        // The ambient wind itself vanishes here. The travelling stream will
        // receive its own dedicated SFX later, so keep that motion silent for now.
        // The ambient wind disappears exactly when the anomaly wind appears.
        document.body.classList.add("orb-wind-born");
        await sleep(820);

        // Let the player clearly see the wind cross the lower side of the screen
        // and disappear completely outside the frame.
        document.body.classList.add("orb-wind-escape");
        // No ambience and no travelling-wind SFX here yet.
        turnShion("down");
        const followWind = animateStoryCamera(0, 48, 760);
        await Promise.all([sleep(1650), followWind]);

        document.body.classList.remove("orb-wind-born", "orb-wind-escape");
        await sleep(620);

        // 6) The remaining light pulses. A second wind reconstructs the ORB.
        turnShion("up");
        document.body.classList.add("orb-core-pulse");
        await sleep(720);
        document.body.classList.remove("orb-core-pulse");
        await sleep(260);

        document.body.classList.add("orb-restore-wind");
        await sleep(150);
        document.body.classList.add("orb-restoring");
        await sleep(1080);

      function viewportSize() {
        return {
          width: Math.max(document.documentElement.clientWidth, window.innerWidth || 0),
          height: Math.max(document.documentElement.clientHeight, window.innerHeight || 0),
        };
      }

      function syncCamera() {
        const { width: vw, height: vh } = viewportSize();
        const halfW = vw / (2 * worldScale);
        const halfH = vh / (2 * worldScale);

        const minX = Math.min(halfW, WORLD_W / 2);
        const maxX = Math.max(minX, WORLD_W - halfW);
        const minY = Math.min(halfH, WORLD_H / 2);
        const maxY = Math.max(minY, WORLD_H - halfH);

        const focusX = clamp(
          player.x + storyCameraOffsetX + (document.body.classList.contains("collision-mode") ? collisionPanX : 0),
          minX,
          maxX,
        );
        const focusY = clamp(
          player.y - CAMERA_LOOK_AHEAD_Y + storyCameraOffsetY +
            (document.body.classList.contains("collision-mode") ? collisionPanY : 0),
          minY,
          maxY,
        );

        cameraTx = vw / 2 - focusX * worldScale;
        cameraTy = vh / 2 - focusY * worldScale;

        world.style.transform =
          `translate3d(${cameraTx}px,${cameraTy}px,0) scale(${worldScale})`;
      }

      function fitWorld() {
        const { width: vw, height: vh } = viewportSize();

        // Fill the complete layout viewport. The map is scaled with cover below,
        // so no bottom band can remain on tall iPhone/in-app Safari screens.
        viewport.style.width = "100vw";
        viewport.style.height = "100vh";

        // Keep Shion at the Star Gate Garden size and enlarge the map instead.
        worldScale = Math.max(1, vw / WORLD_W, vh / WORLD_H);

        world.style.setProperty(
          "--actor-inverse-scale",
          String(1 / worldScale),
        );
        world.dataset.shionScreenHeight = String(SHION_SCREEN_HEIGHT);
        syncCamera();
      }

      applyLayout();
      fitWorld();

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#06142d" />
  <title>TAROT BREAKER — アレノンの遺跡</title>
  <style>
    :root {
      --world-w: 1448;
      --world-h: 1086;

      /* Ground layout: 1448x1086 reference space */
      --ground-s-x: 0px;
      --ground-s-y: -12px;
      --ground-s-scale: .86;

      --ground-side-x: 372px;
      --ground-side-y: 138px;
      --ground-side-scale: .70;

      /* Front pad */
      --pad-x: 724px;
      --pad-y: 862px;
      --pad-size: 360px;

      /* Rear orb */
      --orb-x: 724px;
      --orb-y: 252px;
      --orb-size: 430px;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #06142d;
    }
    body {
      touch-action: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(63,139,255,.14), transparent 55%),
        #06142d;
    }

    #world {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1448px;
      height: 1086px;
      transform-origin: 0 0;
      will-change: transform;
      overflow: hidden;
      background: #0a2e62;
      isolation: isolate;
    }

    .layer,
    .ground {
      position: absolute;
      inset: 0;
      width: 1448px;
      height: 1086px;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .bg {
      z-index: 0;
      object-fit: cover;
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 24%, rgba(173,222,255,.10) 0 16%, transparent 44%),
        linear-gradient(to bottom, rgba(0,15,55,.05), rgba(0,28,70,.03) 66%, rgba(3,18,46,.16));
    }

    .ground {
      z-index: 10;
      object-fit: contain;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .ground-left {
      transform: translate3d(calc(var(--ground-side-x) * -1), var(--ground-side-y), 0)
                 scale(var(--ground-side-scale));
    }

    .ground-right {
      transform: translate3d(var(--ground-side-x), var(--ground-side-y), 0)
                 scale(var(--ground-side-scale));
    }

    .ground-center {
      z-index: 12;
      transform: translate3d(var(--ground-s-x), var(--ground-s-y), 0)
                 scale(var(--ground-s-scale));
    }

    .pad {
      position: absolute;
      z-index: 20;
      left: var(--pad-x);
      top: var(--pad-y);
      width: var(--pad-size);
      height: var(--pad-size);
      object-fit: contain;
      transform: translate(-50%, -50%);
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      filter: drop-shadow(0 0 12px rgba(107,206,255,.20));
    }

    .pad-glow {
      position: absolute;
      z-index: 19;
      left: var(--pad-x);
      top: var(--pad-y);
      width: calc(var(--pad-size) * .50);
      height: calc(var(--pad-size) * .25);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(ellipse, rgba(112,220,255,.24), rgba(84,161,255,.08) 46%, transparent 74%);
      filter: blur(11px);
      animation: pad-breathe 4.8s ease-in-out infinite;
    }

    .orb {
      position: absolute;
      left: var(--orb-x);
      top: var(--orb-y);
      width: var(--orb-size);
      height: var(--orb-size);
      object-fit: contain;
      transform-origin: 50% 50%;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .orb-outer {
      z-index: 30;
      transform: translate(-50%, -50%);
      animation: orb-outer-spin 28s linear infinite;
    }

    .orb-inner {
      z-index: 31;
      transform: translate(-50%, -50%);
      animation: orb-inner-spin 17s linear infinite reverse;
    }

    .orb-core {
      z-index: 32;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 18px rgba(118,220,255,.58));
      animation: orb-core-breathe 3.7s ease-in-out infinite;
    }

    .orb-particle {
      z-index: 33;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      animation:
        orb-particle-spin 36s linear infinite,
        orb-particle-fade 5.2s ease-in-out infinite;
    }

    .orb-aura {
      position: absolute;
      z-index: 29;
      left: var(--orb-x);
      top: var(--orb-y);
      width: calc(var(--orb-size) * .60);
      height: calc(var(--orb-size) * .60);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(101,216,255,.22), rgba(93,150,255,.08) 46%, transparent 72%);
      filter: blur(16px);
      animation: orb-aura 4.2s ease-in-out infinite;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(4,10,32,.10), transparent 20%, transparent 76%, rgba(4,10,32,.13)),
        radial-gradient(ellipse at center, transparent 62%, rgba(1,10,30,.13) 100%);
    }

    @keyframes pad-breathe {
      0%, 100% { opacity: .56; transform: translate(-50%, -50%) scale(.96); }
      50% { opacity: .90; transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes orb-outer-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes orb-inner-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes orb-particle-spin {
      from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
      to { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
    }

    @keyframes orb-particle-fade {
      0%, 100% { opacity: .56; }
      50% { opacity: .94; }
    }

    @keyframes orb-core-breathe {
      0%, 100% {
        opacity: .90;
        transform: translate(-50%, -50%) scale(.97);
        filter: drop-shadow(0 0 16px rgba(118,220,255,.50));
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.035);
        filter: drop-shadow(0 0 28px rgba(118,220,255,.78));
      }
    }

    @keyframes orb-aura {
      0%, 100% { opacity: .58; transform: translate(-50%, -50%) scale(.94); }
      50% { opacity: .92; transform: translate(-50%, -50%) scale(1.08); }
    }

    /* Add ?debug=1 to the URL when fine-tuning placement. */
    body.debug #world::before,
    body.debug #world::after {
      content: "";
      position: absolute;
      z-index: 99;
      pointer-events: none;
      background: rgba(255, 92, 92, .55);
    }

    body.debug #world::before {
      left: 723px;
      top: 0;
      width: 2px;
      height: 1086px;
    }

    body.debug #world::after {
      left: 0;
      top: 542px;
      width: 1448px;
      height: 2px;
    }

    body.debug .pad,
    body.debug .orb {
      outline: 2px solid rgba(255,225,80,.72);
    }


    /* Placement editor: open alenon.html?edit=1 */
    #editor-panel {
      display: none;
      position: fixed;
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 1000;
      padding: 10px 10px 12px;
      color: #fff;
      background: rgba(5, 13, 35, .90);
      border: 1px solid rgba(177, 216, 255, .34);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      touch-action: auto;
    }

    body.edit-mode #editor-panel { display: block; }
    body.edit-mode #viewport { touch-action: none; }

    .editor-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .editor-title {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .editor-hint {
      font-size: 11px;
      opacity: .72;
      white-space: nowrap;
    }

    .editor-layer-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 7px;
    }

    .editor-layer-tabs::-webkit-scrollbar { display: none; }

    .editor-layer-tabs button,
    .editor-actions button {
      appearance: none;
      border: 1px solid rgba(197, 223, 255, .25);
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      min-height: 36px;
      padding: 7px 11px;
      white-space: nowrap;
    }

    .editor-layer-tabs button[aria-pressed="true"] {
      background: rgba(111, 188, 255, .25);
      border-color: rgba(143, 208, 255, .72);
      box-shadow: inset 0 0 0 1px rgba(210, 237, 255, .18);
    }

    .editor-controls {
      display: grid;
      grid-template-columns: 76px 76px 1fr;
      gap: 7px;
      align-items: end;
    }

    .editor-field {
      display: grid;
      gap: 3px;
      font-size: 10px;
      opacity: .92;
    }

    .editor-field input[type="number"] {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 5px 7px;
      border: 1px solid rgba(197, 223, 255, .24);
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font: inherit;
      font-size: 13px;
      text-align: center;
    }

    .editor-size-wrap {
      display: grid;
      grid-template-columns: 1fr 62px;
      gap: 6px;
      align-items: center;
    }

    .editor-size-wrap input[type="range"] {
      width: 100%;
      min-width: 0;
    }

    .editor-actions {
      display: flex;
      gap: 7px;
      margin-top: 8px;
    }

    .editor-actions button { flex: 1; }
    #editor-copy { background: rgba(75, 156, 255, .22); }
    #editor-reset { background: rgba(255, 149, 97, .12); }

    #editor-toast {
      position: fixed;
      left: 50%;
      bottom: calc(205px + env(safe-area-inset-bottom));
      z-index: 1001;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 999px;
      color: white;
      background: rgba(0,0,0,.72);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    #editor-toast.show { opacity: 1; }

    body.edit-mode #world {
      outline: 1px solid rgba(168, 214, 255, .22);
    }

    body.edit-mode #world::before,
    body.edit-mode #world::after {
      content: "";
      position: absolute;
      z-index: 80;
      pointer-events: none;
      background: rgba(123, 198, 255, .24);
    }

    body.edit-mode #world::before {
      left: 723px;
      top: 0;
      width: 2px;
      height: 1086px;
    }

    body.edit-mode #world::after {
      left: 0;
      top: 542px;
      width: 1448px;
      height: 2px;
    }

    body.edit-mode .vignette { opacity: .35; }

    @media (max-width: 520px) {
      .editor-hint { display: none; }
      .editor-controls { grid-template-columns: 68px 68px 1fr; }
      #editor-toast { bottom: calc(214px + env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pad-glow,
      .orb-outer,
      .orb-inner,
      .orb-core,
      .orb-particle,
      .orb-aura {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main id="viewport" aria-label="TAROT BREAKER プロローグ アレノンの遺跡">
    <section id="world" aria-label="アレノンの遺跡マップ">
      <!-- Backmost layer -->
      <img class="layer bg" src="./assets/maps/alenon/bg.webp" alt="" aria-hidden="true" draggable="false" />

      <div class="atmosphere" aria-hidden="true"></div>

      <!-- Ruin grounds: left / center / right -->
      <img class="ground ground-left" src="./assets/maps/alenon/ground_l.webp" alt="" aria-hidden="true" draggable="false" />
      <img class="ground ground-right" src="./assets/maps/alenon/ground_r.webp" alt="" aria-hidden="true" draggable="false" />
      <img class="ground ground-center" src="./assets/maps/alenon/ground_s.webp" alt="" aria-hidden="true" draggable="false" />

      <!-- Front tip pad -->
      <div class="pad-glow" aria-hidden="true"></div>
      <img class="pad" src="./assets/maps/alenon/pad.webp" alt="" aria-hidden="true" draggable="false" />

      <!-- Rear-center orb assembly -->
      <div class="orb-aura" aria-hidden="true"></div>
      <img class="orb orb-outer" src="./assets/maps/alenon/orb-outer.webp" alt="" aria-hidden="true" draggable="false" />
      <img class="orb orb-inner" src="./assets/maps/alenon/orb-inner.webp" alt="" aria-hidden="true" draggable="false" />
      <img class="orb orb-core" src="./assets/maps/alenon/orb-core.webp" alt="" aria-hidden="true" draggable="false" />
      <img class="orb orb-particle" src="./assets/maps/alenon/orb-particle.webp" alt="" aria-hidden="true" draggable="false" />

      <div class="vignette" aria-hidden="true"></div>
    </section>

    <aside id="editor-panel" aria-label="アレノンの遺跡 配置調整">
      <div class="editor-top">
        <div class="editor-title">アレノン配置調整</div>
        <div class="editor-hint">ドラッグ＝移動 / 2本指＝拡大縮小</div>
      </div>

      <div class="editor-layer-tabs" role="group" aria-label="調整するレイヤー">
        <button type="button" data-editor-select="groundS" aria-pressed="true">中央遺跡</button>
        <button type="button" data-editor-select="groundL" aria-pressed="false">左遺跡</button>
        <button type="button" data-editor-select="groundR" aria-pressed="false">右遺跡</button>
        <button type="button" data-editor-select="pad" aria-pressed="false">PAD</button>
        <button type="button" data-editor-select="orb" aria-pressed="false">ORB</button>
      </div>

      <div class="editor-controls">
        <label class="editor-field">X
          <input id="editor-x" type="number" inputmode="decimal" step="1" />
        </label>
        <label class="editor-field">Y
          <input id="editor-y" type="number" inputmode="decimal" step="1" />
        </label>
        <label class="editor-field"><span id="editor-size-label">大きさ</span>
          <span class="editor-size-wrap">
            <input id="editor-size" type="range" />
            <input id="editor-size-number" type="number" inputmode="decimal" />
          </span>
        </label>
      </div>

      <div class="editor-actions">
        <button id="editor-reset" type="button">初期値に戻す</button>
        <button id="editor-copy" type="button">調整値をコピー</button>
      </div>
    </aside>
    <div id="editor-toast" role="status" aria-live="polite"></div>

  </main>

  <script>
    (() => {
      "use strict";

      const WORLD_W = 1448;
      const WORLD_H = 1086;
      const world = document.getElementById("world");
      const viewport = document.getElementById("viewport");
      const params = new URLSearchParams(location.search);
      const editMode = params.get("edit") === "1";
      let worldScale = 1;

      const defaults = Object.freeze({
        groundS: { kind: "ground", x: 0, y: -12, scale: .86 },
        groundL: { kind: "ground", x: -372, y: 138, scale: .70 },
        groundR: { kind: "ground", x: 372, y: 138, scale: .70 },
        pad: { kind: "object", x: 724, y: 862, size: 360 },
        orb: { kind: "object", x: 724, y: 252, size: 430 },
      });

      const cloneDefaults = () =>
        Object.fromEntries(Object.entries(defaults).map(([key, value]) => [key, { ...value }]));

      let layout = cloneDefaults();
      const saved = localStorage.getItem("tarot-breaker-alenon-layout-v1");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          for (const key of Object.keys(defaults)) {
            if (parsed[key]) layout[key] = { ...layout[key], ...parsed[key] };
          }
        } catch (_) {}
      }

      const refs = {
        groundS: document.querySelector(".ground-center"),
        groundL: document.querySelector(".ground-left"),
        groundR: document.querySelector(".ground-right"),
        pad: document.querySelector(".pad"),
        padGlow: document.querySelector(".pad-glow"),
        orb: [...document.querySelectorAll(".orb")],
        orbAura: document.querySelector(".orb-aura"),
      };

      function applyLayout() {
        for (const key of ["groundS", "groundL", "groundR"]) {
          const item = layout[key];
          refs[key].style.transform =
            `translate3d(${item.x}px,${item.y}px,0) scale(${item.scale})`;
        }

        const pad = layout.pad;
        refs.pad.style.left = pad.x + "px";
        refs.pad.style.top = pad.y + "px";
        refs.pad.style.width = pad.size + "px";
        refs.pad.style.height = pad.size + "px";
        refs.padGlow.style.left = pad.x + "px";
        refs.padGlow.style.top = pad.y + "px";
        refs.padGlow.style.width = pad.size * .50 + "px";
        refs.padGlow.style.height = pad.size * .25 + "px";

        const orb = layout.orb;
        for (const element of refs.orb) {
          element.style.left = orb.x + "px";
          element.style.top = orb.y + "px";
          element.style.width = orb.size + "px";
          element.style.height = orb.size + "px";
        }
        refs.orbAura.style.left = orb.x + "px";
        refs.orbAura.style.top = orb.y + "px";
        refs.orbAura.style.width = orb.size * .60 + "px";
        refs.orbAura.style.height = orb.size * .60 + "px";

        localStorage.setItem("tarot-breaker-alenon-layout-v1", JSON.stringify(layout));
      }

      function fitWorld() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        worldScale = Math.min(vw / WORLD_W, vh / WORLD_H);
        const width = WORLD_W * worldScale;
        const height = WORLD_H * worldScale;
        world.style.transform =
          `translate3d(${-width / 2}px,${-height / 2}px,0) scale(${worldScale})`;
      }

      applyLayout();
      fitWorld();

      window.addEventListener("resize", fitWorld, { passive: true });
      window.addEventListener("orientationchange", fitWorld, { passive: true });

      if (params.get("debug") === "1") {
        document.body.classList.add("debug");
      }

      if (!editMode) return;
      document.body.classList.add("edit-mode");

      const xInput = document.getElementById("editor-x");
      const yInput = document.getElementById("editor-y");
      const sizeRange = document.getElementById("editor-size");
      const sizeNumber = document.getElementById("editor-size-number");
      const sizeLabel = document.getElementById("editor-size-label");
      const copyButton = document.getElementById("editor-copy");
      const resetButton = document.getElementById("editor-reset");
      const toast = document.getElementById("editor-toast");
      const layerButtons = [...document.querySelectorAll("[data-editor-select]")];

      let selected = "groundS";
      let toastTimer = 0;
      const pointers = new Map();
      let dragStart = null;
      let pinchStart = null;

      function selectedItem() {
        return layout[selected];
      }

      function sizeValue(item) {
        return item.kind === "ground" ? item.scale : item.size;
      }

      function configureSizeControl() {
        const item = selectedItem();
        const isGround = item.kind === "ground";
        sizeLabel.textContent = isGround ? "拡大率" : "大きさ";
        sizeRange.min = isGround ? "0.20" : "80";
        sizeRange.max = isGround ? "1.40" : "900";
        sizeRange.step = isGround ? "0.01" : "1";
        sizeNumber.min = sizeRange.min;
        sizeNumber.max = sizeRange.max;
        sizeNumber.step = sizeRange.step;
      }

      function refreshControls() {
        const item = selectedItem();
        configureSizeControl();
        xInput.value = Math.round(item.x * 10) / 10;
        yInput.value = Math.round(item.y * 10) / 10;
        const v = sizeValue(item);
        sizeRange.value = v;
        sizeNumber.value = item.kind === "ground"
          ? (Math.round(v * 100) / 100).toFixed(2)
          : Math.round(v);
        for (const button of layerButtons) {
          button.setAttribute(
            "aria-pressed",
            button.dataset.editorSelect === selected ? "true" : "false",
          );
        }
      }

      function setPositionFromInputs() {
        const item = selectedItem();
        const x = Number(xInput.value);
        const y = Number(yInput.value);
        if (Number.isFinite(x)) item.x = x;
        if (Number.isFinite(y)) item.y = y;
        applyLayout();
      }

      function setSize(value) {
        const item = selectedItem();
        const n = Number(value);
        if (!Number.isFinite(n)) return;
        if (item.kind === "ground") {
          item.scale = Math.max(.20, Math.min(1.40, n));
        } else {
          item.size = Math.max(80, Math.min(900, n));
        }
        applyLayout();
        refreshControls();
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("show");
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
      }

      for (const button of layerButtons) {
        button.addEventListener("click", () => {
          selected = button.dataset.editorSelect;
          refreshControls();
          showToast(button.textContent + "を選択");
        });
      }

      xInput.addEventListener("input", setPositionFromInputs);
      yInput.addEventListener("input", setPositionFromInputs);
      sizeRange.addEventListener("input", () => setSize(sizeRange.value));
      sizeNumber.addEventListener("input", () => setSize(sizeNumber.value));

      resetButton.addEventListener("click", () => {
        layout = cloneDefaults();
        applyLayout();
        refreshControls();
        showToast("初期配置に戻しました");
      });

      copyButton.addEventListener("click", async () => {
        const payload = {
          ground_s: {
            x: Math.round(layout.groundS.x * 10) / 10,
            y: Math.round(layout.groundS.y * 10) / 10,
            scale: Math.round(layout.groundS.scale * 1000) / 1000,
          },
          ground_l: {
            x: Math.round(layout.groundL.x * 10) / 10,
            y: Math.round(layout.groundL.y * 10) / 10,
            scale: Math.round(layout.groundL.scale * 1000) / 1000,
          },
          ground_r: {
            x: Math.round(layout.groundR.x * 10) / 10,
            y: Math.round(layout.groundR.y * 10) / 10,
            scale: Math.round(layout.groundR.scale * 1000) / 1000,
          },
          pad: {
            x: Math.round(layout.pad.x * 10) / 10,
            y: Math.round(layout.pad.y * 10) / 10,
            size: Math.round(layout.pad.size),
          },
          orb: {
            x: Math.round(layout.orb.x * 10) / 10,
            y: Math.round(layout.orb.y * 10) / 10,
            size: Math.round(layout.orb.size),
          },
        };
        const text = JSON.stringify(payload, null, 2);
        try {
          await navigator.clipboard.writeText(text);
          showToast("調整値をコピーしました");
        } catch (_) {
          window.prompt("この調整値をコピーして送ってください", text);
        }
      });

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      viewport.addEventListener("pointerdown", (event) => {
        if (event.target.closest?.("#editor-panel")) return;
        event.preventDefault();
        viewport.setPointerCapture?.(event.pointerId);
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (pointers.size === 1) {
          const item = selectedItem();
          dragStart = {
            pointerId: event.pointerId,
            clientX: event.clientX,
            clientY: event.clientY,
            x: item.x,
            y: item.y,
          };
          pinchStart = null;
        } else if (pointers.size === 2) {
          const values = [...pointers.values()];
          pinchStart = {
            distance: Math.max(1, distance(values[0], values[1])),
            size: sizeValue(selectedItem()),
          };
          dragStart = null;
        }
      }, { passive: false });

      viewport.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId)) return;
        event.preventDefault();
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (pointers.size >= 2 && pinchStart) {
          const values = [...pointers.values()];
          const current = Math.max(1, distance(values[0], values[1]));
          const ratio = current / pinchStart.distance;
          setSize(pinchStart.size * ratio);
          return;
        }

        if (!dragStart || dragStart.pointerId !== event.pointerId) return;
        const item = selectedItem();
        item.x = dragStart.x + (event.clientX - dragStart.clientX) / worldScale;
        item.y = dragStart.y + (event.clientY - dragStart.clientY) / worldScale;
        applyLayout();
        refreshControls();
      }, { passive: false });

      function endPointer(event) {
        if (!pointers.has(event.pointerId)) return;
        event.preventDefault();
        pointers.delete(event.pointerId);
        if (viewport.hasPointerCapture?.(event.pointerId)) {
          viewport.releasePointerCapture(event.pointerId);
        }

        if (pointers.size === 1) {
          const [pointerId, point] = [...pointers.entries()][0];
          const item = selectedItem();
          dragStart = {
            pointerId,
            clientX: point.x,
            clientY: point.y,
            x: item.x,
            y: item.y,
          };
          pinchStart = null;
        } else {
          dragStart = null;
          pinchStart = null;
        }
      }

      viewport.addEventListener("pointerup", endPointer, { passive: false });
      viewport.addEventListener("pointercancel", endPointer, { passive: false });
      viewport.addEventListener("lostpointercapture", (event) => {
        pointers.delete(event.pointerId);
      });

      refreshControls();
      showToast("配置調整モード");
    })();
  </script>
</body>
</html>

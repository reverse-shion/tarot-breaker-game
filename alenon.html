      function initCollisionEditor() {
        const NS = "http://www.w3.org/2000/svg";
        const STORAGE_KEY_COLLISION = "tarot-breaker-alenon-collision-draft-v2";
        const status = document.getElementById("collision-status");
        const undoPointButton = document.getElementById("collision-undo-point");
        const finishButton = document.getElementById("collision-finish");
        const undoAreaButton = document.getElementById("collision-undo-area");
        const centerButton = document.getElementById("collision-center");
        const clearButton = document.getElementById("collision-clear");
        const copyButton = document.getElementById("collision-copy");

        let areas = [];
        let current = [];
        let gesture = null;

        const saved = localStorage.getItem(STORAGE_KEY_COLLISION);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.walkAreas)) {
              areas = parsed.walkAreas
                .filter((area) => area?.type === "poly" && Array.isArray(area.points))
                .map((area) => ({
                  type: "poly",
                  points: area.points
                    .filter((p) => Array.isArray(p) && p.length === 2)
                    .map((p) => [Number(p[0]), Number(p[1])]),
                }))
                .filter((area) => area.points.length >= 3);
            }
          } catch (_) {}
        } else {
          fetch(COLLISION_URL, { cache: "no-store" })
            .then((response) => response.ok ? response.json() : null)
            .then((data) => {
              if (!data || !Array.isArray(data.walkAreas)) return;
              areas = data.walkAreas
                .filter((area) => area?.type === "poly" && Array.isArray(area.points))
                .map((area) => ({
                  type: "poly",
                  points: area.points.map((p) => [Number(p[0]), Number(p[1])]),
                }))
                .filter((area) => area.points.length >= 3);
              render();
            })
            .catch(() => {});
        }

        function pointString(points) {
          return points.map((p) => p.join(",")).join(" ");
        }

        function addSvg(tag, attrs, className) {
          const node = document.createElementNS(NS, tag);
          if (className) node.setAttribute("class", className);
          for (const [key, value] of Object.entries(attrs || {})) {
            if (value == null) continue;
            node.setAttribute(key, String(value));
          }
          collisionOverlay.appendChild(node);
          return node;
        }

        function saveDraft() {
          localStorage.setItem(STORAGE_KEY_COLLISION, JSON.stringify({
            version: 1,
            map: "alenon",
            referenceSize: { width: WORLD_W, height: WORLD_H },
            walkAreas: areas,
          }));
        }

        function render() {
          collisionOverlay.replaceChildren();

          for (const area of areas) {
            addSvg("polygon", { points: pointString(area.points) }, "collision-area");
          }

          if (current.length) {
            const tag = current.length >= 3 ? "polygon" : "polyline";
            addSvg(tag, {
              points: pointString(current),
              fill: current.length >= 3 ? undefined : "none",
            }, "collision-current");

            current.forEach((point, index) => {
              addSvg("circle", {
                cx: point[0],
                cy: point[1],
                r: index === 0 ? 9 : 6,
              }, index === 0 ? "collision-start" : "collision-point");
            });
          }

          status.textContent = `範囲 ${areas.length} / 点 ${current.length}`;
        }

        function payload() {
          return {
            version: 1,
            map: "alenon",
            referenceSize: { width: WORLD_W, height: WORLD_H },
            walkAreas: areas,
            blockedAreas: [],
          };
        }

        function finishCurrent() {
          if (current.length < 3) return false;
          areas.push({
            type: "poly",
            points: current.map((p) => [Math.round(p[0]), Math.round(p[1])]),
          });
          current = [];
          saveDraft();
          render();
          return true;
        }

        function setMode(open) {
          document.body.classList.toggle("collision-mode", open);
          collisionToggle.setAttribute("aria-pressed", open ? "true" : "false");
          collisionToggle.textContent = open ? "編集完了" : "当たり判定";

          if (open) {
            document.body.classList.remove("object-mode", "deadpad-mode");
            objectToggle.setAttribute("aria-pressed", "false");
            deadpadToggle.setAttribute("aria-pressed", "false");
            objectToggle.textContent = "PAD / ORB";
            deadpadToggle.textContent = "左PAD暗部";
            player.target = null;
            clearTargetRing();
            render();
            syncCamera();
          } else {
            gesture = null;
            collisionPanX = 0;
            collisionPanY = 0;
            syncCamera();
          }
        }

        collisionToggle.addEventListener("click", (event) => {
          event.preventDefault();
          setMode(!document.body.classList.contains("collision-mode"));
        });

        undoPointButton.addEventListener("click", () => {
          current.pop();
          render();
        });

        finishButton.addEventListener("click", () => {
          if (!finishCurrent()) {
            finishButton.textContent = "3点以上必要";
            setTimeout(() => finishButton.textContent = "範囲を確定", 1100);
          }
        });

        undoAreaButton.addEventListener("click", () => {
          if (current.length) {
            current = [];
          } else {
            areas.pop();
            saveDraft();
          }
          render();
        });

        centerButton.addEventListener("click", () => {
          collisionPanX = 0;
          collisionPanY = 0;
          syncCamera();
        });

        clearButton.addEventListener("click", () => {
          if (!areas.length && !current.length) return;
          if (!window.confirm("作成中の当たり判定をすべて消しますか？")) return;
          areas = [];
          current = [];
          saveDraft();
          render();
        });

        copyButton.addEventListener("click", async () => {
          if (current.length >= 3) finishCurrent();
          const text = JSON.stringify(payload(), null, 2);
          try {
            await navigator.clipboard.writeText(text);
            copyButton.textContent = "コピーしました";
            setTimeout(() => copyButton.textContent = "JSONコピー", 1300);
          } catch (_) {
            window.prompt("当たり判定JSONをコピーしてください", text);
          }
        });

        viewport.addEventListener("pointerdown", (event) => {
          if (!document.body.classList.contains("collision-mode")) return;
          if (
            event.target.closest?.("#collision-panel") ||
            event.target.closest?.("#collision-toggle")
          ) return;
          if (event.button != null && event.button !== 0) return;

          event.preventDefault();
          gesture = {
            id: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            panX: collisionPanX,
            panY: collisionPanY,
            moved: false,
            time: performance.now(),
          };
          viewport.setPointerCapture?.(event.pointerId);
        }, { passive: false });

        viewport.addEventListener("pointermove", (event) => {
          if (!gesture || gesture.id !== event.pointerId) return;
          if (!document.body.classList.contains("collision-mode")) return;
          event.preventDefault();

          const dx = event.clientX - gesture.x;
          const dy = event.clientY - gesture.y;
          if (!gesture.moved && Math.hypot(dx, dy) >= 10) {
            gesture.moved = true;
          }

          if (gesture.moved) {
            collisionPanX = gesture.panX - dx / worldScale;
            collisionPanY = gesture.panY - dy / worldScale;
            syncCamera();
          }
        }, { passive: false });

        function finishGesture(event) {
          if (!gesture || gesture.id !== event.pointerId) return;
          event.preventDefault();

          const wasMoved = gesture.moved;
          const elapsed = performance.now() - gesture.time;

          if (!wasMoved && elapsed < 650) {
            const p = screenToWorld(event.clientX, event.clientY);
            const point = [
              Math.round(clamp(p.x, 0, WORLD_W)),
              Math.round(clamp(p.y, 0, WORLD_H)),
            ];

            if (current.length >= 3) {
              const first = current[0];
              const close = Math.hypot(point[0] - first[0], point[1] - first[1]);
              if (close <= 28) {
                finishCurrent();
              } else {
                current.push(point);
                render();
              }
            } else {
              current.push(point);
              render();
            }
          }

          if (viewport.hasPointerCapture?.(event.pointerId)) {
            viewport.releasePointerCapture(event.pointerId);
          }
          gesture = null;
        }

        viewport.addEventListener("pointerup", finishGesture, { passive: false });
        viewport.addEventListener("pointercancel", (event) => {
          if (gesture?.id === event.pointerId) gesture = null;
        }, { passive: false });

        render();
        setMode(collisionMode);
      }

      function initRuinDrift() {
        if (!refs.driftLeft || !refs.driftRight) return;

        const left = refs.driftLeft;
        const right = refs.driftRight;
        const startedAt = performance.now();

        function frame(now) {
          const t = (now - startedAt) / 1000;

          // Outer wrappers move; inner anchors keep the authored position/scale.
          // This also runs in ?edit=1 so the effect is visible regardless of URL.
          const leftY = Math.sin((t / 18.0) * Math.PI * 2) * 18;
          const leftX = Math.sin((t / 25.0) * Math.PI * 2 + 0.65) * 7;
          const leftR = Math.sin((t / 22.0) * Math.PI * 2 + 1.10) * 0.58;

          const rightY = Math.sin((t / 22.0) * Math.PI * 2 + 1.85) * 20;
          const rightX = Math.sin((t / 29.0) * Math.PI * 2 + 1.15) * 8;
          const rightR = Math.sin((t / 25.0) * Math.PI * 2 + 2.55) * 0.62;

          left.style.transform =
            `translate3d(${leftX.toFixed(2)}px,${leftY.toFixed(2)}px,0) rotate(${leftR.toFixed(3)}deg)`;
          right.style.transform =
            `translate3d(${rightX.toFixed(2)}px,${rightY.toFixed(2)}px,0) rotate(${rightR.toFixed(3)}deg)`;

          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

      // Shared PAD audio — use the same three assets on every map.
      const padActivateAudio = new Audio("./assets/audio/sfx/pad-activate.wav");
      const padMoveAudioA = new Audio("./assets/audio/sfx/pad-move-loop.flac");
      const padMoveAudioB = new Audio("./assets/audio/sfx/pad-move-loop.flac");
      const padLandAudio = new Audio("./assets/audio/sfx/pad-land.wav");
      padActivateAudio.preload = "auto";
      padMoveAudioA.preload = "auto";
      padMoveAudioB.preload = "auto";
      padLandAudio.preload = "auto";
      padActivateAudio.volume = .72;
      padMoveAudioA.volume = .42;
      padMoveAudioB.volume = .42;
      padLandAudio.volume = .76;
      let padMoveLoopTimer = 0;
      let padMoveActive = false;
      let padMoveCurrent = padMoveAudioA;
      let padMoveNext = padMoveAudioB;

      function playPadOneShot(audio) {
        try { audio.pause(); audio.currentTime = 0; audio.play().catch(() => {}); } catch (_) {}
      }
      function schedulePadMoveSeamlessLoop() {
        clearTimeout(padMoveLoopTimer);
        if (!padMoveActive || !Number.isFinite(padMoveCurrent.duration)) return;
        // Start the second copy just before the first reaches its tail. This
        // crossfades over the file boundary so the FLAC never drops to silence.
        const remaining = Math.max(0, padMoveCurrent.duration - padMoveCurrent.currentTime);
        const overlap = Math.min(.18, Math.max(.06, padMoveCurrent.duration * .08));
        padMoveLoopTimer = window.setTimeout(() => {
          if (!padMoveActive) return;
          const outgoing = padMoveCurrent;
          const incoming = padMoveNext;
          try {
            incoming.currentTime = 0;
            incoming.volume = 0;
            incoming.play().catch(() => {});
            const started = performance.now();
            const fade = (now) => {
              if (!padMoveActive) return;
              const t = Math.min(1, (now - started) / (overlap * 1000));
              outgoing.volume = .42 * (1 - t);
              incoming.volume = .42 * t;
              if (t < 1) requestAnimationFrame(fade);
              else {
                outgoing.pause(); outgoing.currentTime = 0; outgoing.volume = .42;
                padMoveCurrent = incoming; padMoveNext = outgoing;
                schedulePadMoveSeamlessLoop();
              }
            };
            requestAnimationFrame(fade);
          } catch (_) {}
        }, Math.max(0, (remaining - overlap) * 1000));
      }
      function startPadMoveAudio() {
        if (padMoveActive) return;
        padMoveActive = true;
        try {
          padMoveCurrent.currentTime = 0;
          padMoveCurrent.volume = .42;
          padMoveCurrent.play().then(schedulePadMoveSeamlessLoop).catch(() => {});
        } catch (_) {}
      }
      function stopPadMoveAudio() {
        padMoveActive = false;
        clearTimeout(padMoveLoopTimer);
        for (const audio of [padMoveAudioA, padMoveAudioB]) {
          try { audio.pause(); audio.currentTime = 0; audio.volume = .42; } catch (_) {}
        }
      }

      function setRideMode(mode) {
        ride.mode = mode;
        // Callers may assign ride.mode immediately before this function, so audio
        // must follow the requested mode rather than comparing the old value.
        if (mode === "boarding") {
          stopPadMoveAudio();
          playPadOneShot(padActivateAudio);
        } else if (mode === "flying" || mode === "exiting" || mode === "arriving") {
          startPadMoveAudio();
        } else if (mode === "landing" || mode === "ground") {
          stopPadMoveAudio();
        }
        document.body.classList.toggle("pad-boarding", mode === "boarding");
        document.body.classList.toggle("pad-riding", mode === "flying");
        document.body.classList.toggle("pad-landing", mode === "landing");
        document.body.classList.toggle("pad-exiting", mode === "exiting");

        if (mode === "boarding") {
          flightStatus.textContent = "PADが共鳴している…";
        } else if (mode === "flying") {
          flightStatus.textContent = "PAD起動中 — 元の場所に戻ると降りられる";
          moveGuide.hidden = false;
          moveGuide.textContent = "PADで移動中 / 元の位置で着陸 / 下へ進むと次の場所へ";
        } else if (mode === "landing") {
          flightStatus.textContent = "PAD着陸中…";
          moveGuide.hidden = true;
        } else if (mode === "exiting") {
          flightStatus.textContent = "星門庭園方面へ移動中…";
          moveGuide.hidden = true;
        }
      }

      function syncRideVisual(now = performance.now()) {
        if (ride.mode === "ground") return;

        const bob = ride.mode === "flying"
          ? Math.sin(now / 620) * 2.2
          : 0;
        const visualY = ride.y - ride.lift + bob;

        refs.pad.style.left = ride.x + "px";
        refs.pad.style.top = visualY + "px";
        refs.padGlow.style.left = ride.x + "px";
        refs.padGlow.style.top = visualY + "px";
        refs.padTrail.style.left = ride.x + "px";
        refs.padTrail.style.top = (visualY + 22) + "px";

        if (ride.mode !== "boarding") {
          player.x = ride.x;
          player.y = visualY - 2;
        }
        player.moving = false;
        player.frame = 0;
      }

      function beginBoarding() {
        if (ride.mode !== "ground" || !story.completed) return;
        story.locked = true;
        document.body.classList.add("story-running");
        moveGuide.hidden = true;
        ride.x = layout.pad.x;
        ride.y = layout.pad.y;
        ride.lift = 0;
        ride.progress = 0;
        ride.fromX = player.x;
        ride.fromY = player.y;
        player.target = null;
        clearTargetRing();
        setRideMode("boarding");
      }

      function beginPadLanding() {
        if (ride.mode !== "flying") return;
        ride.mode = "landing";
        ride.progress = 0;
        ride.landFromX = ride.x;
        ride.landFromY = ride.y;
        ride.landFromLift = ride.lift;
        player.target = null;
        clearTargetRing();
        setRideMode("landing");
      }

      function finishPadLanding() {
        stopPadMoveAudio();
        playPadOneShot(padLandAudio);
        ride.x = layout.pad.x;
        ride.y = layout.pad.y;
        ride.lift = 0;
        ride.progress = 0;
        ride.homeArmed = false;
        ride.exitStarted = false;
        ride.reboardLockedUntil = performance.now() + PAD_REBOARD_COOLDOWN_MS;

        document.body.classList.remove(
          "pad-boarding",
          "pad-riding",
          "pad-landing",
          "pad-exiting",
        );
        ride.mode = "ground";

        refs.pad.style.left = layout.pad.x + "px";
        refs.pad.style.top = layout.pad.y + "px";
        refs.padGlow.style.left = layout.pad.x + "px";
        refs.padGlow.style.top = layout.pad.y + "px";
        refs.padTrail.style.left = layout.pad.x + "px";
        refs.padTrail.style.top = layout.pad.y + "px";

        // Dismount on the far/back side of the PAD.
        // Depth is also switched below the PAD layer so it reads visually as behind.
        player.x = layout.pad.x;
        player.y = layout.pad.y - PAD_DISMOUNT_OFFSET_Y;
        player.dir = "up";
        player.moving = false;
        player.frame = 0;
        player.anim = 0;
        player.target = null;

        flightStatus.textContent = "PAD着陸完了";
        moveGuide.textContent = "行きたい場所をタップ / ドラッグで自由移動";
        moveGuide.hidden = false;
        setActorPosition();
        setActorVisual();
      }

      function beginPadExit() {
        if (ride.exitStarted || ride.mode !== "flying") return;
        ride.exitStarted = true;
        story.locked = true;
        document.body.classList.add("story-running");
        player.target = null;
        clearTargetRing();
        setRideMode("exiting");

        window.setTimeout(() => {
          location.href = "./star-country-landing.html?from=alenon&v=orb-wind-restore-v21";
        }, 820);
      }

      function resetRide() {
        ride.mode = "ground";
        ride.x = layout.pad.x;
        ride.y = layout.pad.y;
        ride.lift = 0;
        ride.progress = 0;
        ride.exitStarted = false;
        ride.homeArmed = false;
        ride.reboardLockedUntil = 0;
        document.body.classList.remove("pad-boarding", "pad-riding", "pad-landing", "pad-exiting");
        refs.pad.style.left = layout.pad.x + "px";
        refs.pad.style.top = layout.pad.y + "px";
        refs.padGlow.style.left = layout.pad.x + "px";
        refs.padGlow.style.top = layout.pad.y + "px";
        refs.padTrail.style.left = layout.pad.x + "px";
        refs.padTrail.style.top = layout.pad.y + "px";
        flightStatus.textContent = "PADが共鳴している…";
        moveGuide.textContent = "行きたい場所をタップ / ドラッグで自由移動";
      }

      function setActorPosition() {
        shionActor.style.left = player.x + "px";
        shionActor.style.top = player.y + "px";
        shionShadow.style.left = player.x + "px";
        shionShadow.style.top = player.y + "px";

        // Ground depth around the PAD:
        // smaller Y = farther/back side, so render Shion behind the PAD.
        // While riding/boarding/landing, keep him above the moving PAD.
        if (ride.mode === "ground") {
          const behindPad =
            Math.abs(player.x - layout.pad.x) <= layout.pad.size * .62 &&
            player.y < layout.pad.y - 6;
          shionActor.style.zIndex = behindPad ? "19" : "44";
          shionShadow.style.zIndex = behindPad ? "18" : "43";
        } else {
          shionActor.style.zIndex = "44";
          shionShadow.style.zIndex = "43";
        }
      }

      const idleFrame = Object.freeze({ down: 0, up: 1, left: 2, right: 3 });
      const walkSheet = Object.freeze({
        down: "./assets/sprites/shion/shion_walk_down.png",
        up: "./assets/sprites/shion/shion_walk_up.png",
        left: "./assets/sprites/shion/shion_walk_left.png",
        right: "./assets/sprites/shion/shion_walk_right.png",
      });

      function preloadImage(src) {
        return new Promise((resolve) => {
          const image = new Image();
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            resolve();
          };
          image.onload = finish;
          image.onerror = finish;
          image.src = src;
          if (image.decode) image.decode().then(finish).catch(() => {});
        });
      }

      // Start loading every Shion sheet as soon as the map script runs.
      // The first scripted walk used to request walk_down only when movement began,
      // which could make Shion disappear/reappear on mobile and look like a jump.
      const shionSpriteReady = Promise.all([
        "./assets/sprites/shion/shion_idle.png",
        ...Object.values(walkSheet),
      ].map(preloadImage));

      function setActorVisual() {
        if (player.moving) {
          shionActor.style.backgroundImage = `url("${walkSheet[player.dir]}")`;
          shionActor.style.backgroundPosition = `${-58.5 * player.frame}px 0`;
        } else {
          shionActor.style.backgroundImage =
            'url("./assets/sprites/shion/shion_idle.png")';
          shionActor.style.backgroundPosition =
            `${-58.5 * idleFrame[player.dir]}px 0`;
        }
      }

      function directionFromVector(dx, dy) {
        if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? "left" : "right";
        return dy < 0 ? "up" : "down";
      }

      function screenToWorld(clientX, clientY) {
        return {
          x: (clientX - cameraTx) / worldScale,
          y: (clientY - cameraTy) / worldScale,
        };
      }

      function pointInPoly(x, y, points) {
        let inside = false;
        for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
          const a = points[j];
          const b = points[i];
          const minX = Math.min(a[0], b[0]);
          const maxX = Math.max(a[0], b[0]);
          const minY = Math.min(a[1], b[1]);
          const maxY = Math.max(a[1], b[1]);
          const cross = (x - a[0]) * (b[1] - a[1]) - (y - a[1]) * (b[0] - a[0]);
          if (
            Math.abs(cross) < 0.0001 &&
            x >= minX - 0.0001 && x <= maxX + 0.0001 &&
            y >= minY - 0.0001 && y <= maxY + 0.0001
          ) {
            return true;
          }
          if (
            (a[1] > y) !== (b[1] > y) &&
            x < ((b[0] - a[0]) * (y - a[1])) / (b[1] - a[1]) + a[0]
          ) {
            inside = !inside;
          }
        }
        return inside;
      }

      function isGroundWalkable(x, y) {
        if (!alenonCollisionReady || !alenonWalkAreas.length) return true;
        return alenonWalkAreas.some(
          (area) => area.type === "poly" && pointInPoly(x, y, area.points),
        );
      }

      function nearestPointOnSegment(point, a, b) {
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const length2 = dx * dx + dy * dy;
        const t = length2
          ? clamp(
              ((point.x - a[0]) * dx + (point.y - a[1]) * dy) / length2,
              0,
              1,
            )
          : 0;
        return { x: a[0] + dx * t, y: a[1] + dy * t };
      }

      function nearestGroundPoint(point) {
        if (!alenonCollisionReady || !alenonWalkAreas.length) return { ...point };
        if (isGroundWalkable(point.x, point.y)) return { ...point };

        let best = null;
        let bestDistance = Infinity;
        for (const area of alenonWalkAreas) {
          if (area.type !== "poly" || !Array.isArray(area.points)) continue;
          for (let i = 0, j = area.points.length - 1; i < area.points.length; j = i++) {
            const candidate = nearestPointOnSegment(point, area.points[j], area.points[i]);
            const distance = Math.hypot(candidate.x - point.x, candidate.y - point.y);
            if (distance < bestDistance) {
              best = candidate;
              bestDistance = distance;
            }
          }
        }
        return best;
      }

      async function loadAlenonCollision() {
        const response = await fetch(COLLISION_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("アレノンの当たり判定を読み込めません: " + response.status);
        const data = await response.json();
        if (
          data?.map !== "alenon" ||
          data?.referenceSize?.width !== WORLD_W ||
          data?.referenceSize?.height !== WORLD_H ||
          !Array.isArray(data?.walkAreas)
        ) {
          throw new Error("アレノンの当たり判定データが不正です");
        }
        alenonWalkAreas = data.walkAreas.filter(
          (area) =>
            area?.type === "poly" &&
            Array.isArray(area.points) &&
            area.points.length >= 3,
        );
        alenonCollisionReady = alenonWalkAreas.length > 0;
      }

      function clampPlayer() {
        player.x = clamp(player.x, WORLD_MARGIN, WORLD_W - WORLD_MARGIN);
        player.y = clamp(player.y, WORLD_MARGIN + 60, WORLD_H - WORLD_MARGIN);
      }

      function showTarget(point) {
        moveTargetRing.style.left = point.x + "px";
        moveTargetRing.style.top = point.y + "px";
        moveTargetRing.classList.add("active");
      }

      function clearTargetRing() {
        moveTargetRing.classList.remove("active");
      }

      function updateOrbInteractionRange() {
        if (!story.completed || ride.mode !== "ground") return;

        const distance = Math.hypot(
          player.x - layout.orb.x,
          player.y - layout.orb.y,
        );

        if (distance >= ORB_INTERACT_REARM_RADIUS) {
          orbInteraction.armed = true;
        }

        if (
          distance <= ORB_INTERACT_RADIUS &&
          orbInteraction.armed &&
          !story.locked &&
          !orbInteraction.promptOpen &&
          !orbInteraction.inspecting
        ) {
          openOrbInteractionChoice();
        }
      }

      function resetPlayer() {
        resetRide();
        player.x = SHION_SPAWN.x;
        player.y = SHION_SPAWN.y;
        player.dir = "up";
        player.moving = false;
        player.frame = 0;
        player.anim = 0;
        player.target = null;
        orbInteraction.armed = true;
        if (orbInteraction.promptOpen || orbInteraction.inspecting) {
          orbInteraction.promptOpen = false;
          orbInteraction.inspecting = false;
          hideOrbInteractionChoice();
          document.body.classList.remove("orb-inspect-shimmer");
        }
        clearTargetRing();
        setActorPosition();
        setActorVisual();
        syncCamera();
      }

      function initMovement() {
        const keys = new Set();
        const stick = {
          active: false,
          pointerId: null,
          ox: 0,
          oy: 0,
          x: 0,
          y: 0,
          startedAt: 0,
          moved: false,
        };
        const STICK_RADIUS = 42;
        let pointerStart = null;
        let last = performance.now();
        let guideTimer = window.setTimeout(() => {
          moveGuide.hidden = true;
        }, 5000);

        function hideGuide() {
          if (!moveGuide.hidden) moveGuide.hidden = true;
          clearTimeout(guideTimer);
        }

        function updateJoystick(clientX, clientY) {
          const dx = clientX - stick.ox;
          const dy = clientY - stick.oy;
          const length = Math.hypot(dx, dy);
          const ratio = length > STICK_RADIUS ? STICK_RADIUS / length : 1;
          const kx = dx * ratio;
          const ky = dy * ratio;
          stick.x = kx / STICK_RADIUS;
          stick.y = ky / STICK_RADIUS;
          moveJoystickKnob.style.transform =
            `translate(${kx}px,${ky}px)`;
        }

        function startJoystick(event) {
          stick.active = true;
          stick.pointerId = event.pointerId;
          stick.ox = pointerStart.x;
          stick.oy = pointerStart.y;
          stick.x = 0;
          stick.y = 0;
          stick.moved = true;
          moveJoystick.hidden = false;
          moveJoystick.style.left = stick.ox + "px";
          moveJoystick.style.top = stick.oy + "px";
          updateJoystick(event.clientX, event.clientY);
          player.target = null;
          clearTargetRing();
          hideGuide();
        }

        function stopJoystick() {
          stick.active = false;
          stick.pointerId = null;
          stick.x = 0;
          stick.y = 0;
          moveJoystick.hidden = true;
          moveJoystickKnob.style.transform = "translate(0, 0)";
        }

        function setTapTarget(clientX, clientY) {
          if (story.locked) return;
          const point = screenToWorld(clientX, clientY);
          point.x = clamp(point.x, WORLD_MARGIN, WORLD_W - WORLD_MARGIN);
          if (ride.mode === "flying") {
            point.y = clamp(point.y, 80, WORLD_H + 24);
          } else {
            point.y = clamp(point.y, WORLD_MARGIN + 60, WORLD_H - WORLD_MARGIN);
          }
          if (ride.mode !== "flying" && alenonCollisionReady) {
            const nearest = nearestGroundPoint(point);
            if (!nearest) return;
            point.x = nearest.x;
            point.y = nearest.y;
          }
          player.target = point;
          showTarget(point);
          hideGuide();
        }

        viewport.addEventListener("pointerdown", (event) => {
          if (story.locked) return;
          if (document.body.classList.contains("object-mode") || document.body.classList.contains("deadpad-mode") || document.body.classList.contains("collision-mode")) return;
          if (event.target.closest?.("#move-reset") || event.target.closest?.("#object-toggle") || event.target.closest?.("#deadpad-toggle") || event.target.closest?.("#collision-toggle")) return;
          if (event.button != null && event.button !== 0) return;
          event.preventDefault();
          pointerStart = {
            id: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            time: performance.now(),
          };
          viewport.setPointerCapture?.(event.pointerId);
        }, { passive: false });

        viewport.addEventListener("pointermove", (event) => {
          if (!pointerStart || pointerStart.id !== event.pointerId) return;
          event.preventDefault();

          if (stick.active && stick.pointerId === event.pointerId) {
            updateJoystick(event.clientX, event.clientY);
            return;
          }

          const dist = Math.hypot(
            event.clientX - pointerStart.x,
            event.clientY - pointerStart.y,
          );
          if (dist >= 12) startJoystick(event);
        }, { passive: false });

        function finishPointer(event) {
          if (!pointerStart || pointerStart.id !== event.pointerId) return;
          event.preventDefault();

          const wasStick = stick.active && stick.pointerId === event.pointerId;
          const elapsed = performance.now() - pointerStart.time;
          const dist = Math.hypot(
            event.clientX - pointerStart.x,
            event.clientY - pointerStart.y,
          );

          if (wasStick) {
            stopJoystick();
          } else if (elapsed < 650 && dist < 12) {
            setTapTarget(event.clientX, event.clientY);
          }

          if (viewport.hasPointerCapture?.(event.pointerId)) {
            viewport.releasePointerCapture(event.pointerId);
          }
          pointerStart = null;
        }

        viewport.addEventListener("pointerup", finishPointer, { passive: false });
        viewport.addEventListener("pointercancel", (event) => {
          if (stick.pointerId === event.pointerId) stopJoystick();
          if (pointerStart?.id === event.pointerId) pointerStart = null;
        }, { passive: false });

        window.addEventListener("keydown", (event) => {
          if (story.locked) return;
          if (document.body.classList.contains("object-mode") || document.body.classList.contains("deadpad-mode") || document.body.classList.contains("collision-mode")) return;
          const key = event.key.toLowerCase();
          if (["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(key)) {
            keys.add(key);
            player.target = null;
            clearTargetRing();
            hideGuide();
            event.preventDefault();
          }
        }, { passive: false });

        window.addEventListener("keyup", (event) => {
          keys.delete(event.key.toLowerCase());
        });

        moveReset.addEventListener("click", (event) => {
          event.preventDefault();
          resetPlayer();
        });

        function keyVector() {
          let x = 0;
          let y = 0;
          if (keys.has("arrowleft") || keys.has("a")) x -= 1;
          if (keys.has("arrowright") || keys.has("d")) x += 1;
          if (keys.has("arrowup") || keys.has("w")) y -= 1;
          if (keys.has("arrowdown") || keys.has("s")) y += 1;
          const length = Math.hypot(x, y);
          return length ? { x: x / length, y: y / length } : { x: 0, y: 0 };
        }

        function loop(now) {
          const dt = Math.min((now - last) / 1000, .05);
          last = now;

          if (ride.mode === "boarding") {
            ride.progress = Math.min(1, ride.progress + dt / PAD_BOARD_DURATION);
            const t = easeOutCubic(ride.progress);
            ride.lift = PAD_LIFT * t;
            player.x = ride.fromX + (ride.x - ride.fromX) * t;
            player.y = ride.fromY + ((ride.y - PAD_LIFT - 2) - ride.fromY) * t;
            player.moving = false;
            player.dir = "down";
            syncRideVisual(now);

            if (ride.progress >= 1) {
              story.locked = false;
              document.body.classList.remove("story-running");
              setRideMode("flying");
            }

            setActorPosition();
            setActorVisual();
            syncCamera();
            requestAnimationFrame(loop);
            return;
          }

          if (ride.mode === "landing") {
            ride.progress = Math.min(1, ride.progress + dt / PAD_LAND_DURATION);
            const t = easeOutCubic(ride.progress);

            ride.x = ride.landFromX + (layout.pad.x - ride.landFromX) * t;
            ride.y = ride.landFromY + (layout.pad.y - ride.landFromY) * t;
            ride.lift = ride.landFromLift * (1 - t);

            syncRideVisual(now);

            if (ride.progress >= 1) {
              finishPadLanding();
            }

            setActorPosition();
            setActorVisual();
            syncCamera();
            requestAnimationFrame(loop);
            return;
          }

          if (ride.mode === "exiting") {
            ride.lift = 0;
            player.moving = false;
            syncRideVisual(now);
            setActorPosition();
            setActorVisual();
            syncCamera();
            requestAnimationFrame(loop);
            return;
          }

          if (story.locked) {
            if (!story.scripted) {
              player.moving = false;
              player.frame = 0;
              player.anim = 0;
            }
            setActorPosition();
            setActorVisual();
            syncCamera();
            requestAnimationFrame(loop);
            return;
          }

          const keyboard = keyVector();
          let vx = keyboard.x;
          let vy = keyboard.y;
          let manual = Math.hypot(vx, vy) > .01;

          if (!manual && stick.active) {
            vx = stick.x;
            vy = stick.y;
            manual = Math.hypot(vx, vy) > .08;
          }

          const originX = ride.mode === "flying" ? ride.x : player.x;
          const originY = ride.mode === "flying" ? ride.y : player.y;

          if (!manual && player.target) {
            const dx = player.target.x - originX;
            const dy = player.target.y - originY;
            const distance = Math.hypot(dx, dy);
            if (distance <= 3.5) {
              if (ride.mode === "flying") {
                ride.x = player.target.x;
                ride.y = player.target.y;
              } else {
                if (isGroundWalkable(player.target.x, player.target.y)) {
                  player.x = player.target.x;
                  player.y = player.target.y;
                }
              }
              player.target = null;
              clearTargetRing();
            } else {
              vx = dx / distance;
              vy = dy / distance;
            }
          }

          const hasMove = manual || !!player.target;
          if (hasMove && Math.hypot(vx, vy) > .001) {
            player.dir = directionFromVector(vx, vy);

            if (ride.mode === "flying") {
              const speedWorld = PAD_SPEED_SCREEN / worldScale;
              ride.x += vx * speedWorld * dt;
              ride.y += vy * speedWorld * dt;
              ride.x = clamp(ride.x, WORLD_MARGIN, WORLD_W - WORLD_MARGIN);
              ride.y = clamp(ride.y, 70, WORLD_H + 32);
              ride.lift = PAD_LIFT;
              player.moving = false;
            } else {
              const speedWorld = SHION_SPEED_SCREEN / worldScale;
              const stepX = vx * speedWorld * dt;
              const stepY = vy * speedWorld * dt;
              const from = { x: player.x, y: player.y };
              const next = {
                x: clamp(player.x + stepX, WORLD_MARGIN, WORLD_W - WORLD_MARGIN),
                y: clamp(player.y + stepY, WORLD_MARGIN + 60, WORLD_H - WORLD_MARGIN),
              };

              let moved = false;
              if (!alenonCollisionReady) {
                player.x = next.x;
                player.y = next.y;
                moved = true;
              } else {
                const xOnly = {
                  x: clamp(player.x + stepX, WORLD_MARGIN, WORLD_W - WORLD_MARGIN),
                  y: player.y,
                };
                const yOnly = {
                  x: player.x,
                  y: clamp(player.y + stepY, WORLD_MARGIN + 60, WORLD_H - WORLD_MARGIN),
                };

                if (isGroundWalkable(next.x, next.y)) {
                  player.x = next.x;
                  player.y = next.y;
                  moved = true;
                } else if (Math.abs(stepX) >= Math.abs(stepY)) {
                  if (isGroundWalkable(xOnly.x, xOnly.y)) {
                    player.x = xOnly.x;
                    moved = true;
                  } else if (isGroundWalkable(yOnly.x, yOnly.y)) {
                    player.y = yOnly.y;
                    moved = true;
                  }
                } else {
                  if (isGroundWalkable(yOnly.x, yOnly.y)) {
                    player.y = yOnly.y;
                    moved = true;
                  } else if (isGroundWalkable(xOnly.x, xOnly.y)) {
                    player.x = xOnly.x;
                    moved = true;
                  }
                }
              }

              if (moved) {
                player.anim += dt * 8.5;
                player.frame = Math.floor(player.anim) % 4;
                player.moving = true;
              } else {
                player.moving = false;
                player.anim = 0;
                player.frame = 0;
                if (player.target) {
                  player.target = null;
                  clearTargetRing();
                }
              }
            }
          } else {
            player.moving = false;
            player.anim = 0;
            player.frame = 0;
          }

          if (ride.mode === "flying") {
            syncRideVisual(now);

            const homeDistance = Math.hypot(
              ride.x - layout.pad.x,
              ride.y - layout.pad.y,
            );

            if (!ride.homeArmed && homeDistance >= PAD_HOME_ARM_DISTANCE) {
              ride.homeArmed = true;
            }

            if (ride.homeArmed && homeDistance <= PAD_HOME_LAND_RADIUS) {
              beginPadLanding();
            } else if (ride.y >= PAD_EXIT_Y) {
              beginPadExit();
            }
          } else if (ride.mode === "ground") {
            updateOrbInteractionRange();

            const padDistance = Math.hypot(
              player.x - layout.pad.x,
              player.y - layout.pad.y,
            );
            if (
              performance.now() >= ride.reboardLockedUntil &&
              padDistance <= PAD_TOUCH_RADIUS
            ) {
              beginBoarding();
            }
          }

          setActorPosition();
          setActorVisual();
          syncCamera();
          requestAnimationFrame(loop);
        }

        resetPlayer();
        requestAnimationFrame((now) => {
          last = now;
          loop(now);
        });
      }

      initRuinDrift();

      if (!editMode) {
        initObjectAdjust();
        initDeadPadAdjust();
        initCollisionEditor();
        // The prologue must never depend on collision JSON finishing first.
        // Safari/raw.githack can delay or reject that fetch; previously this left
        // the opaque prologue overlay on screen forever.
        initMovement();
        preparePrologue();
        loadAlenonCollision().catch((error) => {
          console.error(error);
          // Keep the story playable. Collision remains disabled until a reload
          // succeeds instead of blocking the entire prologue on a black screen.
        });
        return;
      }
      document.body.classList.add("edit-mode");

      const xInput = document.getElementById("editor-x");
      const yInput = document.getElementById("editor-y");
      const sizeRange = document.getElementById("editor-size");
      const sizeNumber = document.getElementById("editor-size-number");
      const sizeLabel = document.getElementById("editor-size-label");
      const copyButton = document.getElementById("editor-copy");
      const resetButton = document.getElementById("editor-reset");
      const toast = document.getElementById("editor-toast");
      const layerButtons = [...document.querySelectorAll("[data-editor-select]")];

      let selected = "groundS";
      let toastTimer = 0;
      const pointers = new Map();
      let dragStart = null;
      let pinchStart = null;

      function selectedItem() {
        return layout[selected];
      }

      function sizeValue(item) {
        return item.kind === "ground" ? item.scale : item.size;
      }

      function configureSizeControl() {
        const item = selectedItem();
        const isGround = item.kind === "ground";
        sizeLabel.textContent = isGround ? "拡大率" : "大きさ";
        sizeRange.min = isGround ? "0.20" : "80";
        sizeRange.max = isGround ? "1.40" : "900";
        sizeRange.step = isGround ? "0.01" : "1";
        sizeNumber.min = sizeRange.min;
        sizeNumber.max = sizeRange.max;
        sizeNumber.step = sizeRange.step;
      }

      function refreshControls() {
        const item = selectedItem();
        configureSizeControl();
        xInput.value = Math.round(item.x * 10) / 10;
        yInput.value = Math.round(item.y * 10) / 10;
        const v = sizeValue(item);
        sizeRange.value = v;
        sizeNumber.value = item.kind === "ground"
          ? (Math.round(v * 100) / 100).toFixed(2)
          : Math.round(v);
        for (const button of layerButtons) {
          button.setAttribute(
            "aria-pressed",
            button.dataset.editorSelect === selected ? "true" : "false",
          );
        }
      }

      function setPositionFromInputs() {
        const item = selectedItem();
        const x = Number(xInput.value);
        const y = Number(yInput.value);
        if (Number.isFinite(x)) item.x = x;
        if (Number.isFinite(y)) item.y = y;
        applyLayout();
      }

      function setSize(value) {
        const item = selectedItem();
        const n = Number(value);
        if (!Number.isFinite(n)) return;
        if (item.kind === "ground") {
          item.scale = Math.max(.20, Math.min(1.40, n));
        } else {
          item.size = Math.max(80, Math.min(900, n));
        }
        applyLayout();
        refreshControls();
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("show");
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
      }

      for (const button of layerButtons) {
        button.addEventListener("click", () => {
          selected = button.dataset.editorSelect;
          refreshControls();
          showToast(button.textContent + "を選択");
        });
      }

      xInput.addEventListener("input", setPositionFromInputs);
      yInput.addEventListener("input", setPositionFromInputs);
      sizeRange.addEventListener("input", () => setSize(sizeRange.value));
      sizeNumber.addEventListener("input", () => setSize(sizeNumber.value));

      resetButton.addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY);
        layout = cloneDefaults();
        applyLayout();
        refreshControls();
        showToast("GitHubの現在配置に戻しました");
      });

      copyButton.addEventListener("click", async () => {
        const payload = {
          ground_s: {
            x: Math.round(layout.groundS.x * 10) / 10,
            y: Math.round(layout.groundS.y * 10) / 10,
            scale: Math.round(layout.groundS.scale * 1000) / 1000,
          },
          ground_l: {
            x: Math.round(layout.groundL.x * 10) / 10,
            y: Math.round(layout.groundL.y * 10) / 10,
            scale: Math.round(layout.groundL.scale * 1000) / 1000,
          },
          ground_r: {
            x: Math.round(layout.groundR.x * 10) / 10,
            y: Math.round(layout.groundR.y * 10) / 10,
            scale: Math.round(layout.groundR.scale * 1000) / 1000,
          },
          pad: {
            x: Math.round(layout.pad.x * 10) / 10,
            y: Math.round(layout.pad.y * 10) / 10,
            size: Math.round(layout.pad.size),
          },
          orb: {
            x: Math.round(layout.orb.x * 10) / 10,
            y: Math.round(layout.orb.y * 10) / 10,
            size: Math.round(layout.orb.size),
          },
        };
        const text = JSON.stringify(payload, null, 2);
        try {
          await navigator.clipboard.writeText(text);
          showToast("調整値をコピーしました");
        } catch (_) {
          window.prompt("この調整値をコピーして送ってください", text);
        }
      });

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      viewport.addEventListener("pointerdown", (event) => {
        if (event.target.closest?.("#editor-panel")) return;
        event.preventDefault();
        viewport.setPointerCapture?.(event.pointerId);
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (pointers.size === 1) {
          const item = selectedItem();
          dragStart = {
            pointerId: event.pointerId,
            clientX: event.clientX,
            clientY: event.clientY,
            x: item.x,
            y: item.y,
          };
          pinchStart = null;
        } else if (pointers.size === 2) {
          const values = [...pointers.values()];
          pinchStart = {
            distance: Math.max(1, distance(values[0], values[1])),
            size: sizeValue(selectedItem()),
          };
          dragStart = null;
        }
      }, { passive: false });

      viewport.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId)) return;
        event.preventDefault();
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (pointers.size >= 2 && pinchStart) {
          const values = [...pointers.values()];
          const current = Math.max(1, distance(values[0], values[1]));
          const ratio = current / pinchStart.distance;
          setSize(pinchStart.size * ratio);
          return;
        }

        if (!dragStart || dragStart.pointerId !== event.pointerId) return;
        const item = selectedItem();
        item.x = dragStart.x + (event.clientX - dragStart.clientX) / worldScale;
        item.y = dragStart.y + (event.clientY - dragStart.clientY) / worldScale;
        applyLayout();
        refreshControls();
      }, { passive: false });

      function endPointer(event) {
        if (!pointers.has(event.pointerId)) return;
        event.preventDefault();
        pointers.delete(event.pointerId);
        if (viewport.hasPointerCapture?.(event.pointerId)) {
          viewport.releasePointerCapture(event.pointerId);
        }

        if (pointers.size === 1) {
          const [pointerId, point] = [...pointers.entries()][0];
          const item = selectedItem();
          dragStart = {
            pointerId,
            clientX: point.x,
            clientY: point.y,
            x: item.x,
            y: item.y,
          };
          pinchStart = null;
        } else {
          dragStart = null;
          pinchStart = null;
        }
      }

      viewport.addEventListener("pointerup", endPointer, { passive: false });
      viewport.addEventListener("pointercancel", endPointer, { passive: false });
      viewport.addEventListener("lostpointercapture", (event) => {
        pointers.delete(event.pointerId);
      });

      refreshControls();
      showToast("配置調整モード");
    })();
  </script>
</body>
</html>

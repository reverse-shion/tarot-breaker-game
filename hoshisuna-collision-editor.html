<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>星砂 当たり判定エディタ</title><link rel="stylesheet" href="./sky-atmosphere.css"><link rel="stylesheet" href="./cloud-motion-fix.css"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#10152e;color:#fff;font:13px system-ui}#view{position:fixed;inset:0;touch-action:none;overflow:hidden}#world{position:absolute;width:1448px;height:1086px;transform-origin:top left;isolation:isolate}.scene-world-layer{position:absolute;inset:0;width:1448px;height:1086px}.scene-farthest-sky{z-index:0!important}.scene-star-sky{z-index:1!important}.scene-cloud-main{z-index:2!important}#road,#paint{position:absolute;inset:0;width:1448px;height:1086px}#road{z-index:3}#paint{z-index:4}
#panel{position:fixed;z-index:15;left:12px;top:calc(12px + env(safe-area-inset-top));width:min(290px,calc(100vw - 24px));max-height:68vh;overflow:auto;background:#102039ef;border:1px solid #7396bc;border-radius:12px;touch-action:auto}#handle{background:#335577;padding:12px;touch-action:none;cursor:grab}#inside{padding:10px;display:grid;gap:9px}button,select,textarea{background:#233b58;color:#fff;border:1px solid #799ab7;border-radius:6px;padding:8px;font:inherit}button{cursor:pointer}.row{display:flex;gap:5px}.row>*{flex:1;min-width:0}textarea{width:100%;height:85px;box-sizing:border-box;font:10px monospace}#toggle{position:fixed;z-index:20;right:12px;bottom:calc(14px + env(safe-area-inset-bottom))}#msg{font-size:11px}
</style></head><body>
<div id="view"><div id="world"><div class="scene-world-layer scene-farthest-sky"><img src="./assets/maps/star-country-farthest-sky-background.webp"></div><div class="scene-world-layer scene-star-sky"><img src="./assets/maps/star-country-gate-garden-star-sky.webp"></div><div class="scene-world-layer scene-cloud-main"><div class="scene-cloud-main-track"><img class="scene-cloud-copy" src="./assets/maps/star-country-world-clouds.webp?asset=eaea4c9513cf"><img class="scene-cloud-copy" src="./assets/maps/star-country-world-clouds.webp?asset=eaea4c9513cf"><img class="scene-cloud-copy" src="./assets/maps/star-country-world-clouds.webp?asset=eaea4c9513cf"></div></div><img id="road" src="./assets/events/hoshisuna/map/starroad.webp"><canvas id="paint" width="1448" height="1086"></canvas></div></div>
<aside id="panel"><div id="handle">⠿ エディタを移動（ここをドラッグ）</div><div id="inside"><select id="layer"><option value="walkAreas">緑：歩行可能</option><option value="blockedAreas">赤：障害物</option><option value="behindForegroundAreas">紫：柱・景色の裏（通行可能）</option></select><div class="row"><button id="draw">多角形入力</button><button id="pan">画面移動</button></div><div class="row"><button id="finish">確定</button><button id="undo">1点戻す</button><button id="cancel">取消</button></div><div class="row"><button id="del">最後の範囲削除</button><button id="reset">全消去</button></div><div class="row"><button id="export">JSON表示</button><button id="save">保存</button></div><textarea id="json" placeholder="JSON読み込み・書き出し"></textarea><button id="import">JSON読込</button><div id="msg">3点以上で多角形を確定。紫は通行可能で、キャラを柱の後ろへ隠す設定です。</div></div></aside><button id="toggle">パネルを隠す</button>
<script>(()=>{'use strict';const $=s=>document.getElementById(s),view=$('view'),world=$('world'),ctx=$('paint').getContext('2d'),panel=$('panel');let mode='draw',zoom=1,cx=724,cy=543,drag=null,handle=null,draft=[];const W=1448,H=1086,C={walkAreas:'#44ff99',blockedAreas:'#ff5577',behindForegroundAreas:'#b289ff'};let d={version:1,map:'star-country-gate-garden',referenceSize:{width:W,height:H},walkAreas:[],blockedAreas:[],behindForegroundAreas:[]};const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function pos(){let vw=innerWidth/zoom,vh=innerHeight/zoom;cx=clamp(cx,vw/2,Math.max(vw/2,W-vw/2));cy=clamp(cy,vh/2,Math.max(vh/2,H-vh/2));world.style.transform='translate3d('+(innerWidth/2-cx*zoom)+'px,'+(innerHeight/2-cy*zoom)+'px,0) scale('+zoom+')'}function resize(){zoom=clamp(Math.min(innerWidth/390,innerHeight/844)*1.04,.84,1.2);pos()}function point(e){return [Math.round((e.clientX-innerWidth/2)/zoom+cx),Math.round((e.clientY-innerHeight/2)/zoom+cy)]}function paint(){ctx.clearRect(0,0,W,H);for(let k of Object.keys(C)){ctx.strokeStyle=C[k];ctx.fillStyle=C[k]+'44';ctx.lineWidth=3;for(let area of d[k]){ctx.beginPath();area.points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();ctx.stroke()}}ctx.strokeStyle=C[$('layer').value];ctx.fillStyle='#fff';ctx.beginPath();draft.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();for(let p of draft){ctx.beginPath();ctx.arc(...p,5,0,Math.PI*2);ctx.fill()}$('msg').textContent='歩行 '+d.walkAreas.length+'｜障害物 '+d.blockedAreas.length+'｜前景 '+d.behindForegroundAreas.length+'｜未確定 '+draft.length+'点'}
view.onpointerdown=e=>{if(mode==='pan'){drag={id:e.pointerId,x:e.clientX,y:e.clientY};view.setPointerCapture(e.pointerId)}else{let p=point(e);if(p[0]>=0&&p[0]<=W&&p[1]>=0&&p[1]<=H){draft.push(p);paint()}}};view.onpointermove=e=>{if(drag?.id!==e.pointerId)return;cx-=(e.clientX-drag.x)/zoom;cy-=(e.clientY-drag.y)/zoom;drag.x=e.clientX;drag.y=e.clientY;pos()};view.onpointerup=view.onpointercancel=()=>drag=null;
$('draw').onclick=()=>mode='draw';$('pan').onclick=()=>mode='pan';$('finish').onclick=()=>{if(draft.length<3){$('msg').textContent='3点以上指定してください';return}d[$('layer').value].push({type:'poly',points:draft});draft=[];paint()};$('undo').onclick=()=>{draft.pop();paint()};$('cancel').onclick=()=>{draft=[];paint()};$('del').onclick=()=>{d[$('layer').value].pop();paint()};$('reset').onclick=()=>{if(confirm('すべて消去しますか？')){for(let k of Object.keys(C))d[k]=[];draft=[];paint()}};$('export').onclick=()=>{$('json').value=JSON.stringify(d,null,2)};$('save').onclick=()=>{let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='starroad-collision.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>{try{let j=JSON.parse($('json').value);if(j.referenceSize?.width!==W||j.referenceSize?.height!==H||!Object.keys(C).every(k=>Array.isArray(j[k])&&j[k].every(a=>a.type==='poly'&&a.points.length>=3&&a.points.every(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)))))throw Error('無効な形状');d={...d,...j};draft=[];paint()}catch(e){$('msg').textContent='読込不可：'+e.message}};$('toggle').onclick=()=>{panel.hidden=!panel.hidden;$('toggle').textContent=panel.hidden?'パネルを表示':'パネルを隠す'};$('handle').onpointerdown=e=>{handle={id:e.pointerId,x:e.clientX,y:e.clientY,l:panel.offsetLeft,t:panel.offsetTop};$('handle').setPointerCapture(e.pointerId)};$('handle').onpointermove=e=>{if(handle?.id!==e.pointerId)return;panel.style.left=clamp(handle.l+e.clientX-handle.x,0,Math.max(0,innerWidth-panel.offsetWidth))+'px';panel.style.top=clamp(handle.t+e.clientY-handle.y,0,innerHeight-40)+'px'};$('handle').onpointerup=$('handle').onpointercancel=()=>handle=null;window.addEventListener('resize',resize);resize();paint()})();</script></body></html>

name: Verified Gameplay Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verified-gameplay-contracts:
    name: Verified Gameplay Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run verified gameplay contracts
        run: node --test tests/verified-gameplay-contracts.test.cjs
      - name: Run event development contracts
        run: node --test tests/event-development-contract.test.cjs

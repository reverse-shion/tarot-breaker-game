name: Event Safety / Main Merge Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  event-safety:
    name: Event Safety / Main Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Main lineage guard
        run: node scripts/main-lineage-guard.cjs
      - name: Device registry guard
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/device-registry-guard.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verified gameplay regression contracts
        run: node --test tests/verified-gameplay-contracts.test.cjs
      - name: Event development system contract
        run: node --test tests/event-development-contract.test.cjs
      - name: Event contracts
        run: node --test tests/event-contracts.test.cjs
      - name: Dev checkpoint contracts
        run: node --test tests/dev-checkpoints.test.cjs
      - name: Integration contracts
        run: node --test tests/integration-contracts.test.cjs
      - name: Main merge gate contract
        run: node --test tests/merge-gate.test.cjs
      - name: Main lineage guard contract
        run: node --test tests/main-lineage-guard.test.cjs
      - name: Device registry guard contract
        run: node --test tests/device-registry-guard.test.cjs
      - name: Asset Studio auto-merge policy contract
        run: node --test tests/asset-studio-auto-merge.test.cjs

name: Event Safety / Main Merge Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  event-safety:
    name: Event Safety / Main Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verified gameplay regression contracts
        run: node --test tests/verified-gameplay-contracts.test.cjs
      - name: Event development system contract
        run: node --test tests/event-development-contract.test.cjs
      - name: Event contracts
        run: node --test tests/event-contracts.test.cjs
      - name: Dev checkpoint contracts
        run: node --test tests/dev-checkpoints.test.cjs
      - name: Integration contracts
        run: node --test tests/integration-contracts.test.cjs
      - name: Main merge gate contract
        run: node --test tests/merge-gate.test.cjs
      - name: Star Gate choice checkpoint
        run: node --test tests/star-gate-choice-checkpoint.test.cjs

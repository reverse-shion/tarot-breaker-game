name: Lumiere newest reupload WebP preparation (isolated)
on:
  push:
    branches:
      - fix/lumiere-reupload-20261010
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch only exact uploaded PR git objects
        run: |
          set -euo pipefail
          for n in 136 137 138 140; do
            git fetch --no-tags origin "+refs/pull/$n/head:refs/remotes/origin/lumiere-source-pr-$n"
          done
      - name: Convert reuploads into valid lossless WebP
        run: |
          python -m pip install "Pillow==12.3.0" numpy scipy
          python scripts/convert-lumiere-reupload.py
      - name: Check WebP manifest and regression tests
        run: |
          set -euo pipefail
          node scripts/validate.mjs
          node scripts/test-regression-baseline.mjs
          git diff --exit-code -- game.js index.html lumiere-sway.js audio.js
      - name: Commit isolated converted assets to candidate branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites/lumiere/lumiere_idle.webp assets/sprites/lumiere/lumiere_hover-back.webp assets/sprites/lumiere/lumiere_hover_left.webp assets/sprites/lumiere/lumiere_hover_right.webp assets/sprites/lumiere/lumiere_sprite_manifest.json docs/lumiere-reupload-20261010/source-and-conversion.json
          git diff --cached --quiet && { echo "STOP: no changes"; exit 1; }
          git commit -m "fix(lumiere): convert latest 4 Asset Studio uploads to valid WebP"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

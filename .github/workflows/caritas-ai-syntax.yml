name: Caritas AI JavaScript syntax
on:
  pull_request:
    paths:
      - 'api/caritas-interpret.js'
      - 'caritas-battle-event.js'
      - 'hoshisuna-victory-audio.js'
      - 'hoshisuna-main.html'
      - 'tests/hoshisuna-victory-audio.test.cjs'
      - 'tests/hoshisuna-field-audio.test.cjs'
      - 'caritas-battle-core.js'
      - 'tests/caritas-ai-insight.test.cjs'
      - 'tests/caritas-main-interaction.test.cjs'
      - 'tests/caritas-battle-event.test.cjs'
      - 'tests/caritas-ai-api.test.cjs'
      - 'tests/caritas-ai-http-integration.cjs'
      - '.github/workflows/caritas-ai-syntax.yml'
  push:
    branches:
      - feature/caritas-ai-resonance-v1
      - feature/caritas-full-reading-v1-20261028
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check battle and API syntax
        run: |
          node --check api/caritas-interpret.js
          node --check caritas-battle-event.js
          node --check caritas-battle-core.js
      - name: Test AI, 27 combinations, and Shion-before-damage battle replay
        run: node --test tests/caritas-ai-insight.test.cjs tests/caritas-ai-api.test.cjs tests/caritas-battle-event.test.cjs tests/caritas-main-interaction.test.cjs
      - name: Test Caritas victory audio, field handoff, and existing combat music
        run: |
          node --check hoshisuna-victory-audio.js
          node --test tests/hoshisuna-victory-audio.test.cjs tests/hoshisuna-field-audio.test.cjs tests/hoshisuna-battle-audio.test.cjs
      - name: Test local HTTP API end to end (no Gemini quota)
        run: node tests/caritas-ai-http-integration.cjs



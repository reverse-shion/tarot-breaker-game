name: Lumiere candidate URL diagnostics
on:
  push:
    paths:
      - '.github/workflows/lumiere-url-check.yml'
permissions:
  contents: read
jobs:
  check-url:
    runs-on: ubuntu-latest
    steps:
      - name: Check standalone preview CDN
        run: |
          set -euo pipefail
          for domain in raw.githack.com rawcdn.githack.com; do
            URL="https://$domain/reverse-shion/tarot-breaker-game/942b6cec82d820163c77bbe4f0de6f7cc1f11ee0/docs/lumiere-sprite-replacement-20261010/lumiere-official-3724755.html?dev=garden-resume-after-lumiere"
            code=$(curl --retry 2 -L -s -o /tmp/preview.html -w '%{http_code}' --max-time 35 "$URL")
            echo "$domain: HTTP $code, $(wc -c < /tmp/preview.html) bytes"
            test "$code" = 200
            grep -q 'lumiere-official-controls' /tmp/preview.html
            grep -q '37247552f7885650dfa937a8d2228a7dc0053ad2' /tmp/preview.html
          done
          for name in lumiere_idle.webp lumiere_hover-back.webp lumiere_hover_left.webp lumiere_hover_right.webp; do
            URL="https://raw.githubusercontent.com/reverse-shion/tarot-breaker-game/37247552f7885650dfa937a8d2228a7dc0053ad2/assets/sprites/lumiere/$name"
            code=$(curl -L -s -o /tmp/sprite.webp -w '%{http_code}' --max-time 25 "$URL")
            echo "$name: HTTP $code"
            test "$code" = 200
            test "$(head -c 4 /tmp/sprite.webp)" = RIFF
          done

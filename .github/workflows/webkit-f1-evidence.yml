name: WebKit F1 fixed-fixture A-B evidence

on:
  push:
    branches: [qa/webkit-f1-evidence-v14c, qa/webkit-f1-exact-head-v15d, qa/webkit-f1-retry-pair-v16e]
  pull_request:
    branches: [fix/east-passage-integration-v12c, qa/webkit-f1-evidence-v14c, qa/webkit-f1-exact-head-v15d]
    paths:
      - 'qa/east-passage/f1/**'
      - 'qa/east-passage/README.md'
      - '.github/workflows/webkit-f1-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  F1_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  compare:
    name: '${{ matrix.engine }} engine — raw results plus explicit evidence classification'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: old
            playwright: '1.56.1'
          - engine: new
            playwright: '1.64.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact engine with standard host dependencies
        run: |
          npm install --no-save --no-package-lock playwright@${{ matrix.playwright }}
          npx playwright install --with-deps webkit
      - name: Check expected-failure classifier rejects unrelated failures
        run: node --test qa/east-passage/f1/classify.test.cjs
      - name: Run frozen native fixture and unwrapped original four; new engine also retains existing eleven
        env:
          F1_EVIDENCE_DIR: ${{ runner.temp }}/f1-${{ matrix.engine }}
        run: node qa/east-passage/f1/run.cjs ${{ matrix.engine }}
      - name: Preserve raw PASS-FAIL, hashes, timeline and classification (including failed probes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f1-${{ matrix.engine }}
          if-no-files-found: error

  identical-input-comparison:
    name: Compare equal hashes and explicit old-failure/new-pass evidence
    needs: compare
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          # Failed-job-only reruns may leave the successful peer at an earlier attempt.
          # The comparator selects latest per engine only after authenticating run/attempt/HEAD.
          pattern: f1-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/f1-pair
      - name: Verify latest engine evidence across attempts and exact input bytes
        run: node qa/east-passage/f1/compare.cjs '${{ runner.temp }}/f1-pair'
      - name: Preserve paired verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f1-pair/comparison.json
          if-no-files-found: error

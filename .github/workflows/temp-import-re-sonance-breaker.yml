name: Temporary Import RE SONANCE BREAKER
on:
  push:
    branches:
      - asset/re-sonance-breaker-bgm-20261101
permissions:
  contents: write
jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[asset-import]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch the original Suno audio verified against user's attached MP3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 'https://cdn1.suno.ai/28a669c5-aa72-4909-ac43-144c1abc20b0.mp3' -o /tmp/re-sonance-breaker.mp3
          echo 'f882ac76e19571d6d13ebff4d5fbe161af35b60b9d1ddfcc8471ed34ff7f35b8  /tmp/re-sonance-breaker.mp3' | sha256sum --check --status
          mkdir -p assets/battle/bgm
          cp /tmp/re-sonance-breaker.mp3 assets/battle/bgm/re-sonance-breaker.mp3
      - name: Commit only the verified audio asset and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/battle/bgm/re-sonance-breaker.mp3
          git rm -- .github/workflows/temp-import-re-sonance-breaker.yml
          git commit -m '[asset-import] add RE SONANCE BREAKER verified BGM'
          git push origin HEAD:asset/re-sonance-breaker-bgm-20261101

name: Validate TAROT BREAKER 2D

on:
  pull_request:
  push:
    branches:
      - main
      - feature/shion-official-sprite-player
      - feature/tarot-breaker-tap-to-move
      - feature/lumiere-gate-npc
      - feature/gate-garden-dialogue-events
      - feature/gate-garden-dynamic-layers

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check scene-effects.js
          node --check scene-layout.js
          node --check audio.js
          node --check lumiere-outline.js
          node --check dialogue.js
          node --check navigation.js
          node --check controls.js

      - name: Validate game assets and manifest
        run: |
          node scripts/validate.mjs
          node scripts/validate-audio.mjs

      - name: Test collision, navigation, input and game integration
        run: node --test tests/*.test.cjs

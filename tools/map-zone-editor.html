<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#071735" />
  <title>TAROT BREAKER — Map Zone Editor</title>
  <link rel="stylesheet" href="./map-zone-editor.css?v=1.0.0" />
</head>
<body>
  <main id="viewport" aria-label="TAROT BREAKER Map Zone Editor">
    <section id="world" aria-label="編集対象マップ">
      <div id="layer-host" aria-hidden="true"></div>
      <svg id="zone-overlay" aria-label="ゾーン編集レイヤー"></svg>
    </section>

    <div id="topbar">
      <select id="map-select" aria-label="編集するマップ"></select>
      <button id="fit-button" type="button">全体表示</button>
      <button id="zoom-out" type="button" aria-label="縮小">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" type="button" aria-label="拡大">＋</button>
    </div>

    <aside id="editor-panel" aria-label="マップゾーン編集パネル">
      <header id="editor-head">
        <div>
          <strong>MAP ZONE EDITOR</strong>
          <small id="map-label">読み込み中…</small>
        </div>
        <div class="head-actions">
          <span id="status">準備中</span>
          <button id="collapse-button" type="button" aria-expanded="true" aria-label="パネルを折りたたむ">−</button>
        </div>
      </header>

      <div id="editor-body">
        <div class="mode-row" role="group" aria-label="編集するゾーン種別">
          <button data-mode="walk" type="button" aria-pressed="true">歩行可能</button>
          <button data-mode="blocked" type="button" aria-pressed="false">通行不可</button>
          <button data-mode="behind" type="button" aria-pressed="false">背面通過</button>
        </div>

        <p id="mode-help">
          歩ける範囲を囲みます。タップで頂点追加、ドラッグでマップ移動、始点付近をタップで確定。
        </p>

        <div class="action-grid">
          <button id="undo-point" type="button">1点戻す</button>
          <button id="finish-area" type="button">範囲を確定</button>
          <button id="undo-area" type="button">1範囲戻す</button>
          <button id="delete-area" type="button">範囲を選択削除</button>
          <button id="clear-mode" type="button">この種別を全消去</button>
          <button id="restore-draft" type="button">下書き復元</button>
        </div>

        <details id="export-details">
          <summary>JSON出力</summary>
          <div class="action-grid export-grid">
            <button id="copy-collision" type="button">collision JSON</button>
            <button id="copy-depth" type="button">depth JSON</button>
            <button id="copy-all" type="button">全部コピー</button>
          </div>
          <small class="note">
            collision: 歩行可能＋通行不可 / depth: 背面通過。コピーしたJSONをGitHubの対応ファイルへ反映します。
          </small>
        </details>

        <details id="custom-details">
          <summary>カスタムマップ</summary>
          <div class="custom-grid">
            <label>map ID<input id="custom-map-id" type="text" placeholder="new-map" /></label>
            <label>画像URL<input id="custom-image" type="text" placeholder="../assets/maps/new-map/ground.webp" /></label>
            <label>幅<input id="custom-width" type="number" value="1448" /></label>
            <label>高さ<input id="custom-height" type="number" value="1086" /></label>
          </div>
          <button id="load-custom" class="wide-button" type="button">カスタム画像を読み込む</button>
        </details>

        <div class="legend">
          <span class="walk">歩行可能</span>
          <span class="blocked">通行不可</span>
          <span class="behind">背面通過</span>
          <span class="current">作成中</span>
        </div>
      </div>
    </aside>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="./map-zone-editor.js?v=1.0.0" defer></script>
</body>
</html>

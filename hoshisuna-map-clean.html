<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>TAROT BREAKER — 星砂マップ確認</title>
<link rel="stylesheet" href="./sky-atmosphere.css?v=1.0.0"><link rel="stylesheet" href="./cloud-motion-fix.css?v=1.7.0">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5458a6;touch-action:none}
#view{position:fixed;inset:0;overflow:hidden;touch-action:none}
#world{position:absolute;left:0;top:0;width:1448px;height:1086px;transform-origin:top left;isolation:isolate}
#world .scene-world-layer{position:absolute;inset:0;width:1448px;height:1086px}
.scene-farthest-sky{z-index:0!important}
.scene-star-sky{z-index:1!important}
.scene-cloud-main{z-index:2!important}
#road{position:absolute;inset:0;width:1448px;height:1086px;z-index:3;pointer-events:none}
#hint{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));padding:7px 10px;border-radius:8px;background:#061126ad;color:white;font:12px system-ui;pointer-events:none}
#error{display:none;position:fixed;inset:0;z-index:10;place-items:center;background:#090d20;color:white;font:16px system-ui}

#foreground-mask{position:absolute;inset:0;width:1448px;height:1086px;z-index:6;pointer-events:none}#actors{position:absolute;inset:0;z-index:5;pointer-events:none}
.actor{position:absolute;width:59px;height:78px;transform:translate(-50%,-93.75%);pointer-events:none}
#stick{position:fixed;z-index:8;width:144px;height:144px;margin:-72px 0 0 -72px;pointer-events:none}
#stick[hidden]{display:none}
#stick-ring{position:absolute;inset:0;border:1px solid #ffffff70;background:#0c102b33;border-radius:50%;backdrop-filter:blur(3px)}
#stick-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;border:1px solid #f4db9ec2;background:#ece1d357;box-shadow:0 0 18px #a3b8ff38}
#hint{display:none}body.debug #hint{display:block}body:not(.debug) #coord-panel,body:not(.debug) #coord-toggle,body:not(.debug) #coord-mark{display:none!important}
#coord-panel{position:fixed;z-index:20;right:8px;top:calc(8px + env(safe-area-inset-top));width:min(270px,calc(100vw - 16px));box-sizing:border-box;padding:10px;border-radius:12px;background:#101b36eb;color:white;font:12px/1.5 system-ui;box-shadow:0 3px 18px #0007;touch-action:auto}#coord-panel button{font:inherit;background:#304878;color:white;border:1px solid #a5bbdb;border-radius:7px;padding:7px;margin:3px 2px 0 0}#coord-panel button[aria-pressed=true]{background:#7155a6}#coord-panel input{width:60px;font:inherit;padding:5px;color:white;background:#253b61;border:1px solid #8099bc;border-radius:5px}#coord-panel[hidden]{display:none}#coord-mark{position:absolute;z-index:9;width:18px;height:18px;border:2px solid #ffde65;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 2px #20112577}#coord-mark[hidden]{display:none}#coord-toggle{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));right:12px;z-index:21;border:1px solid #a5bbdb;border-radius:9px;padding:9px;background:#152546e9;color:white;font:12px system-ui}#caritas{position:absolute;left:1013px;top:253px;z-index:4;width:125px;height:96px;object-fit:contain;transform:translate(-50%,-90%);pointer-events:none;user-select:none}</style></head><body>
<div id="view"><div id="world">
<div class="scene-world-layer scene-farthest-sky"><img src="./assets/maps/star-country-farthest-sky-background.webp" alt=""></div>
<div class="scene-world-layer scene-star-sky"><img src="./assets/maps/star-country-gate-garden-star-sky.webp" alt=""></div>
<div class="scene-world-layer scene-cloud-main"><div class="scene-cloud-main-track"><img class="scene-cloud-copy" src="./assets/maps/star-country-world-clouds.webp?asset=eaea4c9513cf" alt=""><img class="scene-cloud-copy" src="./assets/maps/star-country-world-clouds.webp?asset=eaea4c9513cf" alt=""><img class="scene-cloud-copy" src="./assets/maps/star-country-world-clouds.webp?asset=eaea4c9513cf" alt=""></div></div>
<img id="road" src="./assets/events/hoshisuna/map/starroad.webp" alt="星砂への街道">
<img id="caritas" src="./assets/events/hoshisuna/caritas/sg_rise_01.webp" alt="伏せて待つCaritas" draggable="false">
<div id="actors"><canvas class="actor" id="shion" width="118" height="156"></canvas><canvas class="actor" id="shiopon" width="118" height="156"></canvas></div>
<canvas id="foreground-mask" width="1448" height="1086"></canvas><div id="coord-mark" hidden></div></div></div><div id="stick" hidden><div id="stick-ring"></div><div id="stick-knob"></div></div>
<section id="coord-panel" aria-label="開始座標調整"><strong>星砂・座標確認</strong><div id="coord-now">シオン X:-- Y:--</div><div id="coord-picked">指定 X:-- Y:--</div><div><button id="coord-pick" aria-pressed="false">場所をタップで指定</button><button id="coord-apply">指定位置で開始</button></div><div><label>X <input id="coord-x" type="number" min="0" max="1448" step="1" value="108"></label><label>Y <input id="coord-y" type="number" min="0" max="1086" step="1" value="488"></label></div><div><button id="coord-copy">座標とURLをコピー</button><button id="coord-hide">閉じる</button></div><div id="coord-status">マップ上をタップして位置を測定できます。</div></section><button id="coord-toggle" hidden>座標パネル</button><div id="hint">星砂マップ｜移動・当たり判定検証（保存なし）</div><div id="error">マップの読み込みに失敗しました</div>
<script src="./scene-layout.js"></script>
<script src="./navigation.js?v=0.7.1"></script>
<script src="./controls.js?v=0.7.1"></script>
<script>
(()=>{'use strict';
const view=document.querySelector('#view'),world=document.querySelector('#world');
const W=1448,H=1086,road=document.querySelector('#road');
const foreground=document.querySelector('#foreground-mask'),foregroundCtx=foreground.getContext('2d');
let depthAreas=[];
// Reuse Garden's polygon hit-testing. Foreground masks never change walking permission.
function drawForegroundMask(){
 foregroundCtx.clearRect(0,0,W,H);
 if(!road.complete||!road.naturalWidth||!window.TarotSceneLayout)return;
 const active=depthAreas.filter(a=>[player,companion].some(actor=>window.TarotSceneLayout.contains({x:actor.x,y:actor.y},a)));
 if(!active.length)return;
 foregroundCtx.save();foregroundCtx.beginPath();
 for(const a of active){a.points.forEach(([x,y],i)=>i?foregroundCtx.lineTo(x,y):foregroundCtx.moveTo(x,y));foregroundCtx.closePath();}
 foregroundCtx.clip();foregroundCtx.drawImage(road,0,0,W,H);foregroundCtx.restore();
}
const caritas=document.querySelector('#caritas');
const caritasFrames=['./assets/events/hoshisuna/caritas/sg_rise_01.webp','./assets/events/hoshisuna/caritas/sg_rise_02.webp'];
caritasFrames.forEach(src=>{const preload=new Image();preload.src=src;});
let lastBlink=-1;
function updateCaritas(now){if(!caritas)return;const phase=now%5200;const frame=phase>4250&&phase<4510?1:0;if(frame!==lastBlink){lastBlink=frame;caritas.src=caritasFrames[frame];}}
const actors={shion:document.querySelector('#shion'),shiopon:document.querySelector('#shiopon')};
const dirOrder={down:0,up:1,left:2,right:3};
const sprites={};
for(const name of Object.keys(actors)){
 sprites[name]={};
 for(const [dir,src] of Object.entries({idle:name+'_idle.png',down:name+'_walk_down.png',up:name+'_walk_up.png',left:name+'_walk_left.png',right:name+'_walk_right.png'})){
  const im=new Image();im.src='./assets/sprites/'+name+'/'+src;sprites[name][dir]=im;
 }
}
// Start at the west-side starroad entrance shown in the acceptance screenshot.
const player={x:108,y:488,dir:'right',frame:0,moving:false,clock:0};
const companion={x:148,y:505,dir:'right',frame:0,moving:false,clock:0};
let collision=null,navigation=null,controls=null,zoom=1,camX=0,camY=0,last=0,followClock=0,followRoute=[],booted=false;
let footprints=[];const FOLLOW_LAG=56;const FOLLOW_SPEED=210;const FOLLOW_CATCHUP_SPEED=285;const FOLLOW_SPRINT_SPEED=360;const FOLLOW_STOP=3;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const panel=document.querySelector('#coord-panel'),mark=document.querySelector('#coord-mark');
const coordX=document.querySelector('#coord-x'),coordY=document.querySelector('#coord-y'),status=document.querySelector('#coord-status');
let pickMode=false,picked={x:108,y:488},pendingPick=null;
function showCoords(){document.querySelector('#coord-now').textContent='シオン X:'+Math.round(player.x)+' Y:'+Math.round(player.y);document.querySelector('#coord-picked').textContent='指定 X:'+picked.x+' Y:'+picked.y;}
function setPicked(p){picked={x:Math.round(clamp(p.x,0,W)),y:Math.round(clamp(p.y,0,H))};coordX.value=picked.x;coordY.value=picked.y;mark.style.left=picked.x+'px';mark.style.top=picked.y+'px';mark.hidden=false;showCoords();}
function placeAt(p){if(!collision){status.textContent='マップ読み込み中です';return;}
 const at=collision.isWalkable(p.x,p.y)?p:collision.nearestWalkable(p);
 if(!at){status.textContent='通行可能地点がありません';return;}if(!clearCaritas(at,at)){status.textContent='Caritasの身体には配置できません';return;}
 Object.assign(player,at,{moving:false,clock:0});
 try{resetFollower();}catch(e){status.textContent=e.message;return;}
 controls?.clearInput('coord-set');followRoute=[];followClock=0;camera();
 status.textContent=(at.x!==p.x||at.y!==p.y)?'通行外のため補正: X'+Math.round(at.x)+' Y'+Math.round(at.y):'指定位置へ移動しました';showCoords();
}
document.querySelector('#coord-pick').onclick=()=>{pickMode=!pickMode;document.querySelector('#coord-pick').setAttribute('aria-pressed',String(pickMode));status.textContent=pickMode?'パネルを閉じてマップの位置をタップしてください':'通常操作';if(pickMode){panel.hidden=true;document.querySelector('#coord-toggle').hidden=false;document.querySelector('#coord-toggle').textContent='座標指定中・パネル表示';}};
document.querySelector('#coord-apply').onclick=()=>{setPicked({x:Number(coordX.value),y:Number(coordY.value)});placeAt(picked);};
document.querySelector('#coord-copy').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('spawnX',String(picked.x));u.searchParams.set('spawnY',String(picked.y));const txt='星砂スタート X:'+picked.x+' Y:'+picked.y+'\n'+u.toString();try{await navigator.clipboard.writeText(txt);status.textContent='座標とURLをコピーしました';}catch(_){status.textContent=txt;}};
document.querySelector('#coord-hide').onclick=()=>{panel.hidden=true;document.querySelector('#coord-toggle').hidden=false;document.querySelector('#coord-toggle').textContent='座標パネル';};
document.querySelector('#coord-toggle').onclick=()=>{panel.hidden=false;document.querySelector('#coord-toggle').hidden=true;};

const ACTOR_COLLISION_DISTANCE=32,SHIOPON_FOLLOW_MIN_GAP=50;
// Sprite is anchored at (1013,253) with transform(-50%,-90%):
// its 125x96 rendered body spans roughly x=950..1076 and y=167..263.
// Use an expanded body capsule, not an ellipse around its FOOT at y=253.
const CARITAS={x:1013,y:253,width:125,height:96};
const CARITAS_BOUNDS={left:934,right:1092,top:150,bottom:272};
function separation(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function clearCaritas(from,to,radius=15){
 const left=CARITAS_BOUNDS.left-radius,right=CARITAS_BOUNDS.right+radius;
 const top=CARITAS_BOUNDS.top-radius,bottom=CARITAS_BOUNDS.bottom+radius;
 const dx=to.x-from.x,dy=to.y-from.y;
 let lo=0,hi=1;
 for(const [p,q] of [[-dx,from.x-left],[dx,right-from.x],[-dy,from.y-top],[dy,bottom-from.y]]){
   if(Math.abs(p)<1e-10){if(q<0)return true;continue;}
   const t=q/p;
   if(p<0){if(t>hi)return true;lo=Math.max(lo,t);}
   else{if(t<lo)return true;hi=Math.min(hi,t);}
 }
 return lo>hi;
}
function npcClear(from,to){return clearCaritas(from,to)&&collision.segmentClear(from,to);}
function resetFollower(){
  // Match main's desired rear offset; never put Shiopon ahead at startup.
  const behind={up:[0,1],down:[0,-1],left:[1,0],right:[-1,0]}[player.dir]||[-1,0];
  let safe=null;
  for(const gap of [FOLLOW_LAG,FOLLOW_LAG+8,FOLLOW_LAG-8]){
    const candidate={x:player.x+behind[0]*gap,y:player.y+behind[1]*gap};
    if(collision.isWalkable(candidate.x,candidate.y)&&npcClear(candidate,player)&&separation(candidate,player)>=44){safe=candidate;break;}
  }
  if(!safe)throw Error('しおぽんの後方配置地点がありません');
  Object.assign(companion,safe,{moving:false,clock:0,dir:player.dir});
  footprints=[{x:safe.x,y:safe.y},{x:player.x,y:player.y}];
}
// An arc-length position on Shion's actual walked route, rather than
// a new pathfinding destination which might cut corners or jump around.
function trailingPoint(trail,gap){
  if(!trail.length)return null;
  let remaining=gap;
  for(let i=trail.length-1;i>0;i--){
    const newer=trail[i],older=trail[i-1],length=Math.hypot(newer.x-older.x,newer.y-older.y);
    if(length>=remaining){
      const t=length?remaining/length:0;
      return {x:newer.x+(older.x-newer.x)*t,y:newer.y+(older.y-newer.y)*t};
    }
    remaining-=length;
  }
  return {...trail[0]};
}
function trimFootprints(trail,maxDistance=FOLLOW_LAG+120){
  let distance=0;
  for(let i=trail.length-1;i>0;i--){
    distance+=Math.hypot(trail[i].x-trail[i-1].x,trail[i].y-trail[i-1].y);
    if(distance>maxDistance){if(i>1)trail.splice(0,i-1);return;}
  }
}
function movingIntoActor(from,to,other,threshold=ACTOR_COLLISION_DISTANCE){const before=Math.hypot(from.x-other.x,from.y-other.y),after=Math.hypot(to.x-other.x,to.y-other.y);return after<threshold&&after<before-1e-6;}
function face(actor,dx,dy){if(Math.abs(dx)+Math.abs(dy)<.00001)return;actor.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}
function frameActor(actor,key,dt){
 const canvas=actors[key],ctx=canvas.getContext('2d'),sheet=sprites[key][actor.moving?actor.dir:'idle'];
 actor.clock=actor.moving?actor.clock+dt:0;
 actor.frame=actor.moving?Math.floor(actor.clock*8)%4:dirOrder[actor.dir];
 ctx.clearRect(0,0,118,156);
 if(sheet.complete&&sheet.naturalWidth>=384*(actor.frame+1)){
 ctx.imageSmoothingEnabled=true;ctx.drawImage(sheet,384*actor.frame,0,384,512,0,0,118,156);
 }
 canvas.style.left=actor.x+'px';canvas.style.top=actor.y+'px';
 // Same as main draw ordering: Shiopon is behind Shion while following.
 canvas.style.zIndex=key==='shiopon'?'1':'2';
}
function camera(){
 const vw=view.clientWidth/zoom,vh=view.clientHeight/zoom;
 camX=clamp(player.x-vw/2,0,Math.max(0,W-vw));camY=clamp(player.y-58-vh/2,0,Math.max(0,H-vh));
 world.style.transform='translate3d('+(-camX*zoom)+'px,'+(-camY*zoom)+'px,0) scale('+zoom+')';
}
function resize(){zoom=clamp(Math.min(view.clientWidth/620,view.clientHeight/560),1,1.22);camera();}
function point(e){const r=view.getBoundingClientRect();return {id:e.pointerId,x:e.clientX-r.left,y:e.clientY-r.top,time:performance.now(),width:r.width,world:{x:camX+(e.clientX-r.left)/zoom,y:camY+(e.clientY-r.top)/zoom},primary:e.isPrimary,button:e.button};}
function stick(){
 const el=document.querySelector('#stick'),knob=document.querySelector('#stick-knob'),s=controls?.state.stick;
 el.hidden=!s?.active;if(s?.active){el.style.left=s.ox+'px';el.style.top=s.oy+'px';knob.style.transform='translate('+s.knobX+'px,'+s.knobY+'px)';}
}
view.addEventListener('pointerdown',e=>{if(pickMode){const p=point(e).world;pendingPick={id:e.pointerId,x:e.clientX,y:e.clientY,p};e.preventDefault();return;}if(!controls)return;if(controls.pointerDown(point(e))){view.setPointerCapture?.(e.pointerId);e.preventDefault();}});
view.addEventListener('pointermove',e=>{if(pendingPick){if(Math.hypot(e.clientX-pendingPick.x,e.clientY-pendingPick.y)>14)pendingPick=null;return;}controls?.pointerMove(point(e));stick();});
for(const type of ['pointerup','pointercancel'])view.addEventListener(type,e=>{if(pickMode){if(type==='pointerup'&&pendingPick?.id===e.pointerId){setPicked(pendingPick.p);pickMode=false;document.querySelector('#coord-pick').setAttribute('aria-pressed','false');panel.hidden=false;document.querySelector('#coord-toggle').hidden=true;status.textContent='座標 X:'+picked.x+' Y:'+picked.y+'。開始する場合は「指定位置で開始」';}pendingPick=null;return;}if(!controls)return;const p=point(e);controls.pointerEnd({...p,cancelled:type==='pointercancel'},player);stick();});
window.addEventListener('keydown',e=>{if(controls?.keyDown(e.key))e.preventDefault();});
window.addEventListener('keyup',e=>controls?.keyUp(e.key));
window.addEventListener('blur',()=>{controls?.clearInput('blur');stick()});
function step(t){
 const dt=Math.min((t-(last||t))/1000,.05);last=t;
 if(controls){
  const next=controls.step(player,dt,155);
  const dx=next.x-player.x,dy=next.y-player.y;
  // No instant relocation: a follower can never appear at an old footprint.
  // Collision is symmetric, including Caritas and Shiopon.
  const allowed=npcClear(player,next)&&separation(next,companion)>=ACTOR_COLLISION_DISTANCE;
  if(!allowed){controls.cancel('npc-collision');player.moving=false;}
  else{player.moving=next.moving;face(player,dx,dy);player.x=next.x;player.y=next.y;}
  const lastFoot=footprints[footprints.length-1];
  if(!lastFoot||separation(player,lastFoot)>.01){
    footprints.push({x:player.x,y:player.y});
    trimFootprints(footprints);
  }
  // Follow the same physical path as Shion, 56px behind, with bounded speed.
  const target=trailingPoint(footprints,FOLLOW_LAG);
  companion.moving=false;
  if(target){
    const distance=separation(companion,target);
    if(distance>FOLLOW_STOP){
      const playerGap=separation(companion,player);
      const speed=playerGap>170?FOLLOW_SPRINT_SPEED:playerGap>95?FOLLOW_CATCHUP_SPEED:FOLLOW_SPEED;
      const amount=Math.min(distance,speed*dt);
      const candidate={x:companion.x+(target.x-companion.x)*amount/distance,
                       y:companion.y+(target.y-companion.y)*amount/distance};
      if(npcClear(companion,candidate)&&separation(candidate,player)>=ACTOR_COLLISION_DISTANCE){
        face(companion,candidate.x-companion.x,candidate.y-companion.y);
        companion.x=candidate.x;companion.y=candidate.y;companion.moving=true;
      }
    }
  }
 }
 camera();showCoords();updateCaritas(t);frameActor(player,'shion',dt);frameActor(companion,'shiopon',dt);drawForegroundMask();
 requestAnimationFrame(step);
}
async function boot(){
 try{
  const r=await fetch('./assets/events/hoshisuna/map/starroad-collision.json',{cache:'no-store'});
  if(!r.ok)throw Error('当たり判定JSONが取得できません');
  const data=await r.json();depthAreas=(Array.isArray(data.behindForegroundAreas)?data.behindForegroundAreas:[]).filter(a=>a.type==='poly'&&Array.isArray(a.points)&&a.points.length>=3);if(!window.TarotSceneLayout)throw Error('mainの前景判定が未読込');if(!window.TarotNavigation||!window.TarotControls)throw Error('mainの操作モジュールが未読込');
  collision=window.TarotNavigation.createCollision(data);
  navigation=window.TarotNavigation.createNavigator(collision,16);
  const safe=collision.nearestWalkable(player);if(!safe||!clearCaritas(safe,safe))throw Error('歩行開始位置がありません');Object.assign(player,safe);
  resetFollower();
  controls=window.TarotControls.createControls(collision,navigation);
  document.body.classList.toggle('debug',new URLSearchParams(location.search).get('debug')==='1');
  const urlParams=new URLSearchParams(location.search);if(urlParams.has('spawnX')&&urlParams.has('spawnY')){const p={x:Number(urlParams.get('spawnX')),y:Number(urlParams.get('spawnY'))};if(Number.isFinite(p.x)&&Number.isFinite(p.y)){setPicked(p);placeAt(p);}}else{setPicked({x:player.x,y:player.y});}resize();booted=true;requestAnimationFrame(step);
 }catch(e){document.querySelector('#error').textContent='読み込み失敗: '+e.message;document.querySelector('#error').style.display='grid';}
}
window.addEventListener('resize',resize);road.addEventListener('error',()=>{document.querySelector('#error').style.display='grid'});
boot();
})();
</script></body></html>

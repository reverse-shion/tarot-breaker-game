<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e101e">
  <title>星砂の道・カリタス戦 | TAROT BREAKER</title>
  <link rel="stylesheet" href="./caritas-first-turn-preview.css">
  <script src="./caritas-first-turn-preview.js" defer></script>
</head>
<body>
  <main class="battle" id="battle">
    <header class="battle-header">
      <h1>星砂の道・カリタス戦</h1>
      <button class="reset" id="reset" type="button">最初から</button>
    </header>
    <dl class="gauges">
      <div class="gauge darkness">
        <dt>闇侵蝕 <span id="mood"></span></dt>
        <dd><output id="dark">84%</output><meter aria-label="闇侵蝕" id="dark-meter" min="0" max="100" value="84"></meter></dd>
      </div>
      <div class="gauge maintenance">
        <dt>維持力</dt>
        <dd><output id="maintenance">100</output><meter aria-label="維持力" id="maintenance-meter" min="0" max="100" value="100"></meter></dd>
      </div>
      <div class="gauge resonance">
        <dt>共鳴</dt>
        <dd><output id="resonance">0</output><meter aria-label="共鳴" id="resonance-meter" min="0" max="100" value="0"></meter></dd>
      </div>
    </dl>
    <div class="arena" id="arena" data-light="none" data-approach="home" data-pose="guarded">
      <div class="abyss" aria-hidden="true"></div>
      <div class="actor caritas">
        <img id="caritas" alt="カリタス" src="./assets/battle/caritas/caritas-03_guarded.webp">
        <span class="abyss-face" aria-hidden="true"></span>
      </div>
      <div class="actor shioriel">
        <img src="./assets/battle/character/shioriel.webp" alt="シオリエル">
        <span class="wing wing-left" aria-hidden="true"></span>
        <span class="wing wing-right" aria-hidden="true"></span>
      </div>
      <div class="actor shion">
        <img src="./assets/battle/character/shion.webp" alt="シオン">
        <span class="reading-light" aria-hidden="true"></span>
        <img class="hand-card" src="./assets/tarot/major/08-strength.webp" alt="">
      </div>
    </div>
    <section class="commands" aria-labelledby="phase-title">
      <div class="phase" id="phase">
        <img id="phase-card" class="phase-card" alt="">
        <div>
          <h2 id="phase-title" tabindex="-1"></h2>
          <p id="selection" class="selection"></p>
        </div>
      </div>
      <div class="dialogue" aria-live="polite" aria-atomic="true">
        <p id="speaker" class="speaker"></p>
        <p id="line" class="line"></p>
        <p id="clue" class="clue"></p>
      </div>
      <div class="choices" id="choices"></div>
      <form id="writing" hidden>
        <label for="message">シオンの言葉</label>
        <textarea id="message" name="message" rows="2" aria-describedby="writing-hint"></textarea>
        <p class="writing-hint" id="writing-hint">4文字以上・異なる文字が2種類以上・700文字以内</p>
        <div class="choices">
          <button type="button" id="cancel-writing">言葉を選び直す</button>
          <button type="submit" id="send-writing">届ける</button>
        </div>
      </form>
      <p class="epilogue" id="epilogue" hidden></p>
    </section>
  </main>
</body>
</html>

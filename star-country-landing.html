<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#071735" />
  <title>TAROT BREAKER — 星門庭園 離着陸場</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071735;
    }
    body {
      touch-action: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #071735;
    }
    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 1448px;
      height: 1086px;
      transform-origin: 0 0;
      overflow: hidden;
      isolation: isolate;
      background: #0a2858;
    }
    .sky {
      position: absolute;
      inset: 0;
      width: 1448px;
      height: 1086px;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .cloud-layer {
      position: absolute;
      left: -160px;
      top: 350px;
      width: 1768px;
      height: 520px;
      z-index: 1;
      opacity: .46;
      overflow: hidden;
      pointer-events: none;
    }
    .cloud-track {
      display: flex;
      width: 3536px;
      height: 100%;
      animation: clouds 52s linear infinite;
    }
    .cloud-track img {
      width: 1768px;
      height: 520px;
      object-fit: cover;
      opacity: .86;
    }
    @keyframes clouds {
      from { transform: translateX(0); }
      to { transform: translateX(-1768px); }
    }
    .garden-preview {
      position: absolute;
      left: 50%;
      top: -286px;
      z-index: 3;
      width: 1260px;
      height: auto;
      transform: translateX(-50%);
      opacity: .77;
      filter: drop-shadow(0 28px 55px rgba(0,0,0,.24));
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .approach-haze {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(175,223,255,.12), transparent 28%),
        radial-gradient(ellipse at 50% 26%, rgba(206,239,255,.15), transparent 35%),
        linear-gradient(to bottom, transparent 56%, rgba(7,21,50,.18));
    }
    .dock {
      position: absolute;
      left: 50%;
      top: 170px;
      z-index: 8;
      width: 430px;
      height: 880px;
      transform: translateX(-50%);
      clip-path: polygon(30% 0,70% 0,93% 100%,7% 100%);
      background:
        linear-gradient(90deg, rgba(117,180,232,.12), transparent 14%, transparent 86%, rgba(117,180,232,.12)),
        linear-gradient(to bottom, rgba(219,239,255,.26), rgba(79,116,176,.13) 50%, rgba(32,62,111,.30));
      border-top: 2px solid rgba(228,244,255,.48);
      filter: drop-shadow(0 18px 42px rgba(0,0,0,.18));
      pointer-events: none;
    }
    .dock::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 16px;
      width: 3px;
      height: 840px;
      transform: translateX(-50%);
      background: linear-gradient(to bottom, rgba(184,225,255,.62), rgba(115,180,245,.10));
      box-shadow: 0 0 18px rgba(119,196,255,.30);
    }
    .dock::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 30px;
      width: 310px;
      height: 115px;
      transform: translateX(-50%);
      border: 2px solid rgba(177,223,255,.36);
      border-radius: 50%;
      box-shadow: inset 0 0 24px rgba(104,190,255,.12), 0 0 26px rgba(106,190,255,.12);
    }
    .gate-direction {
      position: absolute;
      left: 50%;
      top: 190px;
      z-index: 12;
      transform: translateX(-50%);
      color: rgba(235,247,255,.88);
      font-size: 13px;
      letter-spacing: .12em;
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
      pointer-events: none;
    }
    .landing-pad {
      position: absolute;
      z-index: 20;
      left: 724px;
      top: 900px;
      width: 140px;
      height: 140px;
      transform: translate(-50%,-50%);
      object-fit: contain;
      filter:
        brightness(1.18)
        drop-shadow(0 0 15px rgba(120,219,255,.58))
        drop-shadow(0 0 28px rgba(91,151,255,.28));
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .landing-glow {
      position: absolute;
      z-index: 19;
      left: 724px;
      top: 900px;
      width: 84px;
      height: 36px;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(150,232,255,.55), rgba(91,160,255,.15) 52%, transparent 74%);
      filter: blur(8px);
      pointer-events: none;
    }
    .landing-beam {
      position: absolute;
      z-index: 18;
      left: 724px;
      top: 900px;
      width: 110px;
      height: 190px;
      transform: translate(-50%,0);
      border-radius: 50%;
      opacity: .82;
      background: linear-gradient(to bottom, rgba(151,228,255,.35), rgba(101,151,255,.08), transparent);
      filter: blur(12px);
      pointer-events: none;
      transition: opacity .7s ease;
    }
    body.arrived .landing-beam { opacity: .12; }

    .shion-shadow {
      position: absolute;
      z-index: 42;
      width: 34px;
      height: 11px;
      transform: translate(-50%,-50%) scale(var(--actor-inverse-scale,1));
      transform-origin: 50% 50%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(2,7,20,.48), rgba(2,7,20,.14) 58%, transparent 76%);
      pointer-events: none;
    }
    .shion-actor {
      position: absolute;
      z-index: 44;
      width: 58.5px;
      height: 78px;
      transform: translate(-50%,-100%) scale(var(--actor-inverse-scale,1));
      transform-origin: 50% 100%;
      background-image: url("./assets/sprites/shion/shion_idle.png");
      background-repeat: no-repeat;
      background-size: 234px 78px;
      background-position: -58.5px 0;
      image-rendering: pixelated;
      filter: drop-shadow(0 2px 2px rgba(3,7,22,.46));
      pointer-events: none;
    }
    .move-target {
      position: absolute;
      z-index: 41;
      width: 24px;
      height: 12px;
      transform: translate(-50%,-50%) scale(var(--actor-inverse-scale,1));
      transform-origin: 50% 50%;
      border: 1.5px solid rgba(214,239,255,.86);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(112,198,255,.28);
      opacity: 0;
      pointer-events: none;
    }
    .move-target.active { opacity: .8; }
    #guide,
    #arrival-status {
      position: fixed;
      left: 50%;
      z-index: 300;
      transform: translateX(-50%);
      padding: 8px 13px;
      border: 1px solid rgba(195,225,255,.24);
      border-radius: 999px;
      color: rgba(255,255,255,.96);
      background: rgba(5,13,35,.64);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 12px;
      pointer-events: none;
    }
    #guide {
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 18px));
    }
    #arrival-status {
      top: max(16px, calc(env(safe-area-inset-top) + 12px));
      font-weight: 750;
    }
    body.arrived #arrival-status { opacity: 0; transition: opacity .5s ease; }
    #joystick {
      position: fixed;
      z-index: 330;
      width: 92px;
      height: 92px;
      transform: translate(-50%,-50%);
      pointer-events: none;
    }
    #joystick[hidden] { display: none; }
    .joy-ring {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(211,235,255,.36);
      border-radius: 50%;
      background: rgba(8,22,52,.22);
    }
    #joy-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38px;
      height: 38px;
      margin: -19px 0 0 -19px;
      border: 1px solid rgba(230,243,255,.52);
      border-radius: 50%;
      background: rgba(147,204,255,.43);
    }
    #fade {
      position: fixed;
      inset: 0;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(to top, rgba(233,249,255,.98), rgba(95,159,225,.38), rgba(4,14,36,.08));
      transition: opacity .75s ease;
    }
    body.leaving #fade { opacity: 1; }

    /* Devil card memory flash — one-time story event before the gate */
    #devil-memory {
      position: fixed;
      inset: 0;
      z-index: 1500;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      background: rgba(2,6,18,.12);
      transition: opacity .12s ease;
    }
    #devil-memory.flash { opacity: 1; }
    #devil-memory-card {
      width: min(38vw, 220px);
      max-height: 58vh;
      object-fit: contain;
      opacity: .88;
      filter: drop-shadow(0 0 24px rgba(8,10,28,.78));
    }
    #landing-dialogue {
      position: fixed;
      left: 50%;
      bottom: max(28px, calc(env(safe-area-inset-bottom) + 22px));
      z-index: 1600;
      width: min(88vw, 680px);
      transform: translateX(-50%);
      padding: 14px 18px 16px;
      border: 1px solid rgba(218,232,255,.38);
      border-radius: 10px;
      color: #fff;
      background: rgba(5,13,35,.88);
      box-shadow: 0 12px 36px rgba(0,0,0,.32);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: clamp(15px, 2.8vw, 19px);
      line-height: 1.65;
      letter-spacing: .02em;
    }
    #landing-dialogue[hidden] { display: none; }
    #landing-dialogue-name {
      margin-bottom: 4px;
      color: rgba(224,237,255,.78);
      font-size: .78em;
      font-weight: 700;
      letter-spacing: .12em;
    }
    #landing-dialogue-text { min-height: 1.65em; }
    @media (prefers-reduced-motion: reduce) {
      .cloud-track { animation: none; }
    }
  </style>
</head>
<body>
  <main id="viewport" aria-label="星門庭園 離着陸場">
    <section id="world">
      <img class="sky" src="./assets/maps/star-country-farthest-sky-background.webp" alt="" aria-hidden="true" draggable="false" />
      <div class="cloud-layer" aria-hidden="true">
        <div class="cloud-track">
          <img src="./assets/maps/star-country-world-clouds.webp" alt="" draggable="false" />
          <img src="./assets/maps/star-country-world-clouds.webp" alt="" draggable="false" />
        </div>
      </div>
      <img class="garden-preview" src="./assets/maps/star-country-gate-garden-transparent.webp?v=landing-v1" alt="" aria-hidden="true" draggable="false" />
      <div class="approach-haze" aria-hidden="true"></div>
      <div class="dock" aria-hidden="true"></div>
      <div class="gate-direction" aria-hidden="true">STAR GATE GARDEN ↑</div>

      <div class="landing-beam" aria-hidden="true"></div>
      <div class="landing-glow" aria-hidden="true"></div>
      <img class="landing-pad" src="./assets/maps/alenon/pad.webp" alt="" aria-hidden="true" draggable="false" />

      <div class="move-target" aria-hidden="true"></div>
      <div class="shion-shadow" aria-hidden="true"></div>
      <div class="shion-actor" role="img" aria-label="シオン"></div>
    </section>

    <div id="arrival-status" role="status">PAD着陸中…</div>
    <div id="guide">星門庭園へ向かう</div>
    <div id="joystick" hidden aria-hidden="true">
      <div class="joy-ring"></div>
      <div id="joy-knob"></div>
    </div>
    <div id="devil-memory" aria-hidden="true">
      <img id="devil-memory-card" src="./assets/cards/15-the-devil.webp" alt="" draggable="false" />
    </div>
    <div id="landing-dialogue" hidden role="dialog" aria-live="polite">
      <div id="landing-dialogue-name">シオン</div>
      <div id="landing-dialogue-text"></div>
    </div>
    <div id="fade" aria-hidden="true"></div>
  </main>

  <script>
    (() => {
      "use strict";

      const WORLD_W = 1448;
      const WORLD_H = 1086;
      const SPEED_SCREEN = 155;
      const SPAWN = { x: 724, y: 900 };
      const EXIT_Y = 250;
      const WALK_X_MIN = 500;
      const WALK_X_MAX = 948;
      const WALK_Y_MIN = 205;
      const WALK_Y_MAX = 970;

      const viewport = document.getElementById("viewport");
      const world = document.getElementById("world");
      const actor = document.querySelector(".shion-actor");
      const shadow = document.querySelector(".shion-shadow");
      const targetRing = document.querySelector(".move-target");
      const pad = document.querySelector(".landing-pad");
      const padGlow = document.querySelector(".landing-glow");
      const beam = document.querySelector(".landing-beam");
      const guide = document.getElementById("guide");
      const status = document.getElementById("arrival-status");
      const joystick = document.getElementById("joystick");
      const devilMemory = document.getElementById("devil-memory");
      const landingDialogue = document.getElementById("landing-dialogue");
      const landingDialogueText = document.getElementById("landing-dialogue-text");
      const knob = document.getElementById("joy-knob");

      let worldScale = 1;
      let cameraTx = 0;
      let cameraTy = 0;
      let arrived = false;
      let leaving = false;
      let arrivalAge = 0;
      let devilEventStarted = false;
      let devilEventActive = false;
      const DEVIL_EVENT_Y = 390;

      const wait = (ms) => new Promise(resolve => window.setTimeout(resolve, ms));

      async function flashDevil() {
        devilMemory.classList.add("flash");
        await wait(150);
        devilMemory.classList.remove("flash");
        await wait(200);
        devilMemory.classList.add("flash");
        await wait(100);
        devilMemory.classList.remove("flash");
      }

      async function showLandingLine(text, ms = 1500) {
        landingDialogueText.textContent = text;
        landingDialogue.hidden = false;
        await wait(ms);
      }

      async function runDevilMemoryEvent() {
        if (devilEventStarted || leaving) return;
        devilEventStarted = true;
        devilEventActive = true;
        player.target = null;
        player.moving = false;
        targetRing.classList.remove("active");
        guide.hidden = true;
        keys.clear();

        await flashDevil();
        await showLandingLine("……くっ、あのカードが頭から離れない", 1800);
        await wait(350);
        await showLandingLine("何かを伝えようとしてる……？", 1700);
        await showLandingLine("それとも――", 1250);

        player.dir = "up";
        setActorVisual();
        await wait(650);

        await showLandingLine("……いや。考えるのは後だ。", 1550);
        await showLandingLine("今は……星門が先だ", 1550);
        landingDialogue.hidden = true;
        devilEventActive = false;
      }

      const player = {
        x: SPAWN.x,
        y: SPAWN.y,
        dir: "up",
        moving: false,
        frame: 0,
        anim: 0,
        target: null,
      };

      const idleFrame = { down: 0, up: 1, left: 2, right: 3 };
      const walkSheet = {
        down: "./assets/sprites/shion/shion_walk_down.png",
        up: "./assets/sprites/shion/shion_walk_up.png",
        left: "./assets/sprites/shion/shion_walk_left.png",
        right: "./assets/sprites/shion/shion_walk_right.png",
      };

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

      function fitWorld() {
        worldScale = Math.max(1, innerWidth / WORLD_W, innerHeight / WORLD_H);
        world.style.setProperty("--actor-inverse-scale", String(1 / worldScale));
        syncCamera();
      }

      function syncCamera() {
        const halfW = innerWidth / (2 * worldScale);
        const halfH = innerHeight / (2 * worldScale);
        const minX = Math.min(halfW, WORLD_W / 2);
        const maxX = Math.max(minX, WORLD_W - halfW);
        const minY = Math.min(halfH, WORLD_H / 2);
        const maxY = Math.max(minY, WORLD_H - halfH);
        const focusX = clamp(player.x, minX, maxX);
        const focusY = clamp(player.y - 85, minY, maxY);
        cameraTx = innerWidth / 2 - focusX * worldScale;
        cameraTy = innerHeight / 2 - focusY * worldScale;
        world.style.transform = `translate3d(${cameraTx}px,${cameraTy}px,0) scale(${worldScale})`;
      }

      function setActorPosition() {
        actor.style.left = player.x + "px";
        actor.style.top = player.y + "px";
        shadow.style.left = player.x + "px";
        shadow.style.top = player.y + "px";
      }

      function setActorVisual() {
        if (player.moving) {
          actor.style.backgroundImage = `url("${walkSheet[player.dir]}")`;
          actor.style.backgroundPosition = `${-58.5 * player.frame}px 0`;
        } else {
          actor.style.backgroundImage = 'url("./assets/sprites/shion/shion_idle.png")';
          actor.style.backgroundPosition = `${-58.5 * idleFrame[player.dir]}px 0`;
        }
      }

      function direction(dx, dy) {
        if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? "left" : "right";
        return dy < 0 ? "up" : "down";
      }

      function screenToWorld(x, y) {
        return { x: (x - cameraTx) / worldScale, y: (y - cameraTy) / worldScale };
      }

      function setTarget(clientX, clientY) {
        if (!arrived || leaving || devilEventActive) return;
        const point = screenToWorld(clientX, clientY);
        point.x = clamp(point.x, WALK_X_MIN, WALK_X_MAX);
        point.y = clamp(point.y, WALK_Y_MIN, WALK_Y_MAX);
        player.target = point;
        targetRing.style.left = point.x + "px";
        targetRing.style.top = point.y + "px";
        targetRing.classList.add("active");
        guide.hidden = true;
      }

      function leaveForGarden() {
        if (leaving) return;
        leaving = true;
        player.target = null;
        targetRing.classList.remove("active");
        document.body.classList.add("leaving");
        status.textContent = "星門庭園へ…";
        status.style.opacity = "1";
        window.setTimeout(() => {
          location.href = "./index.html?from=landing&v=pad-route-v1";
        }, 780);
      }

      const keys = new Set();
      const stick = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
      const RADIUS = 42;
      let pointer = null;

      function updateStick(x, y) {
        const dx = x - stick.ox;
        const dy = y - stick.oy;
        const len = Math.hypot(dx, dy);
        const ratio = len > RADIUS ? RADIUS / len : 1;
        const kx = dx * ratio;
        const ky = dy * ratio;
        stick.x = kx / RADIUS;
        stick.y = ky / RADIUS;
        knob.style.transform = `translate(${kx}px,${ky}px)`;
      }

      viewport.addEventListener("pointerdown", (event) => {
        if (!arrived || leaving || devilEventActive) return;
        if (event.button != null && event.button !== 0) return;
        event.preventDefault();
        pointer = { id:event.pointerId, x:event.clientX, y:event.clientY, time:performance.now() };
        viewport.setPointerCapture?.(event.pointerId);
      }, { passive:false });

      viewport.addEventListener("pointermove", (event) => {
        if (!pointer || pointer.id !== event.pointerId) return;
        event.preventDefault();
        if (stick.active) {
          updateStick(event.clientX, event.clientY);
          return;
        }
        const dist = Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y);
        if (dist >= 12) {
          stick.active = true;
          stick.id = event.pointerId;
          stick.ox = pointer.x;
          stick.oy = pointer.y;
          player.target = null;
          targetRing.classList.remove("active");
          joystick.hidden = false;
          joystick.style.left = stick.ox + "px";
          joystick.style.top = stick.oy + "px";
          updateStick(event.clientX, event.clientY);
          guide.hidden = true;
        }
      }, { passive:false });

      function endPointer(event) {
        if (!pointer || pointer.id !== event.pointerId) return;
        event.preventDefault();
        const wasStick = stick.active;
        const elapsed = performance.now() - pointer.time;
        const dist = Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y);
        if (wasStick) {
          stick.active = false;
          stick.id = null;
          stick.x = 0;
          stick.y = 0;
          joystick.hidden = true;
          knob.style.transform = "translate(0,0)";
        } else if (elapsed < 650 && dist < 12) {
          setTarget(event.clientX, event.clientY);
        }
        if (viewport.hasPointerCapture?.(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
        pointer = null;
      }

      viewport.addEventListener("pointerup", endPointer, { passive:false });
      viewport.addEventListener("pointercancel", endPointer, { passive:false });

      addEventListener("keydown", (event) => {
        if (!arrived || leaving || devilEventActive) return;
        const key = event.key.toLowerCase();
        if (["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(key)) {
          keys.add(key);
          player.target = null;
          targetRing.classList.remove("active");
          guide.hidden = true;
          event.preventDefault();
        }
      }, { passive:false });
      addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));

      function keyVector() {
        let x = 0, y = 0;
        if (keys.has("arrowleft") || keys.has("a")) x -= 1;
        if (keys.has("arrowright") || keys.has("d")) x += 1;
        if (keys.has("arrowup") || keys.has("w")) y -= 1;
        if (keys.has("arrowdown") || keys.has("s")) y += 1;
        const len = Math.hypot(x, y);
        return len ? { x:x/len, y:y/len } : { x:0, y:0 };
      }

      let last = performance.now();
      function loop(now) {
        const dt = Math.min((now - last) / 1000, .05);
        last = now;

        if (!arrived) {
          arrivalAge += dt;
          const t = Math.min(1, arrivalAge / 1.25);
          const eased = 1 - Math.pow(1 - t, 3);
          const y = 820 + (900 - 820) * eased;
          pad.style.top = y + "px";
          padGlow.style.top = y + "px";
          beam.style.top = y + "px";
          player.x = 724;
          player.y = y - 2;
          player.dir = "up";
          player.moving = false;
          if (t >= 1) {
            arrived = true;
            document.body.classList.add("arrived");
            status.textContent = "着陸完了";
            guide.hidden = false;
          }
          setActorPosition();
          setActorVisual();
          syncCamera();
          requestAnimationFrame(loop);
          return;
        }

        if (!devilEventStarted && player.y <= DEVIL_EVENT_Y) {
          runDevilMemoryEvent();
        }

        if (devilEventActive) {
          player.moving = false;
          setActorPosition();
          setActorVisual();
          syncCamera();
          requestAnimationFrame(loop);
          return;
        }

        const keyboard = keyVector();
        let vx = keyboard.x;
        let vy = keyboard.y;
        let manual = Math.hypot(vx,vy) > .01;

        if (!manual && stick.active) {
          vx = stick.x;
          vy = stick.y;
          manual = Math.hypot(vx,vy) > .08;
        }

        if (!manual && player.target) {
          const dx = player.target.x - player.x;
          const dy = player.target.y - player.y;
          const dist = Math.hypot(dx,dy);
          if (dist <= 3.5) {
            player.x = player.target.x;
            player.y = player.target.y;
            player.target = null;
            targetRing.classList.remove("active");
          } else {
            vx = dx / dist;
            vy = dy / dist;
          }
        }

        const moving = !leaving && (manual || !!player.target) && Math.hypot(vx,vy) > .001;
        if (moving) {
          player.dir = direction(vx,vy);
          const speed = SPEED_SCREEN / worldScale;
          player.x = clamp(player.x + vx * speed * dt, WALK_X_MIN, WALK_X_MAX);
          player.y = clamp(player.y + vy * speed * dt, WALK_Y_MIN, WALK_Y_MAX);
          player.anim += dt * 8.5;
          player.frame = Math.floor(player.anim) % 4;
          player.moving = true;
        } else {
          player.moving = false;
          player.anim = 0;
          player.frame = 0;
        }

        if (player.y <= EXIT_Y) leaveForGarden();

        setActorPosition();
        setActorVisual();
        syncCamera();
        requestAnimationFrame(loop);
      }

      fitWorld();
      setActorPosition();
      setActorVisual();
      addEventListener("resize", fitWorld, { passive:true });
      addEventListener("orientationchange", fitWorld, { passive:true });
      requestAnimationFrame((now) => { last = now; loop(now); });
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#071735" />
  <title>TAROT BREAKER — 星門庭園 PAD離着陸場</title>
  <link rel="stylesheet" href="./audio.css?v=20260919-main-sync-1" />
  <style>
    :root {
      --world-w: 1448;
      --world-h: 1086;
      --pad-x: 725px;
      --pad-y: 788px;
      --pad-size: 146px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071735;
    }

    body {
      touch-action: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #071735;
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 1448px;
      height: 1086px;
      transform-origin: 0 0;
      overflow: hidden;
      isolation: isolate;
      background: #0a2858;
    }

    .world-layer,
    .world-layer img {
      position: absolute;
      inset: 0;
      width: 1448px;
      height: 1086px;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .sky-farthest {
      z-index: 0;
      object-fit: cover;
    }

    .sky-stars {
      z-index: 1;
      object-fit: cover;
      opacity: .30;
      mix-blend-mode: screen;
    }

    .world-islands {
      z-index: 2;
      object-fit: cover;
      opacity: .94;
    }

    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 1448px;
      height: 1086px;
      overflow: hidden;
      pointer-events: none;
      opacity: .70;
    }

    .cloud-track {
      display: flex;
      width: 4344px;
      height: 1086px;
      will-change: transform;
      animation: starLandingClouds 58s linear infinite;
    }

    .cloud-track img {
      flex: 0 0 1448px;
      width: 1448px;
      height: 1086px;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes starLandingClouds {
      from { transform: translate3d(0,0,0); }
      to { transform: translate3d(-1448px,0,0); }
    }

    @keyframes pad-breathe {
      0%, 100% {
        opacity: .56;
        transform: translate(-50%, -50%) scale(.96);
      }
      50% {
        opacity: .90;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 15%, rgba(218,242,255,.13), transparent 34%),
        linear-gradient(to bottom, rgba(184,224,255,.08), transparent 30%, transparent 72%, rgba(9,25,59,.08));
    }


    .landing-ground {
      position: absolute;
      inset: 0;
      z-index: 10;
      width: 1448px;
      height: 1086px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 26px 40px rgba(0,0,0,.16));
    }

    .pad-glow {
      position: absolute;
      z-index: 19;
      left: var(--pad-x);
      top: var(--pad-y);
      width: calc(var(--pad-size) * .50);
      height: calc(var(--pad-size) * .25);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        ellipse,
        rgba(112,220,255,.24),
        rgba(84,161,255,.08) 46%,
        transparent 74%
      );
      filter: blur(11px);
      animation: pad-breathe 4.8s ease-in-out infinite;
    }

    .pad-flight-trail {
      position: absolute;
      z-index: 20;
      left: var(--pad-x);
      top: var(--pad-y);
      width: 88px;
      height: 120px;
      transform: translate(-50%,0);
      border-radius: 50%;
      opacity: 0;
      background: linear-gradient(to bottom, rgba(167,235,255,.40), rgba(104,170,255,.10), transparent 80%);
      filter: blur(12px);
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .pad {
      position: absolute;
      z-index: 22;
      left: var(--pad-x);
      top: var(--pad-y);
      width: var(--pad-size);
      height: var(--pad-size);
      transform: translate(-50%,-50%);
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 12px rgba(107,206,255,.20));
      transition: filter .28s ease;
    }

    body.pad-arriving .pad,
    body.pad-boarding .pad,
    body.pad-riding .pad,
    body.pad-landing .pad {
      z-index: 42;
      filter:
        brightness(1.22)
        drop-shadow(0 0 15px rgba(126,224,255,.78))
        drop-shadow(0 0 30px rgba(95,157,255,.38));
    }

    body.pad-arriving .pad-glow,
    body.pad-boarding .pad-glow,
    body.pad-riding .pad-glow,
    body.pad-landing .pad-glow {
      z-index: 41;
      opacity: 1;
      filter: blur(7px);
    }

    body.pad-arriving .pad-flight-trail,
    body.pad-boarding .pad-flight-trail,
    body.pad-riding .pad-flight-trail,
    body.pad-landing .pad-flight-trail {
      opacity: .82;
    }

    .shion-shadow {
      position: absolute;
      z-index: 42;
      width: 34px;
      height: 11px;
      transform: translate(-50%,-50%) scale(var(--actor-inverse-scale,1));
      transform-origin: 50% 50%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(2,7,20,.48), rgba(2,7,20,.14) 58%, transparent 76%);
      pointer-events: none;
    }

    .shion-actor {
      position: absolute;
      z-index: 44;
      width: 58.5px;
      height: 78px;
      transform: translate(-50%,-100%) scale(var(--actor-inverse-scale,1));
      transform-origin: 50% 100%;
      background-image: url("./assets/sprites/shion/shion_idle.png");
      background-repeat: no-repeat;
      background-size: 234px 78px;
      background-position: -58.5px 0;
      image-rendering: pixelated;
      filter: drop-shadow(0 2px 2px rgba(3,7,22,.46));
      pointer-events: none;
    }

    .shiopon-actor {
      background-image: url("./assets/sprites/shiopon/shiopon_idle.png");
    }
    .shiopon-actor[hidden], .shiopon-shadow[hidden] { display: none; }

    #passage-occlusion {
      position: absolute;
      inset: 0;
      z-index: 45;
      width: 1448px;
      height: 1086px;
      pointer-events: none;
      overflow: visible;
    }

    .move-target {
      position: absolute;
      z-index: 41;
      width: 24px;
      height: 12px;
      transform: translate(-50%,-50%) scale(var(--actor-inverse-scale,1));
      transform-origin: 50% 50%;
      border: 1.5px solid rgba(214,239,255,.86);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(112,198,255,.28);
      opacity: 0;
      pointer-events: none;
    }

    .move-target.active { opacity: .8; }

    #guide,
    #flight-status {
      position: fixed;
      left: 50%;
      z-index: 300;
      transform: translateX(-50%);
      padding: 8px 13px;
      border: 1px solid rgba(195,225,255,.24);
      border-radius: 999px;
      color: rgba(255,255,255,.96);
      background: rgba(5,13,35,.68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 12px;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    #guide {
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 18px));
    }

    #flight-status {
      top: max(16px, calc(env(safe-area-inset-top) + 12px));
      font-weight: 750;
    }

    #joystick {
      position: fixed;
      z-index: 330;
      width: 92px;
      height: 92px;
      transform: translate(-50%,-50%);
      pointer-events: none;
    }

    #joystick[hidden] { display: none; }

    .joy-ring {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(211,235,255,.36);
      border-radius: 50%;
      background: rgba(8,22,52,.22);
    }

    #joy-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38px;
      height: 38px;
      margin: -19px 0 0 -19px;
      border: 1px solid rgba(230,243,255,.52);
      border-radius: 50%;
      background: rgba(147,204,255,.43);
    }


    #pad-editor-toggle {
      position: fixed;
      z-index: 4100;
      right: max(12px, calc(env(safe-area-inset-right) + 8px));
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 14px));
      min-width: 88px;
      min-height: 42px;
      padding: 9px 13px;
      border: 1px solid rgba(219,235,255,.34);
      border-radius: 999px;
      color: #fff;
      background: rgba(7,18,43,.80);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font: 700 12px/1 system-ui, sans-serif;
      touch-action: manipulation;
    }

    #pad-editor {
      position: fixed;
      z-index: 4200;
      left: 10px;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      max-width: 520px;
      margin: 0 auto;
      padding: 10px 12px 12px;
      border: 1px solid rgba(219,235,255,.26);
      border-radius: 16px;
      color: #fff;
      background: rgba(5,14,34,.88);
      box-shadow: 0 14px 40px rgba(0,0,0,.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font: 12px/1.35 system-ui, sans-serif;
      touch-action: manipulation;
    }

    #pad-editor[hidden],
    #pad-editor-toggle[hidden] {
      display: none;
    }

    .pad-editor__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .pad-editor__title {
      font-weight: 800;
      letter-spacing: .04em;
    }

    .pad-editor__close {
      width: 34px;
      height: 30px;
      padding: 0;
      border: 1px solid rgba(219,235,255,.24);
      border-radius: 9px;
      color: #fff;
      background: rgba(255,255,255,.07);
      font-size: 18px;
    }

    .pad-editor__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 10px;
    }

    .pad-editor__field {
      min-width: 0;
    }

    .pad-editor__label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
      color: rgba(238,247,255,.94);
    }

    .pad-editor__value {
      color: #bde8ff;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .pad-editor__range {
      width: 100%;
      margin: 0;
      accent-color: #8fdcff;
    }

    .pad-editor__actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
      margin-top: 9px;
    }

    .pad-editor__actions button {
      min-height: 36px;
      padding: 7px 8px;
      border: 1px solid rgba(219,235,255,.24);
      border-radius: 10px;
      color: #fff;
      background: rgba(43,81,136,.66);
      font: 700 11px/1.15 system-ui, sans-serif;
    }

    .pad-editor__note {
      margin-top: 7px;
      color: rgba(219,235,255,.68);
      font-size: 10px;
    }

    body.pad-editing #guide,
    body.pad-editing #flight-status {
      opacity: .25;
    }


    #collision-toggle {
      position: fixed;
      z-index: 4300;
      right: max(12px, calc(env(safe-area-inset-right) + 8px));
      top: max(14px, calc(env(safe-area-inset-top) + 10px));
      min-width: 96px;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid rgba(128,235,204,.42);
      border-radius: 999px;
      color: #fff;
      background: rgba(5,32,30,.80);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font: 800 12px/1 system-ui, sans-serif;
      touch-action: manipulation;
    }

    #collision-toggle[hidden] { display: none; }

    #collision-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 90;
      width: 1448px;
      height: 1086px;
      overflow: visible;
      pointer-events: none;
    }

    body.collision-mode #collision-overlay { display: block; }

    #collision-overlay .collision-area {
      fill: rgba(70,232,166,.22);
      stroke: rgba(133,255,210,.95);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    #collision-overlay .collision-current {
      fill: rgba(255,208,88,.14);
      stroke: rgba(255,223,116,.98);
      stroke-width: 3;
      stroke-dasharray: 9 7;
      vector-effect: non-scaling-stroke;
    }

    #collision-overlay .collision-point {
      fill: #fff3a8;
      stroke: rgba(45,31,0,.9);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    #collision-overlay .collision-start {
      fill: #ffb94a;
      stroke: #fff4c7;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    #collision-panel {
      display: none;
      position: fixed;
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 4400;
      max-width: 560px;
      margin: 0 auto;
      padding: 10px;
      color: #fff;
      background: rgba(4,21,27,.94);
      border: 1px solid rgba(132,239,207,.36);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.40);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      touch-action: auto;
    }

    body.collision-mode #collision-panel { display: block; }

    body.collision-mode #guide,
    body.collision-mode #flight-status,
    body.collision-mode #joystick,
    body.collision-mode #pad-editor,
    body.collision-mode #pad-editor-toggle,
    body.collision-mode #audio-toggle {
      display: none !important;
    }

    body.collision-mode .shion-actor,
    body.collision-mode .shion-shadow {
      opacity: .30;
    }

    body.passage-mode::before {
      content:"EDITOR MODE";
      position:fixed;
      top:max(8px,env(safe-area-inset-top));
      left:50%;
      transform:translateX(-50%);
      z-index:6000;
      padding:6px 12px;
      border-radius:999px;
      background:rgba(5,20,32,.92);
      color:#fff;
      font:800 11px/1 system-ui,sans-serif;
      pointer-events:none;
    }
    body.passage-mode #collision-overlay,
    body.passage-mode #passage-overlay { display:block !important; }
    body.passage-mode #passage-occlusion { display:none !important; }
    body.passage-mode .shion-actor,
    body.passage-mode .shion-shadow,
    body.passage-mode .shiopon-actor,
    body.passage-mode .shiopon-shadow,
    body.passage-mode #joystick,
    body.passage-mode #guide,
    body.passage-mode #flight-status,
    body.passage-mode #pad-editor,
    body.passage-mode #pad-editor-toggle,
    body.passage-mode #collision-toggle,
    body.passage-mode #collision-panel,
    body.passage-mode #audio-toggle,
    body.passage-mode .move-target { display:none !important; }
    body.passage-mode #collision-overlay .collision-area {
      fill:rgba(62,167,255,.20);
      stroke:rgba(115,211,255,.96);
      stroke-width:3;
      vector-effect:non-scaling-stroke;
    }
    body.passage-mode #passage-overlay .passage-area {
      fill:rgba(255,171,58,.24);
      stroke:rgba(255,195,92,.98);
      stroke-width:3;
      vector-effect:non-scaling-stroke;
    }
    body.passage-mode #passage-overlay .passage-current {
      fill:rgba(255,211,92,.12);
      stroke:#ffe08a;
      stroke-width:3;
      stroke-dasharray:9 7;
      vector-effect:non-scaling-stroke;
    }
    body.passage-mode #passage-overlay .passage-point {
      fill:#fff1a6;
      stroke:#7a4d00;
      stroke-width:2;
      vector-effect:non-scaling-stroke;
    }

    .collision-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .collision-title {
      flex: 1;
      font-size: 13px;
      font-weight: 850;
    }

    #collision-status {
      font-size: 11px;
      opacity: .78;
      white-space: nowrap;
    }

    .collision-help {
      margin-bottom: 8px;
      font-size: 11px;
      line-height: 1.45;
      opacity: .78;
    }

    .collision-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .collision-actions button {
      appearance: none;
      min-height: 37px;
      padding: 6px 7px;
      border: 1px solid rgba(168,235,220,.24);
      border-radius: 10px;
      color: #fff;
      background: rgba(255,255,255,.075);
      font: inherit;
      font-size: 11px;
      font-weight: 750;
    }

    #collision-finish {
      background: rgba(63,184,143,.28);
      border-color: rgba(115,235,195,.48);
    }

    #collision-copy {
      background: rgba(65,140,255,.24);
      border-color: rgba(125,185,255,.42);
    }

    #collision-clear {
      background: rgba(223,104,82,.16);
    }

    #fade {
      position: fixed;
      inset: 0;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      background: rgba(244,251,255,.98);
      transition: opacity .72s ease;
    }

    body.leaving #fade { opacity: 1; }
    body.leaving-garden #fade {
      opacity: 1;
      background:
        radial-gradient(circle at 50% 42%, rgba(236,252,255,.98) 0 5%, rgba(114,210,255,.96) 14%, rgba(38,126,255,.76) 30%, rgba(12,65,180,.34) 48%, rgba(3,20,66,0) 70%),
        rgba(5,25,74,.18);
      transition: opacity .34s cubic-bezier(.2,.72,.2,1);
    }
    #devil-memory{position:fixed;inset:0;z-index:1500;display:grid;place-items:center;pointer-events:none;opacity:0;background:rgba(1,4,14,.32);transition:opacity .18s ease}#devil-memory.flash{opacity:1}#devil-memory img{width:min(34vw,210px);max-height:56vh;object-fit:contain;opacity:.90;filter:drop-shadow(0 0 26px rgba(0,0,0,.78))}


    @media (prefers-reduced-motion: reduce) {
      .cloud-track { animation: none; }
    }
  
  </style>
  <link rel="stylesheet" href="./shared-dialogue.css?v=20260920-dialogue-ui-v3" />
</head>

        let moving = false;
        if (companion.visible && companion.following && ride.mode === "ground" && !farewellActive && !devilEventActive && !leaving) {
          // Retrace Shion's actual walkable footsteps rather than cutting corners.
          const tail = companion.trail[companion.trail.length - 1] || companion;
          if (Math.hypot(player.x - tail.x, player.y - tail.y) >= 4)

          let length = 0, previous = companion;
          for (const point of companion.trail) { length += Math.hypot(point.x - previous.x, point.y - previous.y); previous = point; }
          let travel = Math.min(Math.max(0, length - 56), (SHION_SPEED_SCREEN / worldScale) * 1.3 * dt);
          while (travel > 0 && companion.trail.length) {
            const target = companion.trail[0];
            const dx = target.x - companion.x, dy = target.y - companion.y;
            const distance = Math.hypot(dx, dy);
            if (distance < .01) { companion.trail.shift(); continue; }
            const step = Math.min(travel, distance);
            let next = {x: companion.x + dx / distance * step, y: companion.y + dy / distance * step};
            // Reuse the Garden follow-gap rule: never enter Shion's foot-point radius.
            const minGap = 44;
            const playerGap = Math.hypot(next.x - player.x, next.y - player.y);
            if (playerGap < minGap) {
              const awayX = next.x - player.x;
              const awayY = next.y - player.y;
              const awayLength = Math.hypot(awayX, awayY);
              if (awayLength < .001) break;
              next = {
                x: player.x + awayX / awayLength * minGap,
                y: player.y + awayY / awayLength * minGap,
              };
            }
            if (!isGroundWalkable(next.x, next.y)) break;
            companion.x = next.x; companion.y = next.y;
            companion.dir = direction(dx, dy); moving = true; travel -= step;
            if (step >= distance) companion.trail.shift();
          }
          if (moving) { companion.anim += dt * 8.5; companion.frame = Math.floor(companion.anim) % 4; }
        }
        renderCompanion(moving);

      async function loadLandingCollision() {
        let data = null;
        try {
          const response = await fetch(COLLISION_URL, { cache: "no-store" });
          if (response.ok) data = await response.json();
        } catch (_) {}

        const source =
          data?.map === "star-landing" &&
          data?.referenceSize?.width === WORLD_W &&
          data?.referenceSize?.height === WORLD_H &&
          Array.isArray(data?.walkAreas)
            ? data.walkAreas
            : FALLBACK_WALK_AREAS;

        landingWalkAreas = source
          .filter(
            (area) =>
              area?.type === "poly" &&
              Array.isArray(area.points) &&
              area.points.length >= 3,
          )
          .map((area) => ({
            type: "poly",
            points: area.points.map((p) => [Number(p[0]), Number(p[1])]),
          }));

        if (collisionMode || passageMode) {
          try {
            const saved = JSON.parse(localStorage.getItem(COLLISION_DRAFT_KEY) || "null");
            if (Array.isArray(saved?.walkAreas)) {
              const draft = saved.walkAreas.filter(
                (area) =>
                  area?.type === "poly" &&
                  Array.isArray(area.points) &&
                  area.points.length >= 3,
              );
              if (draft.length) {
                landingWalkAreas = draft.map((area) => ({
                  type: "poly",
                  points: area.points.map((p) => [Number(p[0]), Number(p[1])]),
                }));
              }
            }
          } catch (_) {}
        }
      }

      function initCollisionEditor() {
        if (!collisionMode) return;

        document.body.classList.add("collision-mode");
        collisionToggle.hidden = false;
        collisionToggle.setAttribute("aria-pressed", "true");
        collisionToggle.textContent = "編集完了";

        let areas = landingWalkAreas.map((area) => ({
          type: "poly",
          points: area.points.map((p) => [p[0], p[1]]),
        }));
        let current = [];
        let gesture = null;

        const svgNS = "http://www.w3.org/2000/svg";

        function payload() {
          return {
            version: 1,
            map: "star-landing",
            referenceSize: { width: WORLD_W, height: WORLD_H },
            walkAreas: areas.map((area) => ({
              type: "poly",
              points: area.points.map((p) => [Math.round(p[0]), Math.round(p[1])]),
            })),
          };
        }

        function saveDraft() {
          landingWalkAreas = areas.map((area) => ({
            type: "poly",
            points: area.points.map((p) => [p[0], p[1]]),
          }));
          try {
            localStorage.setItem(COLLISION_DRAFT_KEY, JSON.stringify(payload()));
          } catch (_) {}
        }

        function polygon(points, className) {
          const node = document.createElementNS(svgNS, "polygon");
          node.setAttribute("class", className);
          node.setAttribute("points", points.map((p) => p.join(",")).join(" "));
          return node;
        }

        function circleNode(point, index) {
          const node = document.createElementNS(svgNS, "circle");
          node.setAttribute("class", index === 0 ? "collision-start" : "collision-point");
          node.setAttribute("cx", point[0]);
          node.setAttribute("cy", point[1]);
          node.setAttribute("r", index === 0 ? 7 : 5);
          return node;
        }

        function render() {
          collisionOverlay.replaceChildren();

          for (const area of areas) {
            collisionOverlay.appendChild(polygon(area.points, "collision-area"));
          }

          if (current.length) {
            collisionOverlay.appendChild(polygon(current, "collision-current"));
            current.forEach((point, index) => {
              collisionOverlay.appendChild(circleNode(point, index));
            });
          }

          collisionStatus.textContent =
            `範囲 ${areas.length} / 点 ${current.length}`;
        }

        function finishCurrent() {
          if (current.length < 3) return false;
          areas.push({
            type: "poly",
            points: current.map((p) => [Math.round(p[0]), Math.round(p[1])]),
          });
          current = [];
          saveDraft();
          render();
          return true;
        }

        function setMode(open) {
          document.body.classList.toggle("collision-mode", open);
          collisionToggle.setAttribute("aria-pressed", open ? "true" : "false");
          collisionToggle.textContent = open ? "編集完了" : "当たり判定";
          if (open) {
            clearTarget();
            render();
            syncCamera();
          } else {
            gesture = null;
            collisionPanX = 0;
            collisionPanY = 0;
            syncCamera();
          }
        }

        collisionToggle.addEventListener("click", (event) => {
          event.preventDefault();
          setMode(!document.body.classList.contains("collision-mode"));
        });

        collisionUndoPoint.addEventListener("click", () => {
          current.pop();
          render();
        });

        collisionFinish.addEventListener("click", () => {
          if (!finishCurrent()) {
            collisionFinish.textContent = "3点以上必要";
            setTimeout(() => collisionFinish.textContent = "範囲を確定", 1100);
          }
        });

        collisionUndoArea.addEventListener("click", () => {
          if (current.length) {
            current = [];
          } else {
            areas.pop();
            saveDraft();
          }
          render();
        });

        collisionCenter.addEventListener("click", () => {
          collisionPanX = 0;
          collisionPanY = 0;
          syncCamera();
        });

        collisionClear.addEventListener("click", () => {
          if (!areas.length && !current.length) return;
          if (!window.confirm("作成中の当たり判定をすべて消しますか？")) return;
          areas = [];
          current = [];
          saveDraft();
          render();
        });

        collisionCopy.addEventListener("click", async () => {
          if (current.length >= 3) finishCurrent();
          const text = JSON.stringify(payload(), null, 2);
          try {
            await navigator.clipboard.writeText(text);
            collisionCopy.textContent = "コピーしました";
            setTimeout(() => collisionCopy.textContent = "JSONコピー", 1300);
          } catch (_) {
            window.prompt("当たり判定JSONをコピーしてください", text);
          }
        });

        viewport.addEventListener("pointerdown", (event) => {
          if (!document.body.classList.contains("collision-mode")) return;
          if (
            event.target.closest?.("#collision-panel") ||
            event.target.closest?.("#collision-toggle")
          ) return;
          if (event.button != null && event.button !== 0) return;

          event.preventDefault();
          gesture = {
            id: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            panX: collisionPanX,
            panY: collisionPanY,
            moved: false,
            time: performance.now(),
          };
          viewport.setPointerCapture?.(event.pointerId);
        }, { passive: false, capture: true });

        viewport.addEventListener("pointermove", (event) => {
          if (!gesture || gesture.id !== event.pointerId) return;
          if (!document.body.classList.contains("collision-mode")) return;
          event.preventDefault();

          const dx = event.clientX - gesture.x;
          const dy = event.clientY - gesture.y;

          if (!gesture.moved && Math.hypot(dx, dy) >= 10) {
            gesture.moved = true;
          }

          if (gesture.moved) {
            collisionPanX = gesture.panX - dx / worldScale;
            collisionPanY = gesture.panY - dy / worldScale;
            syncCamera();
          }
        }, { passive: false, capture: true });

        function finishGesture(event) {
          if (!gesture || gesture.id !== event.pointerId) return;
          event.preventDefault();

          const wasMoved = gesture.moved;
          const elapsed = performance.now() - gesture.time;

          if (!wasMoved && elapsed < 650) {
            const p = screenToWorld(event.clientX, event.clientY);
            const point = [
              Math.round(clamp(p.x, 0, WORLD_W)),
              Math.round(clamp(p.y, 0, WORLD_H)),
            ];

            if (current.length >= 3) {
              const first = current[0];
              const close = Math.hypot(point[0] - first[0], point[1] - first[1]);
              if (close <= 28) {
                finishCurrent();
              } else {
                current.push(point);
                render();
              }
            } else {
              current.push(point);
              render();
            }
          }

          if (viewport.hasPointerCapture?.(event.pointerId)) {
            viewport.releasePointerCapture(event.pointerId);
          }
          gesture = null;
        }

        viewport.addEventListener("pointerup", finishGesture, { passive:false, capture:true });
        viewport.addEventListener("pointercancel", (event) => {
          if (gesture?.id === event.pointerId) gesture = null;
        }, { passive:false, capture:true });

        render();
      }

      function pointInPoly(x, y, points) {
        let inside = false;
        for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
          const a = points[j];
          const b = points[i];
          if (
            (a[1] > y) !== (b[1] > y) &&
            x < ((b[0] - a[0]) * (y - a[1])) / (b[1] - a[1]) + a[0]
          ) {
            inside = !inside;
          }
        }
        return inside;
      }

      function isGroundWalkable(x, y) {
        if (!landingWalkAreas.length) return true;
        return landingWalkAreas.some(
          (area) =>
            area.type === "poly" &&
            Array.isArray(area.points) &&
            pointInPoly(x, y, area.points),
        );
      }

      function nearestPointOnSegment(point, a, b) {
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const length2 = dx * dx + dy * dy;
        const t = length2
          ? clamp(
              ((point.x - a[0]) * dx + (point.y - a[1]) * dy) / length2,
              0,
              1,
            )
          : 0;
        return { x: a[0] + dx * t, y: a[1] + dy * t };
      }

      function nearestGroundPoint(point) {
        if (!landingWalkAreas.length) return { ...point };
        if (isGroundWalkable(point.x, point.y)) return { ...point };

        let best = null;
        let bestDistance = Infinity;

        for (const area of landingWalkAreas) {
          if (area.type !== "poly" || !Array.isArray(area.points)) continue;
          for (let i = 0, j = area.points.length - 1; i < area.points.length; j = i++) {
            const candidate = nearestPointOnSegment(point, area.points[j], area.points[i]);
            const distance = Math.hypot(candidate.x - point.x, candidate.y - point.y);
            if (distance < bestDistance) {
              best = candidate;
              bestDistance = distance;
            }
          }
        }

        return best;
      }

      function fitWorld() {
        worldScale = Math.max(1, innerWidth / WORLD_W, innerHeight / WORLD_H);
        world.style.setProperty("--actor-inverse-scale", String(1 / worldScale));
        syncCamera();
      }

      function syncCamera() {
        const halfW = innerWidth / (2 * worldScale);
        const halfH = innerHeight / (2 * worldScale);
        const minX = Math.min(halfW, WORLD_W / 2);
        const maxX = Math.max(minX, WORLD_W - halfW);
        const minY = Math.min(halfH, WORLD_H / 2);
        const maxY = Math.max(minY, WORLD_H - halfH);

        const focusX = clamp(player.x, minX, maxX);
        const focusY = clamp(player.y - 85, minY, maxY);

        cameraTx = innerWidth / 2 - focusX * worldScale;
        cameraTy = innerHeight / 2 - focusY * worldScale;

        // Collision editor needs free canvas panning even beyond the normal
        // gameplay camera limits. Apply its pan after clamping the gameplay
        // focus so dragging always moves the map on mobile.
        if (collisionMode || passageMode) {
          cameraTx -= collisionPanX * worldScale;
          cameraTy -= collisionPanY * worldScale;
        }
        world.style.transform =
          `translate3d(${cameraTx}px,${cameraTy}px,0) scale(${worldScale})`;
      }

      function pointInPassage(x, y) {
        return passageAreas.some(area => pointInPoly(x, y, area.points));
      }

      function renderPassageOcclusion() {
        if (!passageOcclusion) return;
        const ns = "http://www.w3.org/2000/svg";
        passageOcclusion.replaceChildren();
        if (!passageAreas.length) return;

        const defs = document.createElementNS(ns, "defs");
        const clip = document.createElementNS(ns, "clipPath");
        clip.setAttribute("id", "passage-occlusion-clip");
        clip.setAttribute("clipPathUnits", "userSpaceOnUse");
        passageAreas.forEach(area => {
          const polygon = document.createElementNS(ns, "polygon");
          polygon.setAttribute("points", area.points.map(p => p.join(",")).join(" "));
          clip.appendChild(polygon);
        });
        defs.appendChild(clip);
        passageOcclusion.appendChild(defs);

        const image = document.createElementNS(ns, "image");
        image.setAttribute("href", "./assets/maps/star-landing/ground.webp?v=20260919-main-sync-1");
        image.setAttribute("x", "0");
        image.setAttribute("y", "0");
        image.setAttribute("width", String(WORLD_W));
        image.setAttribute("height", String(WORLD_H));
        image.setAttribute("preserveAspectRatio", "none");
        image.setAttribute("clip-path", "url(#passage-occlusion-clip)");
        passageOcclusion.appendChild(image);
      }

      async function loadPassageLayers() {
        try {
          const response = await fetch(PASSAGE_URL, { cache: "no-store" });
          if (response.ok) {
            const data = await response.json();
            if (data?.map === "star-landing" && Array.isArray(data?.passageAreas)) {
              passageAreas = data.passageAreas
                .filter(a => a?.type === "poly" && Array.isArray(a.points) && a.points.length >= 3)
                .map(a => ({type:"poly", points:a.points.map(p => [Number(p[0]), Number(p[1])])}));
            }
          }
        } catch (_) {}
        if (passageMode) {
          try {
            const draft = JSON.parse(localStorage.getItem(PASSAGE_DRAFT_KEY) || "null");
            if (Array.isArray(draft?.passageAreas)) {
              passageAreas = draft.passageAreas
                .filter(a => a?.type === "poly" && Array.isArray(a.points) && a.points.length >= 3)
                .map(a => ({type:"poly", points:a.points.map(p => [Number(p[0]), Number(p[1])])}));
            }
          } catch (_) {}
        }
        renderPassageOcclusion();
      }

      function initPassageEditor() {
        if (!passageMode) return;
        const panel = document.getElementById("passage-panel");
        const overlay = document.getElementById("passage-overlay");
        const statusEl = document.getElementById("passage-status");
        const walkButton = document.getElementById("edit-walk");
        const passageButton = document.getElementById("edit-passage");
        panel.hidden = false;
        document.body.classList.add("passage-mode");
        ride.mode = "ground";
        clearTarget();
        keys.clear();
        stick.active = false;
        joystick.hidden = true;

        const ns = "http://www.w3.org/2000/svg";
        let activeLayer = "walk";
        let current = [];
        let gesture = null;
        const pointers = new Map();
        let pinchStart = null;

        const cloneAreas = areas => areas.map(a => ({
          type:"poly", points:a.points.map(p => [Number(p[0]), Number(p[1])])
        }));
        const walkPayload = () => ({
          version:1, map:"star-landing",
          referenceSize:{width:WORLD_W,height:WORLD_H},
          walkAreas: cloneAreas(landingWalkAreas).map(a => ({type:"poly",points:a.points.map(p=>[Math.round(p[0]),Math.round(p[1])])}))
        });
        const passagePayload = () => ({
          version:1, map:"star-landing",
          referenceSize:{width:WORLD_W,height:WORLD_H},
          passageAreas: cloneAreas(passageAreas).map(a => ({type:"poly",points:a.points.map(p=>[Math.round(p[0]),Math.round(p[1])])}))
        });
        const save = () => {
          try {
            localStorage.setItem(COLLISION_DRAFT_KEY, JSON.stringify(walkPayload()));
            localStorage.setItem(PASSAGE_DRAFT_KEY, JSON.stringify(passagePayload()));
          } catch (_) {}
        };
        const poly = (points, className) => {
          const p=document.createElementNS(ns,"polygon");
          p.setAttribute("class",className);
          p.setAttribute("points",points.map(v=>v.join(",")).join(" "));
          return p;
        };
        const dot = (pt, className) => {
          const c=document.createElementNS(ns,"circle");
          c.setAttribute("class",className);
          c.setAttribute("cx",pt[0]); c.setAttribute("cy",pt[1]); c.setAttribute("r","5");
          return c;
        };
        const render = () => {
          collisionOverlay.replaceChildren();
          landingWalkAreas.forEach(a => collisionOverlay.appendChild(poly(a.points,"collision-area")));
          overlay.replaceChildren();
          passageAreas.forEach(a => overlay.appendChild(poly(a.points,"passage-area")));
          if (current.length) {
            const target = activeLayer === "walk" ? collisionOverlay : overlay;
            target.appendChild(poly(current, activeLayer === "walk" ? "collision-current" : "passage-current"));
            current.forEach(pt => target.appendChild(dot(pt, activeLayer === "walk" ? "collision-point" : "passage-point")));
          }
          renderPassageOcclusion();
          walkButton.style.background = activeLayer === "walk" ? "rgba(62,167,255,.42)" : "rgba(255,255,255,.075)";
          passageButton.style.background = activeLayer === "passage" ? "rgba(255,171,58,.42)" : "rgba(255,255,255,.075)";
          statusEl.textContent = (activeLayer === "walk" ? "通路を編集中" : "背景裏を編集中") +
            ` / 通路 ${landingWalkAreas.length}範囲 / 背景裏 ${passageAreas.length}範囲 / 作成中 ${current.length}点`;
        };
        const finishCurrent = () => {
          if (current.length < 3) return false;
          const area={type:"poly",points:current.map(p=>[Math.round(p[0]),Math.round(p[1])])};
          if (activeLayer === "walk") landingWalkAreas.push(area); else passageAreas.push(area);
          current=[]; save(); render(); return true;
        };
        const switchLayer = layer => { current=[]; activeLayer=layer; render(); };
        const fitEditorWorld = () => {
          editorScale=Math.min(innerWidth/WORLD_W,innerHeight/WORLD_H);
          worldScale=Math.max(.25,Math.min(2.5,editorScale));
          collisionPanX=WORLD_W/2-innerWidth/(2*worldScale);
          collisionPanY=WORLD_H/2-innerHeight/(2*worldScale);
          world.style.setProperty("--actor-inverse-scale",String(1/worldScale));
          syncCamera();
        };

        walkButton.onclick=()=>switchLayer("walk");
        passageButton.onclick=()=>switchLayer("passage");
        document.getElementById("passage-undo").onclick=()=>{current.pop();render();};
        document.getElementById("passage-finish").onclick=()=>{
          if(!finishCurrent()){statusEl.textContent="3点以上で範囲を確定できます";setTimeout(render,900);}
        };
        document.getElementById("passage-undo-area").onclick=()=>{
          if(current.length) current=[];
          else if(activeLayer==="walk") landingWalkAreas.pop();
          else passageAreas.pop();
          save();render();
        };
        document.getElementById("passage-center").onclick=fitEditorWorld;
        document.getElementById("passage-clear").onclick=()=>{
          const label=activeLayer==="walk"?"通路":"背景裏";
          if(!confirm(label+"の範囲だけを全消去しますか？\\nもう一方のデータは変更しません。")) return;
          current=[];
          if(activeLayer==="walk") landingWalkAreas=[]; else passageAreas=[];
          save();render();
        };
        document.getElementById("passage-copy").onclick=async()=>{
          if(current.length>=3) finishCurrent();
          const out=JSON.stringify({collision:walkPayload(),passageLayers:passagePayload()},null,2);
          try{await navigator.clipboard.writeText(out);statusEl.textContent="通路＋背景裏JSONをコピーしました";setTimeout(render,1100);}
          catch(_){prompt("collision.json + passage-layers.json",out);}
        };

        viewport.addEventListener("pointerdown",e=>{
          if(!document.body.classList.contains("passage-mode")||e.target.closest?.("#passage-panel"))return;
          if(e.button!=null&&e.button!==0)return;
          e.preventDefault();e.stopImmediatePropagation();
          pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
          viewport.setPointerCapture?.(e.pointerId);
          if(pointers.size===2){
            const pts=[...pointers.values()];
            pinchStart={distance:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),scale:worldScale};
            gesture=null;return;
          }
          gesture={id:e.pointerId,x:e.clientX,y:e.clientY,panX:collisionPanX,panY:collisionPanY,moved:false,time:performance.now()};
        },{passive:false,capture:true});
        viewport.addEventListener("pointermove",e=>{
          if(!pointers.has(e.pointerId)||!document.body.classList.contains("passage-mode"))return;
          e.preventDefault();e.stopImmediatePropagation();
          pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
          if(pointers.size>=2&&pinchStart){
            const pts=[...pointers.values()];
            const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
            worldScale=Math.max(.25,Math.min(2.5,pinchStart.scale*(d/Math.max(1,pinchStart.distance))));
            world.style.setProperty("--actor-inverse-scale",String(1/worldScale));syncCamera();return;
          }
          if(!gesture||gesture.id!==e.pointerId)return;
          const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;
          if(!gesture.moved&&Math.hypot(dx,dy)>=9)gesture.moved=true;
          if(gesture.moved){collisionPanX=gesture.panX-dx/worldScale;collisionPanY=gesture.panY-dy/worldScale;syncCamera();}
        },{passive:false,capture:true});
        const endGesture=e=>{
          if(!pointers.has(e.pointerId))return;
          e.preventDefault();e.stopImmediatePropagation();
          pointers.delete(e.pointerId);
          if(pinchStart){if(pointers.size<2)pinchStart=null;gesture=null;}
          else if(gesture&&gesture.id===e.pointerId){
            const elapsed=performance.now()-gesture.time;
            if(!gesture.moved&&elapsed<650){
              const p=screenToWorld(e.clientX,e.clientY);
              current.push([Math.round(clamp(p.x,0,WORLD_W)),Math.round(clamp(p.y,0,WORLD_H))]);render();
            }
            gesture=null;
          }
          if(viewport.hasPointerCapture?.(e.pointerId))viewport.releasePointerCapture(e.pointerId);
        };
        viewport.addEventListener("pointerup",endGesture,{passive:false,capture:true});
        viewport.addEventListener("pointercancel",endGesture,{passive:false,capture:true});
        render();fitEditorWorld();
      }

      function setActorPosition() {
        actor.style.left = player.x + "px";
        actor.style.top = player.y + "px";
        shadow.style.left = player.x + "px";
        shadow.style.top = player.y + "px";

        if (ride.mode === "ground") {
          const behindPad =
            Math.abs(player.x - PAD_HOME.x) <= PAD_SIZE * .62 &&
            player.y < PAD_HOME.y - 6;
          // Background-behind passages use a polygon-clipped copy of the
          // ground above the actor. Never lower the whole actor beneath the
          // full-size ground image, otherwise Shion disappears completely.
          actor.style.zIndex = behindPad ? "21" : "44";
          shadow.style.zIndex = behindPad ? "20" : "43";
        } else {
          actor.style.zIndex = "45";
          shadow.style.zIndex = "43";
        }
      }

      function setActorVisual() {
        if (player.moving) {
          actor.style.backgroundImage = `url("${walkSheet[player.dir]}")`;
          actor.style.backgroundPosition = `${-58.5 * player.frame}px 0`;
        } else {
          actor.style.backgroundImage = 'url("./assets/sprites/shion/shion_idle.png")';
          actor.style.backgroundPosition = `${-58.5 * idleFrame[player.dir]}px 0`;
        }
      }

      function direction(dx, dy) {
        if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? "left" : "right";
        return dy < 0 ? "up" : "down";
      }

      function screenToWorld(x, y) {
        return {
          x: (x - cameraTx) / worldScale,
          y: (y - cameraTy) / worldScale,
        };
      }

      function showTarget(point) {
        targetRing.style.left = point.x + "px";
        targetRing.style.top = point.y + "px";
        targetRing.classList.add("active");
      }

      function clearTarget() {
        player.target = null;
        targetRing.classList.remove("active");
      }

      // Shared PAD audio — use the same three assets on every map.
      const padActivateAudio = new Audio("./assets/audio/sfx/pad-activate.wav");
      const padMoveAudioA = new Audio("./assets/audio/sfx/pad-move-loop.flac");
      const padMoveAudioB = new Audio("./assets/audio/sfx/pad-move-loop.flac");
      const padLandAudio = new Audio("./assets/audio/sfx/pad-land.wav");
      const starGateAudio = new Audio("./assets/audio/sfx/star-gate-resonance.mp3");
      padActivateAudio.preload = "auto";
      padMoveAudioA.preload = "auto";
      padMoveAudioB.preload = "auto";
      padLandAudio.preload = "auto";
      starGateAudio.preload = "auto";
      padActivateAudio.volume = .72;
      padMoveAudioA.volume = .42;
      padMoveAudioB.volume = .42;
      padLandAudio.volume = .76;
      starGateAudio.volume = .45;
      let padMoveLoopTimer = 0;
      let padMoveActive = false;
      let padMoveCurrent = padMoveAudioA;
      let padMoveNext = padMoveAudioB;

      function playPadOneShot(audio) {
        try { audio.pause(); audio.currentTime = 0; audio.play().catch(() => {}); } catch (_) {}
      }
      function schedulePadMoveSeamlessLoop() {
        clearTimeout(padMoveLoopTimer);
        if (!padMoveActive || !Number.isFinite(padMoveCurrent.duration)) return;
        // Start the second copy just before the first reaches its tail. This
        // crossfades over the file boundary so the FLAC never drops to silence.
        const remaining = Math.max(0, padMoveCurrent.duration - padMoveCurrent.currentTime);
        const overlap = Math.min(.18, Math.max(.06, padMoveCurrent.duration * .08));
        padMoveLoopTimer = window.setTimeout(() => {
          if (!padMoveActive) return;
          const outgoing = padMoveCurrent;
          const incoming = padMoveNext;
          try {
            incoming.currentTime = 0;
            incoming.volume = 0;
            incoming.play().catch(() => {});
            const started = performance.now();
            const fade = (now) => {
              if (!padMoveActive) return;
              const t = Math.min(1, (now - started) / (overlap * 1000));
              outgoing.volume = .42 * (1 - t);
              incoming.volume = .42 * t;
              if (t < 1) requestAnimationFrame(fade);
              else {
                outgoing.pause(); outgoing.currentTime = 0; outgoing.volume = .42;
                padMoveCurrent = incoming; padMoveNext = outgoing;
                schedulePadMoveSeamlessLoop();
              }
            };
            requestAnimationFrame(fade);
          } catch (_) {}
        }, Math.max(0, (remaining - overlap) * 1000));
      }
      function startPadMoveAudio() {
        if (padMoveActive) return;
        padMoveActive = true;
        try {
          padMoveCurrent.currentTime = 0;
          padMoveCurrent.volume = .42;
          padMoveCurrent.play().then(schedulePadMoveSeamlessLoop).catch(() => {});
        } catch (_) {}
      }
      function stopPadMoveAudio() {
        padMoveActive = false;
        clearTimeout(padMoveLoopTimer);
        for (const audio of [padMoveAudioA, padMoveAudioB]) {
          try { audio.pause(); audio.currentTime = 0; audio.volume = .42; } catch (_) {}
        }
      }

      function setRideMode(mode) {
        ride.mode = mode;
        if (mode === "boarding") {
          stopPadMoveAudio();
          playPadOneShot(padActivateAudio);
        } else if (mode === "flying" || mode === "exiting" || mode === "arriving" || mode === "landing") {
          // Keep the PAD movement sound running for the whole travel/landing motion.
          startPadMoveAudio();
        } else if (mode === "ground") {
          stopPadMoveAudio();
        }
        document.body.classList.toggle("pad-arriving", mode === "arriving");
        document.body.classList.toggle("pad-boarding", mode === "boarding");
        document.body.classList.toggle("pad-riding", mode === "flying");
        document.body.classList.toggle("pad-landing", mode === "landing");

        // Destination/operation guidance is intentionally disabled.
        status.hidden = true;
        guide.hidden = true;
      }

      function syncRideVisual(now = performance.now()) {
        if (ride.mode === "ground") return;

        const bob = ride.mode === "flying"
          ? Math.sin(now / 620) * 2.2
          : 0;
        const visualY = ride.y - ride.lift + bob;

        pad.style.left = ride.x + "px";
        pad.style.top = visualY + "px";
        padGlow.style.left = ride.x + "px";
        padGlow.style.top = visualY + "px";
        padTrail.style.left = ride.x + "px";
        padTrail.style.top = (visualY + 22) + "px";

        player.x = ride.x;
        player.y = visualY - 2;
        player.moving = false;
        player.frame = 0;
      }

      function finishArrival() {
        stopPadMoveAudio();
        playPadOneShot(padLandAudio);
        ride.mode = "ground";
        ride.x = PAD_HOME.x;
        ride.y = PAD_HOME.y;
        ride.lift = 0;
        ride.progress = 0;
        ride.homeArmed = false;
        ride.reboardLockedUntil = performance.now() + PAD_REBOARD_COOLDOWN_MS;

        document.body.classList.remove(
          "pad-arriving",
          "pad-riding",
          "pad-landing",
          "pad-boarding",
        );

        // Same behavior as Alenon: once Shion gets off, the PAD settles back
        // to its weak, inactive ground-state light.
        pad.style.left = PAD_HOME.x + "px";
        pad.style.top = PAD_HOME.y + "px";
        padGlow.style.left = PAD_HOME.x + "px";
        padGlow.style.top = PAD_HOME.y + "px";
        padTrail.style.left = PAD_HOME.x + "px";
        padTrail.style.top = PAD_HOME.y + "px";

        player.x = PAD_HOME.x;
        player.y = PAD_HOME.y - PAD_DISMOUNT_OFFSET_Y;
        player.dir = "up";
        player.moving = false;
        player.frame = 0;
        player.anim = 0;
        clearTarget();

        const shouldGreetOnReturn =
          arrivingFromAlenon &&
          savedCompanion?.mode === "waiting" &&
          companion.visible;
        rejoinCompanion();
        if (shouldGreetOnReturn) void runReturnGreeting();
        status.textContent = "PAD着陸完了";
        guide.hidden = true;
        guide.hidden = false;

        setActorPosition();
        setActorVisual();

        window.setTimeout(() => {
          if (ride.mode === "ground" && !leaving) status.style.opacity = ".24";
        }, 1200);
      }

      async function beginBoarding() {
        if (
          ride.mode !== "ground" ||
          leaving || farewellActive || devilEventActive ||
          performance.now() < ride.reboardLockedUntil
        ) return;

        if (companion.visible && companion.following) {
          farewellActive = true;
          companion.following = false;
          companion.trail = [];
          clearTarget(); keys.clear(); pointer = null;
          stick.active = false; stick.x = stick.y = 0; joystick.hidden = true;
          player.moving = false; player.frame = 0; player.anim = 0;
          companion.dir = direction(player.x - companion.x, player.y - companion.y);
          renderCompanion();
          window.TarotJourney?.set("companion", {mode: "waiting", x: companion.x, y: companion.y});
          await showStoryLine("しおぽんは、ここで待ってるの！\nだからシオンさん、ちゃんと戻ってきてね！", "しおぽん", "shiopon");
          await showStoryLine("いってらっしゃい、ぴょん！", "しおぽん", "shiopon");
          farewellActive = false;
        }
        ride.x = PAD_HOME.x;
        ride.y = PAD_HOME.y;
        ride.lift = 0;
        ride.progress = 0;
        ride.fromX = player.x;
        ride.fromY = player.y;
        ride.homeArmed = false;
        clearTarget();
        setRideMode("boarding");
      }

      function beginLanding() {
        if (ride.mode !== "flying") return;
        ride.progress = 0;
        ride.landFromX = ride.x;
        ride.landFromY = ride.y;
        ride.landFromLift = ride.lift;
        clearTarget();
        setRideMode("landing");
      }

      function finishLanding() {
        finishArrival();
      }

      function leaveForAlenon() {
        if (leaving || ride.mode !== "flying") return;
        leaving = true;
        clearTarget(); keys.clear();
        document.body.classList.add("leaving");
        window.setTimeout(() => {
          location.href = "./alenon.html?from=landing-return";
        }, 760);
      }

      function leaveForGarden() {
        if (leaving) return;
        // Progress v1 records the semantic route only after its prerequisite event
        // is complete. Navigation itself remains on the existing validated URL path.
        if (landingProgressValid) {
          try {
            landingProgress.commitArrival({
              sourceMapId: "star_country_landing",
              destinationMapId: "star_gate_garden",
              spawnId: "south_gate",
              reason: "gate_to_garden",
            });
          } catch (error) {
            console.warn("[Landing Progress] garden arrival was not persisted", error);
          }
        }
        leaving = true;
        window.TarotJourney?.set("companion", companion.following ? {mode: "following"} : savedCompanion);
        clearTarget();
        keys.clear();
        document.body.classList.add("leaving", "leaving-garden");
        status.style.opacity = "1";
        status.textContent = "星門庭園へ…";
        guide.hidden = true;

        // Gate resonance and the blue flash start together. Do not wait for
        // the source file to finish: this transition is intentionally brief.
        try {
          starGateAudio.pause();
          starGateAudio.currentTime = 0;
          starGateAudio.volume = .45;
          starGateAudio.play().catch(() => {});
        } catch (_) {}

        const transitionMs = 1800;
        const audioFadeMs = 180;
        window.setTimeout(() => {
          const started = performance.now();
          const fadeGateAudio = (now) => {
            const t = Math.min(1, (now - started) / audioFadeMs);
            starGateAudio.volume = .45 * (1 - t);
            if (t < 1 && leaving) requestAnimationFrame(fadeGateAudio);
            else {
              try { starGateAudio.pause(); starGateAudio.currentTime = 0; starGateAudio.volume = .45; } catch (_) {}
            }
          };
          requestAnimationFrame(fadeGateAudio);
        }, transitionMs - audioFadeMs);

        window.setTimeout(() => {
          location.href = "./index.html?from=landing";
        }, transitionMs);
      }

      function setTarget(clientX, clientY) {
        if (leaving || devilEventActive || farewellActive || ["arriving","boarding","landing"].includes(ride.mode)) return;

        let point = screenToWorld(clientX, clientY);
        point.x = clamp(point.x, WORLD_MARGIN, WORLD_W - WORLD_MARGIN);
        point.y = clamp(point.y, 90, WORLD_H - WORLD_MARGIN);

        if (ride.mode === "ground") {
          point = nearestGroundPoint(point);
          if (!point) return;
        }

        player.target = point;
        showTarget(point);
        guide.hidden = true;
      }

      const keys = new Set();
      const stick = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
      const STICK_RADIUS = 42;
      let pointer = null;

      function updateStick(x, y) {
        const dx = x - stick.ox;
        const dy = y - stick.oy;
        const len = Math.hypot(dx, dy);
        const ratio = len > STICK_RADIUS ? STICK_RADIUS / len : 1;
        const kx = dx * ratio;
        const ky = dy * ratio;
        stick.x = kx / STICK_RADIUS;
        stick.y = ky / STICK_RADIUS;
        knob.style.transform = `translate(${kx}px,${ky}px)`;
      }

      viewport.addEventListener("pointerdown", (event) => {
        if (collisionMode || passageMode) return;
        if (event.target.closest?.("#pad-editor, #pad-editor-toggle, .tb-dialogue-layer")) return;
        if (leaving || devilEventActive || farewellActive || ["arriving","boarding","landing"].includes(ride.mode)) return;
        if (event.button != null && event.button !== 0) return;
        event.preventDefault();
        window.TarotAudio?.startFromMovement();
        pointer = {
          id:event.pointerId,
          x:event.clientX,
          y:event.clientY,
          time:performance.now(),
        };
        viewport.setPointerCapture?.(event.pointerId);
      }, { passive:false });

      viewport.addEventListener("pointermove", (event) => {
        if (!pointer || pointer.id !== event.pointerId) return;
        event.preventDefault();

        if (stick.active) {
          updateStick(event.clientX, event.clientY);
          return;
        }

        const dist = Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y);
        if (dist >= 12) {
          stick.active = true;
          stick.id = event.pointerId;
          stick.ox = pointer.x;
          stick.oy = pointer.y;
          player.target = null;
          targetRing.classList.remove("active");
          joystick.hidden = false;
          joystick.style.left = stick.ox + "px";
          joystick.style.top = stick.oy + "px";
          updateStick(event.clientX, event.clientY);
          guide.hidden = true;
        }
      }, { passive:false });

      function endPointer(event) {
        if (!pointer || pointer.id !== event.pointerId) return;
        event.preventDefault();

        if (event.type === "pointerup") window.TarotAudio?.startFromMovement();
        const wasStick = stick.active;
        const elapsed = performance.now() - pointer.time;
        const dist = Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y);

        if (wasStick) {
          stick.active = false;
          stick.id = null;
          stick.x = 0;
          stick.y = 0;
          joystick.hidden = true;
          knob.style.transform = "translate(0,0)";
        } else if (elapsed < 650 && dist < 12) {
          setTarget(event.clientX, event.clientY);
        }

        if (viewport.hasPointerCapture?.(event.pointerId)) {
          viewport.releasePointerCapture(event.pointerId);
        }
        pointer = null;
      }

      viewport.addEventListener("pointerup", endPointer, { passive:false });
      viewport.addEventListener("pointercancel", endPointer, { passive:false });

      addEventListener("keydown", (event) => {
        if (collisionMode || passageMode) return;
        if (leaving || devilEventActive || farewellActive || ["arriving","boarding","landing"].includes(ride.mode)) return;
        const key = event.key.toLowerCase();
        if (["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(key)) {
          window.TarotAudio?.startFromMovement();
          keys.add(key);
          clearTarget();
          guide.hidden = true;
          event.preventDefault();
        }
      }, { passive:false });

      addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));

      function keyVector() {
        let x = 0, y = 0;
        if (keys.has("arrowleft") || keys.has("a")) x -= 1;
        if (keys.has("arrowright") || keys.has("d")) x += 1;
        if (keys.has("arrowup") || keys.has("w")) y -= 1;
        if (keys.has("arrowdown") || keys.has("s")) y += 1;
        const len = Math.hypot(x, y);
        return len ? { x:x/len, y:y/len } : { x:0, y:0 };
      }

      let last = performance.now();

      function loop(now) {
        const dt = Math.min((now - last) / 1000, .05);
        last = now;

        if (collisionMode || passageMode) {
          player.moving = false;
          setActorPosition();
          setActorVisual();
          syncCamera();
          requestAnimationFrame(loop);
          return;
        }

        if (ride.mode === "arriving") {
          ride.progress = Math.min(1, ride.progress + dt / 1.35);
          const t = easeOutCubic(ride.progress);
          ride.x = PAD_HOME.x;
                    const arrivalStartY = Math.min(WORLD_H + 20, PAD_HOME.y + 148);
          ride.y = arrivalStartY + (PAD_HOME.y - arrivalStartY) * t;
          ride.lift = 48 * (1 - t);
          syncRideVisual(now);

          if (ride.progress >= 1) finishArrival();

          setActorPosition();
          setActorVisual();
          syncCamera();
          requestAnimationFrame(loop);
          return;
        }

        if (ride.mode === "boarding") {
          ride.progress = Math.min(1, ride.progress + dt / PAD_BOARD_DURATION);
          const t = easeOutCubic(ride.progress);
          ride.lift = PAD_LIFT * t;
          player.x = ride.fromX + (ride.x - ride.fromX) * t;
          player.y = ride.fromY + ((ride.y - PAD_LIFT - 2) - ride.fromY) * t;
          player.dir = "down";
          player.moving = false;

          if (ride.progress >= 1) {
            ride.mode = "flying";
            ride.lift = PAD_LIFT;
            document.body.classList.remove("pad-boarding");
            document.body.classList.add("pad-riding");
            setRideMode("flying");
          }

          syncRideVisual(now);
          setActorPosition();
          setActorVisual();
          syncCamera();
          requestAnimationFrame(loop);
          return;
        }

        if (ride.mode === "landing") {
          ride.progress = Math.min(1, ride.progress + dt / PAD_LAND_DURATION);
          const t = easeOutCubic(ride.progress);
          ride.x = ride.landFromX + (PAD_HOME.x - ride.landFromX) * t;
          ride.y = ride.landFromY + (PAD_HOME.y - ride.landFromY) * t;
          ride.lift = ride.landFromLift * (1 - t);
          syncRideVisual(now);

          if (ride.progress >= 1) finishLanding();

          setActorPosition();
          setActorVisual();
          syncCamera();
          requestAnimationFrame(loop);
          return;
        }

        if(!devilEventStarted&&ride.mode==="ground"&&player.y<=DEVIL_EVENT_Y&&player.x>=GARDEN_EXIT_X_MIN&&player.x<=GARDEN_EXIT_X_MAX){runDevilMemoryEvent()}
        if(devilEventActive || farewellActive){player.moving=false;setActorPosition();setActorVisual();syncCamera();requestAnimationFrame(loop);return}

        const keyboard = keyVector();
        let vx = keyboard.x;
        let vy = keyboard.y;
        let manual = Math.hypot(vx,vy) > .01;

        if (!manual && stick.active) {
          vx = stick.x;
          vy = stick.y;
          manual = Math.hypot(vx,vy) > .08;
        }

        const originX = ride.mode === "flying" ? ride.x : player.x;
        const originY = ride.mode === "flying" ? ride.y : player.y;

        if (!manual && player.target) {
          const dx = player.target.x - originX;
          const dy = player.target.y - originY;
          const dist = Math.hypot(dx,dy);

          if (dist <= 3.5) {
            if (ride.mode === "flying") {
              ride.x = player.target.x;
              ride.y = player.target.y;
            } else if (isGroundWalkable(player.target.x, player.target.y)) {
              player.x = player.target.x;
              player.y = player.target.y;
            }
            clearTarget();
          } else {
            vx = dx / dist;
            vy = dy / dist;
          }
        }

        const moving = !leaving && (manual || !!player.target) && Math.hypot(vx,vy) > .001;

        if (moving) {
          player.dir = direction(vx,vy);

          if (ride.mode === "flying") {
            const speed = PAD_SPEED_SCREEN / worldScale;
            ride.x = clamp(ride.x + vx * speed * dt, 70, WORLD_W - 70);
            ride.y = clamp(ride.y + vy * speed * dt, 100, WORLD_H - 30);
            ride.lift = PAD_LIFT;
            player.moving = false;
          } else {
            const speed = SHION_SPEED_SCREEN / worldScale;
            const stepX = vx * speed * dt;
            const stepY = vy * speed * dt;

            const next = {
              x: clamp(player.x + stepX, WORLD_MARGIN, WORLD_W - WORLD_MARGIN),
              y: clamp(player.y + stepY, 120, WORLD_H - WORLD_MARGIN),
            };
            const xOnly = { x:next.x, y:player.y };
            const yOnly = { x:player.x, y:next.y };

            let moved = false;
            if (isGroundWalkable(next.x,next.y)) {
              player.x = next.x;
              player.y = next.y;
              moved = true;
            } else if (isGroundWalkable(xOnly.x,xOnly.y)) {
              player.x = xOnly.x;
              moved = true;
            } else if (isGroundWalkable(yOnly.x,yOnly.y)) {
              player.y = yOnly.y;
              moved = true;
            }

            player.moving = moved;
            if (moved) {
              player.anim += dt * 8.5;
              player.frame = Math.floor(player.anim) % 4;
            }
          }
        } else {
          player.moving = false;
          player.anim = 0;
          player.frame = 0;
        }

        if (ride.mode === "flying") {
          const homeDistance = Math.hypot(ride.x - PAD_HOME.x, ride.y - PAD_HOME.y);
          if (homeDistance >= PAD_HOME_ARM_DISTANCE) ride.homeArmed = true;
          if (ride.homeArmed && homeDistance <= PAD_HOME_LAND_RADIUS) beginLanding();
          else if (ride.y >= 1038 && ride.x >= GARDEN_EXIT_X_MIN && ride.x <= GARDEN_EXIT_X_MAX) leaveForAlenon();
          syncRideVisual(now);
        } else {
          const padDistance = Math.hypot(player.x - PAD_HOME.x, player.y - PAD_HOME.y);
          if (
            padDistance <= PAD_TOUCH_RADIUS &&
            performance.now() >= ride.reboardLockedUntil
          ) {
            beginBoarding();
          }

          if (player.y > GARDEN_EXIT_Y + 30) gardenExitArmed = true;
          if (
            gardenExitArmed && player.moving && !farewellActive &&
            player.y <= GARDEN_EXIT_Y &&
            player.x >= GARDEN_EXIT_X_MIN &&
            player.x <= GARDEN_EXIT_X_MAX
          ) {
            leaveForGarden();
          }
        }

        updateCompanion(dt);
        setActorPosition();
        setActorVisual();
        syncCamera();
        requestAnimationFrame(loop);
      }

      async function boot() {
        await loadLandingCollision();
        await loadPassageLayers();

        if (collisionMode || passageMode) {
          ride.mode = "ground";
          ride.x = PAD_HOME.x;
          ride.y = PAD_HOME.y;
          ride.lift = 0;
          player.x = PAD_HOME.x;
          player.y = PAD_HOME.y - PAD_DISMOUNT_OFFSET_Y;
        }

        initPadEditor();
        initPassageEditor();
        if (passageMode) { clearTarget(); keys.clear(); joystick.hidden = true; }
        applyPadEditorLayout({ movePlayer: ride.mode === "ground" && !passageMode });
        if (returningFromGarden && !collisionMode && !padEditMode) {
          const entrance = nearestGroundPoint({x: 724, y: GARDEN_EXIT_Y + 42});
          player.x = entrance.x; player.y = entrance.y; player.dir = "down";
          if (companion.following) {
            const candidates = [
              {x: player.x, y: player.y - 64},
              {x: player.x - 64, y: player.y},
              {x: player.x + 64, y: player.y},
              {x: player.x, y: player.y + 64},
            ];
            const separated = candidates
              .map(nearestGroundPoint)
              .find(point => point && Math.hypot(point.x - player.x, point.y - player.y) >= 44);
            if (separated) {
              companion.x = separated.x;
              companion.y = separated.y;
            }
          }
        }
        renderCompanion();
        fitWorld();
        initCollisionEditor();
        setActorPosition();
        setActorVisual();
        setRideMode(ride.mode);

        status.hidden = true;
        guide.hidden = true;

        addEventListener("resize", fitWorld, { passive:true });
        addEventListener("orientationchange", fitWorld, { passive:true });

        requestAnimationFrame((now) => {
          last = now;
          loop(now);
        });
      }

      boot();
    })();
  </script>
</body>

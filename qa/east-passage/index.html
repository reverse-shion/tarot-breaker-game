<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>TAROT BREAKER — 隔離QA準備</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}
body{background:#101726;color:#eef1ff;max-width:560px;margin:0 auto;padding:26px 18px;line-height:1.65}
h1{font-size:1.35rem}
section{border:1px solid #465071;border-radius:14px;padding:16px;margin-top:14px}
p,small{color:#c1cbe4}
button{font:inherit;padding:12px;border-radius:9px}
button{background:#91a8ff;color:#101726;font-weight:700;border:0;width:100%;margin-top:14px}
button:disabled{opacity:.4}
label{display:block;margin-top:12px}
code{overflow-wrap:anywhere}
#status{font-weight:700}
</style>
</head>
<body>
<h1>東側通路 B案｜隔離QA入口</h1>
<p>既存セーブを保護するため、承認済みの独立オリジンでだけ検証状態を作成できます。通常ゲームの保存や旧プレビューの保存は取り込みません。</p>
<section>
<div id="status" role="status">確認中…</div>
<small id="origin"></small>
</section>
<section>
<p>検証状態（ポートから固定）: <strong id="fixture"></strong></p>
<label><input type="checkbox" id="consent"/> この独立QAサイトの保存先が空で、実際のセーブを扱わないことを確認しました。</label>
<button id="start" disabled>隔離QAの保存を作ってゲームへ</button>
<p id="message" role="alert"></p>
<small>QAページ自身は自動保存しません。既存のQAセーブがあれば上書きを拒否します。保存は明示ボタンを押した場合のみです。保存後は同じ隔離オリジンのタイトル画面を開きます。必ず「つづきから」を押して正規の再開処理で検証してください。</small>
</section>
<script src="../../route-registry.js"></script>
<script src="../../progress.js"></script>
<script src="./qa-safety.js"></script>
<script src="./approved-origin.js"></script>
<script src="./launcher.js"></script>
</body>
</html>
